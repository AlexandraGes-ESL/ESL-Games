<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Dragon Kitchen Quest — A1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#3b2415; --ink2:#6b4a2f; --paper:#fff8ec; --paper2:#fdf0dc;
    --gold:#c8842a; --gold-d:#96601a; --red:#b4442e; --green:#4a7c31;
    --shadow:0 6px 18px rgba(60,32,12,.22);
  }
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,System-ui,Roboto,sans-serif;
    background:#2a1a10; color:var(--ink); overflow:hidden;
  }
  /* ---------- SCENE ---------- */
  #scene{
    position:fixed; inset:0;
    background-image:url('https://i.yapx.ru/eNLcW.jpg');
    background-size:cover; background-position:center;
    transition:background-image .5s ease;
  }
  #scene::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,240,215,.30) 0%,rgba(255,240,215,.12) 45%,rgba(60,30,10,.32) 100%);
    pointer-events:none;
  }
  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 16px;
    background:linear-gradient(180deg,rgba(59,36,21,.92),rgba(59,36,21,.72));
    border-bottom:3px solid var(--gold);
    color:#ffeccc; flex-wrap:wrap;
  }
  #hud .title{font-size:17px;font-weight:800;letter-spacing:.3px;color:#ffd894}
  #hud .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{
    background:rgba(255,248,236,.14); border:1px solid rgba(255,216,148,.45);
    padding:4px 10px; border-radius:20px; font-size:13px; font-weight:700; color:#ffeccc;
  }
  .chip b{color:#ffd894}
  .chip.warn{background:rgba(180,68,46,.35);border-color:#e0876f}
  /* ---------- TABS ---------- */
  #tabs{
    position:absolute; top:58px; left:0; right:0; z-index:25;
    display:flex; gap:6px; padding:8px 16px; overflow-x:auto;
    background:rgba(59,36,21,.55); backdrop-filter:blur(3px);
  }
  .tab{
    flex:1 0 auto; min-width:132px;
    border:2px solid rgba(255,216,148,.35); background:rgba(255,248,236,.10);
    color:#ffeccc; font:inherit; font-size:13px; font-weight:700;
    padding:7px 10px; border-radius:9px; cursor:pointer;
    display:flex; align-items:center; gap:6px; justify-content:center;
    transition:all .18s; white-space:nowrap;
  }
  .tab:hover:not(:disabled){background:rgba(255,248,236,.22)}
  .tab.active{background:var(--gold); border-color:#ffd894; color:#2a1a10}
  .tab:disabled{opacity:.42; cursor:not-allowed}
  .tab .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; border-radius:50%;
    background:rgba(0,0,0,.25); font-size:11px;
  }
  .tab.active .num{background:rgba(0,0,0,.18)}
  .tab.done::after{content:'✓'; color:#8fd06a; font-weight:900}
  .tab.active.done::after{color:#2a1a10}
  /* ---------- PANEL ---------- */
  #panelWrap{
    position:absolute; inset:104px 16px 14px 16px; z-index:20;
    display:flex; gap:14px; align-items:stretch; pointer-events:none;
  }
  #dragonCol{
    width:196px; flex:0 0 196px; pointer-events:none;
    display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
  }
  #dragonImg{
    width:100%; max-height:270px; object-fit:contain; object-position:bottom;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
    transition:opacity .25s;
  }
  #speech{
    background:var(--paper); border:3px solid var(--gold-d); border-radius:14px;
    padding:9px 12px; font-size:13.5px; font-weight:600; line-height:1.4;
    color:var(--ink); box-shadow:var(--shadow); position:relative;
  }

    content:''; position:absolute; bottom:-11px; left:26px;
    border:8px solid transparent; border-top-color:var(--gold-d);
  }
