<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 — The Village Shop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --amber:      #c8720a;
    --amber-lt:   #f5a623;
    --cold:       #6a8fa8;
    --neutral:    #a0946b;
    --warm:       #e8843a;
    --cream:      rgba(255, 246, 228, 0.96);
    --border:     rgba(139, 90, 43, 0.30);
    --text:       #2c1a0e;
    --text-muted: #7a5c35;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Georgia', serif;
  }

  /* ── SCALE WRAPPER ─────────────────────────────────────────── */
  #scale-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 1280px; height: 720px;
    transform-origin: top left;
  }

  /* ── STAGE ─────────────────────────────────────────────────── */
  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* ── MOOD BAR ──────────────────────────────────────────────── */
  #mood-bar-wrap {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    background: rgba(255,246,228,0.88);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    backdrop-filter: blur(6px);
  }
  #mood-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
  }
  #mood-track {
    width: 160px; height: 7px;
    background: rgba(139, 90, 43, 0.14);
    border-radius: 4px;
    overflow: hidden;
  }
  #mood-fill {
    height: 100%;
    width: 25%;
    background: var(--cold);
    border-radius: 4px;
    transition: width 0.6s ease, background 0.6s ease;
  }
  #mood-emoji {
    font-size: 16px;
    line-height: 1;
    transition: opacity 0.4s;
  }

  /* ── SPRITES ───────────────────────────────────────────────── */
  /* Yeo-jin — left, full height */
  #sprite-yeojin-wrap {
    position: absolute;
    left: 2%;
    bottom: 148px;
    height: 82%;
    width: auto;
    transform-origin: bottom left;
    transition: transform 0.35s ease, filter 0.35s ease, opacity 0.4s ease;
  }
  #sprite-yeojin {
    height: 100%;
    width: auto;
    display: block;
    pointer-events: none;
  }

  /* Ginie — right, clipped behind counter */
  #sprite-ginie-wrap {
    position: absolute;
    right: 1%;
    bottom: 148px;
    height: 82%;
    width: auto;
    /* clip bottom 36% — simulates counter hiding her lower body */
    clip-path: inset(0 0 36% 0);
    transform-origin: bottom right;
    transition: transform 0.35s ease, filter 0.35s ease, opacity 0.4s ease;
  }
  #sprite-ginie {
    height: 100%;
    width: auto;
    display: block;
    pointer-events: none;
  }

  /* speaking state */
  .speaking-wrap {
    filter: brightness(1.06) saturate(1.08)
            drop-shadow(0 0 22px rgba(245,166,35,0.30)) !important;
    transform: scale(1.04) !important;
  }
  .dim-wrap {
    filter: brightness(0.70) saturate(0.65) !important;
    opacity: 0.82 !important;
  }
  .hidden-wrap {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* ── DIALOG BOX ────────────────────────────────────────────── */
  #dialog-box {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 148px;
    background: var(--cream);
    border-top: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 14px 44px 12px;
    backdrop-filter: blur(8px);
    z-index: 20;
    transition: opacity 0.4s ease;
  }
  #speaker-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
    transition: color 0.3s;
  }
  #dialog-text {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    min-height: 50px;
  }
  #continue-hint {
    position: absolute;
    bottom: 13px; right: 26px;
    font-size: 12px;
    color: var(--amber);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    user-select: none;
  }
  #continue-hint.visible { opacity: 1; pointer-events: all; cursor: pointer; }

  /* progress dots */
  #dialog-dots {
    position: absolute;
    bottom: 16px; left: 44px;
    display: flex; gap: 5px; align-items: center;
  }
  .ddot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(139,90,43,0.18);
    transition: background 0.25s;
  }
  .ddot.active { background: var(--amber); }

  /* ── QUIZ PANEL ────────────────────────────────────────────── */
  #quiz-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(10px);
    width: 520px;
    background: rgba(255, 250, 242, 0.97);
    border: 1.5px solid rgba(139, 90, 43, 0.22);
    border-radius: 14px;
    padding: 18px 22px 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.14);
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 15;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #quiz-panel.visible {
    display: flex;
    opacity: 1;
    transform: translate(-50%, -50%) translateY(0);
  }

  #quiz-progress {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9a8570;
    text-align: right;
    line-height: 1;
  }

  #quiz-def-box {
    background: linear-gradient(135deg, #fff8ed, #ffefd6);
    border: 1.5px solid rgba(217,140,95,0.45);
    border-radius: 9px;
    padding: 11px 16px;
    text-align: center;
  }
  #quiz-def-box span.lbl {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9a7050;
    margin-bottom: 4px;
  }
  #quiz-definition {
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    line-height: 1.5;
  }

  #quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .qbtn {
    background: #fff;
    border: 1.5px solid rgba(139,90,43,0.26);
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Georgia', serif;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .qbtn:hover:not(:disabled) {
    background: var(--amber-lt);
    border-color: var(--amber);
    color: #fff;
    transform: translateY(-2px);
  }
  .qbtn.correct {
    background: #d4edda; border-color: #4caf50;
    color: #1a5c1e; pointer-events: none;
  }
  .qbtn.wrong {
    background: #fde8e8; border-color: #e57373;
    color: #7a1a1a; pointer-events: none;
  }
  .qbtn:disabled { cursor: default; }

  #quiz-feedback {
    font-size: 13px;
    font-style: italic;
    color: var(--text-muted);
    line-height: 1.5;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #quiz-feedback.show { opacity: 1; }

  #quiz-next-wrap {
    display: flex; justify-content: flex-end;
  }
  #quiz-next {
    background: var(--amber);
    color: #fff; border: none;
    border-radius: 5px;
    padding: 7px 18px;
    font-size: 12px;
    font-family: 'Georgia', serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: background 0.15s, opacity 0.3s;
  }
  #quiz-next.visible { opacity: 1; pointer-events: all; }
  #quiz-next:hover { background: #a35808; }

  /* ── FINALE PANEL ──────────────────────────────────────────── */
  #finale-panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.16);
    text-align: center;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 25;
  }
  #finale-panel.visible { display: flex; }
  #finale-icon { font-size: 42px; line-height: 1; }
  #finale-title { font-size: 20px; font-weight: 700; color: var(--text); }
  #finale-text {
    font-size: 14px; font-style: italic;
    color: var(--text-muted); line-height: 1.65;
    max-width: 400px;
  }
  #finale-score {
    font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a7050;
  }

  /* ── TITLE CARD ────────────────────────────────────────────── */
  #title-card {
    position: absolute;
    inset: 0;
    background: #1a1008;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 30;
    transition: opacity 0.8s ease;
  }
  #title-card .tc-ep {
    font-size: 12px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--amber);
  }
  #title-card h1 {
    font-size: 42px; color: #f5ead5;
    letter-spacing: 0.04em; text-align: center;
  }
  #title-card p {
    font-size: 15px; color: #b09068;
    font-style: italic; text-align: center;
    max-width: 520px; line-height: 1.6;
  }
  #begin-btn {
    margin-top: 10px;
    background: transparent;
    border: 1.5px solid var(--amber);
    color: var(--amber);
    padding: 10px 32px;
    font-size: 14px;
    font-family: 'Georgia', serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s, color 0.2s;
  }
  #begin-btn:hover { background: var(--amber); color: #fff; }
  #begin-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div id="scale-wrap">
  <div id="stage">

    <!-- mood bar -->
    <div id="mood-bar-wrap">
      <span id="mood-label">Ginie's mood</span>
      <div id="mood-track"><div id="mood-fill"></div></div>
      <span id="mood-emoji">❄️</span>
    </div>

    <!-- sprites -->
    <div id="sprite-yeojin-wrap" class="hidden-wrap">
      <img id="sprite-yeojin" src="" alt="Yeo-jin">
    </div>
    <div id="sprite-ginie-wrap" class="hidden-wrap">
      <img id="sprite-ginie" src="" alt="Ginie">
    </div>

    <!-- dialog box -->
    <div id="dialog-box">
      <div id="speaker-name"></div>
      <div id="dialog-text"></div>
      <div id="continue-hint" onclick="advance()">Click to continue ▸</div>
      <div id="dialog-dots"></div>
    </div>

    <!-- quiz panel -->
    <div id="quiz-panel">
      <div id="quiz-progress"></div>
      <div id="quiz-def-box">
        <span class="lbl">What word matches this definition?</span>
        <div id="quiz-definition"></div>
      </div>
      <div id="quiz-options"></div>
      <div id="quiz-feedback"></div>
      <div id="quiz-next-wrap">
        <button id="quiz-next" onclick="quizNext()">Next ▸</button>
      </div>
    </div>

    <!-- finale -->
    <div id="finale-panel">
      <div id="finale-icon"></div>
      <div id="finale-title"></div>
      <div id="finale-text"></div>
      <div id="finale-score"></div>
    </div>

  </div><!-- /stage -->
</div><!-- /scale-wrap -->

<!-- title card (outside scale-wrap so it covers everything) -->
<div id="title-card">
  <div class="tc-ep">Scene 1 · The Village Shop</div>
  <h1>Prove It.</h1>
  <p>"I'll tell you where the farm is — after you prove you know something about the countryside."</p>
  <button id="begin-btn" onclick="startGame()" disabled>Loading…</button>
</div>

<script>
// ─────────────────────────────────────────────────
//  ASSET BASE
// ─────────────────────────────────────────────────
const BASE = 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/';

const ASSETS = {
  yeojin_neutral:  BASE + 'yeojin-neutral.png',
  yeojin_happy:    BASE + 'yeojin-happy.png',
  yeojin_excited:  BASE + 'yeojin-excited.png',
  yeojin_thinking: BASE + 'yeojin-thinking.png',
  ginie_cold:      BASE + 'ginie-cold.png',
  ginie_neutral:   BASE + 'ginie-neutral.png',
  ginie_warm:      BASE + 'ginie-warm.png',
};

// ─────────────────────────────────────────────────
//  PRELOAD
// ─────────────────────────────────────────────────
let loaded = 0;
const total = Object.keys(ASSETS).length;
function preload() {
  Object.values(ASSETS).forEach(src => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      if (loaded >= total) {
        document.getElementById('begin-btn').disabled = false;
        document.getElementById('begin-btn').textContent = 'Begin ▶';
      }
    };
    img.src = src;
  });
}
preload();

// ─────────────────────────────────────────────────
//  SCALE
// ─────────────────────────────────────────────────
(function scaleGame() {
  function resize() {
    const wrap = document.getElementById('scale-wrap');
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    wrap.style.transform = `scale(${s})`;
    wrap.style.left = ((window.innerWidth  - 1280 * s) / 2) + 'px';
    wrap.style.top  = ((window.innerHeight - 720  * s) / 2) + 'px';
    // title card is outside scale-wrap so scale it too
    const tc = document.getElementById('title-card');
    tc.style.transform = `scale(${s})`;
    tc.style.transformOrigin = 'top left';
    tc.style.left = ((window.innerWidth  - 1280 * s) / 2) + 'px';
    tc.style.top  = ((window.innerHeight - 720  * s) / 2) + 'px';
    tc.style.width  = '1280px';
    tc.style.height = '720px';
  }
  resize();
  window.addEventListener('resize', resize);
})();

// ─────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────
let scriptIdx = 0;
let mood      = -2;   // −2 … +2
let quizIdx   = 0;
let score     = 0;
let quizAnswered = false;
let dialogMode = true; // true = dialog phase, false = quiz phase

// ─────────────────────────────────────────────────
//  OPENING SCRIPT  (dialog before quiz)
// ─────────────────────────────────────────────────
const SCRIPT = [
  { type: 'show',   who: 'yeojin', asset: 'yeojin_neutral_front' },
  { type: 'show',   who: 'ginie',  asset: 'ginie_cold' },
  { type: 'dialog', who: 'yeojin', color: '#8b3a3a',
    text: '"Excuse me — do you know Matthew\'s farm? The organic one, up the hill somewhere?"' },
  { type: 'dialog', who: 'ginie',  color: '#4a6070',
    text: '"We\'re not a tourist information centre."',
    ginAsset: 'ginie_cold' },
  { type: 'dialog', who: 'yeojin', color: '#8b3a3a',
    text: '"I\'m not a tourist. I have a work placement there — I just need directions."',
    yeoAsset: 'yeojin_neutral_aside' },
  { type: 'dialog', who: 'ginie',  color: '#4a6070',
    text: '"City girl. Heels, blazer, no idea where she\'s going." A pause. "You know anything about the countryside at all?"',
    ginAsset: 'ginie_neutral_front' },
  { type: 'dialog', who: 'yeojin', color: '#8b3a3a',
    text: '"I… know some things."',
    yeoAsset: 'yeojin_neutral_front' },
  { type: 'dialog', who: 'ginie',  color: '#4a6070',
    text: '"We\'ll see about that. Answer my questions — then I\'ll tell you where the farm is."',
    ginAsset: 'ginie_cold' },
  { type: 'startQuiz' },
];

// ─────────────────────────────────────────────────
//  QUIZ DATA
// ─────────────────────────────────────────────────
const QUIZ = [
  {
    def:     'A row of bushes planted close together as a boundary between fields.',
    answer:  'hedge',
    options: ['hedge','fence','bush','gate'],
    correct: '"A hedge. It grows, changes with the seasons. Different from anything you\'d find in the city."',
    wrong:   '"A fence is wood or metal — it\'s dead. A hedge is alive. Very different things out here."',
    ginCorrect: 'ginie_neutral_front', ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_smiling_warm',  yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'A steep, high face of rock at the edge of the sea or a river.',
    answer:  'cliff',
    options: ['cliff','hill','valley','slope'],
    correct: '"Good. Cliffs are where the land runs out of patience."',
    wrong:   '"A hill is rounded and gentle. A cliff drops straight down. Matthew\'s farm has both nearby."',
    ginCorrect: 'ginie_neutral_front', ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_smiling_warm',  yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'A low area of land between hills or mountains.',
    answer:  'valley',
    options: ['valley','field','plain','hill'],
    correct: '"The farm sits in a valley. Now you\'ll recognise it when you see it."',
    wrong:   '"A field is flat farmland. A valley is the low space between high ground — shaped like a bowl."',
    ginCorrect: 'ginie_neutral_front', ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_smiling_warm',  yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'A small, narrow flow of water — smaller than a river.',
    answer:  'stream',
    options: ['stream','lake','well','river'],
    correct: '"Follow the stream and you\'ll find the gate. That\'s your route."',
    wrong:   '"A lake is still. A river is wide. A stream runs shallow and quick, always downhill."',
    ginCorrect: 'ginie_neutral_front', ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_smiling_warm',  yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'A deep hole dug into the ground to reach underground water.',
    answer:  'well',
    options: ['well','stream','fountain','pump'],
    correct: '"There\'s a well at the crossroads. Stone, old — the lichen\'s been growing there longer than I have."',
    wrong:   '"A fountain is decorative city nonsense. A well is dug by hand — ancient, practical, still working."',
    ginCorrect: 'ginie_warm',    ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_smiling_warm',  yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'A large farm building used to store crops, hay, or shelter animals.',
    answer:  'barn',
    options: ['barn','farmhouse','shed','stable'],
    correct: '"The barn is the biggest thing on Matthew\'s farm. Red roof — you\'ll see it from the road."',
    wrong:   '"A farmhouse is where people sleep. A shed is tiny. A barn is the big one — animals, hay, everything."',
    ginCorrect: 'ginie_warm',    ginWrong: 'ginie_cold',
    yeoCorrect: 'yeojin_has_an_idea',yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'An adult male chicken.',
    answer:  'cockerel',
    options: ['cockerel','hen','chick','lamb'],
    correct: 'Almost a smile. "Most city people say rooster. Cockerel — remember that one."',
    wrong:   '"A hen lays eggs. A chick just hatched. A cockerel wakes the entire village at five in the morning."',
    ginCorrect: 'ginie_warm',    ginWrong: 'ginie_neutral_front',
    yeoCorrect: 'yeojin_has_an_idea',yeoWrong: 'yeojin_neutral_aside',
  },
  {
    def:     'Young sheep, usually less than one year old.',
    answer:  'lambs',
    options: ['lambs','sheep','cows','donkeys'],
    correct: '"Lambs in spring. Matthew has a dozen this year. Fair warning — they\'ll run straight at you."',
    wrong:   '"Sheep are the adults. Lambs are the young ones — small, woolly, extremely curious about strangers."',
    ginCorrect: 'ginie_warm',    ginWrong: 'ginie_neutral_front',
    yeoCorrect: 'yeojin_has_an_idea',yeoWrong: 'yeojin_neutral_aside',
  },
];

// ─────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────
function setSprite(who, assetKey) {
  const img = document.getElementById('sprite-' + who);
  img.src = ASSETS[assetKey] || '';
}

function setSpriteState(who, state) {
  const wrap = document.getElementById('sprite-' + who + '-wrap');
  wrap.classList.remove('speaking-wrap','dim-wrap','hidden-wrap');
  if (state) wrap.classList.add(state);
}

function setMood(delta) {
  mood = Math.max(-2, Math.min(2, mood + delta));
  const pct   = ((mood + 2) / 4) * 82 + 9;
  const color = mood <= -1 ? '#6a8fa8' : mood >= 1 ? '#e8843a' : '#a0946b';
  const emoji = mood <= -1 ? '❄️' : mood >= 1 ? '🌿' : '🌤️';
  document.getElementById('mood-fill').style.width      = pct + '%';
  document.getElementById('mood-fill').style.background = color;
  document.getElementById('mood-emoji').textContent     = emoji;
}

function buildDots(total, current) {
  const wrap = document.getElementById('dialog-dots');
  wrap.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('span');
    d.className = 'ddot' + (i === current ? ' active' : '');
    wrap.appendChild(d);
  }
}

// count dialog steps only
const DIALOG_STEPS = SCRIPT.filter(s => s.type === 'dialog');

function showDialog(who, color, text) {
  document.getElementById('speaker-name').textContent = who.charAt(0).toUpperCase() + who.slice(1);
  document.getElementById('speaker-name').style.color = color;
  document.getElementById('dialog-text').textContent  = text;

  // dots
  const dialogIdx = SCRIPT.slice(0, scriptIdx)
    .filter(s => s.type === 'dialog').length - 1;
  buildDots(DIALOG_STEPS.length, Math.max(0, dialogIdx));

  const hint = document.getElementById('continue-hint');
  hint.classList.remove('visible');
  setTimeout(() => hint.classList.add('visible'), 600);
}

// ─────────────────────────────────────────────────
//  SCRIPT RUNNER
// ─────────────────────────────────────────────────
function runScript() {
  if (scriptIdx >= SCRIPT.length) return;
  const step = SCRIPT[scriptIdx];

  switch (step.type) {

    case 'show':
      setSprite(step.who, step.asset);
      setSpriteState(step.who, 'active');
      scriptIdx++;
      runScript();
      break;

    case 'dialog':
      // swap sprites if needed
      if (step.yeoAsset) setSprite('yeojin', step.yeoAsset);
      if (step.ginAsset) setSprite('ginie',  step.ginAsset);

      // speaking / dim states
      if (step.who === 'yeojin') {
        setSpriteState('yeojin', 'speaking-wrap');
        setSpriteState('ginie',  'dim-wrap');
      } else {
        setSpriteState('ginie',  'speaking-wrap');
        setSpriteState('yeojin', 'dim-wrap');
      }
      showDialog(step.who, step.color, step.text);
      // advance on click (via continue-hint or stage click)
      break;

    case 'startQuiz':
      // hide dialog, show quiz
      document.getElementById('dialog-box').style.opacity = '0';
      document.getElementById('dialog-dots').style.display = 'none';
      document.getElementById('continue-hint').classList.remove('visible');
      // both sprites neutral / active
      setSpriteState('yeojin', 'active');
      setSpriteState('ginie',  'active');
      setSprite('yeojin','yeojin_neutral_front');
      setSprite('ginie', 'ginie_neutral_front');
      setTimeout(() => {
        document.getElementById('dialog-box').style.display = 'none';
        showQuizQuestion();
      }, 400);
      break;
  }
}

function advance() {
  if (!dialogMode) return;
  const step = SCRIPT[scriptIdx];
  if (!step || step.type !== 'dialog') return;
  scriptIdx++;
  runScript();
}

// click anywhere on stage advances dialog
document.getElementById('stage').addEventListener('click', () => {
  if (dialogMode) advance();
});

// ─────────────────────────────────────────────────
//  QUIZ
// ─────────────────────────────────────────────────
function showQuizQuestion() {
  dialogMode = false;
  const panel = document.getElementById('quiz-panel');
  panel.style.display = 'flex';
  setTimeout(() => panel.classList.add('visible'), 20);

  const q = QUIZ[quizIdx];
  document.getElementById('quiz-progress').textContent =
    `Question ${quizIdx + 1} / ${QUIZ.length}`;
  document.getElementById('quiz-definition').textContent = q.def;
  document.getElementById('quiz-feedback').textContent   = '';
  document.getElementById('quiz-feedback').classList.remove('show');
  document.getElementById('quiz-next').classList.remove('visible');
  quizAnswered = false;

  // shuffle options
  const opts = [...q.options].sort(() => Math.random() - 0.5);
  const container = document.getElementById('quiz-options');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className   = 'qbtn';
    btn.textContent = opt;
    btn.onclick     = () => handleAnswer(btn, opt === q.answer, q);
    container.appendChild(btn);
  });
}

function handleAnswer(btn, isCorrect, q) {
  if (quizAnswered) return;
  quizAnswered = true;

  // mark buttons
  document.querySelectorAll('.qbtn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');

  // mood + score
  setMood(isCorrect ? 1 : -1);
  if (isCorrect) score++;

  // swap sprites
  setSprite('yeojin', isCorrect ? q.yeoCorrect : q.yeoWrong);
  setSprite('ginie',  isCorrect ? q.ginCorrect : q.ginWrong);
  setSpriteState('ginie',  isCorrect ? 'speaking-wrap' : 'dim-wrap');
  setSpriteState('yeojin', isCorrect ? 'active' : 'dim-wrap');

  // feedback from Ginie
  const fb = document.getElementById('quiz-feedback');
  fb.textContent = isCorrect ? q.correct : q.wrong;
  fb.classList.add('show');

  const nextBtn = document.getElementById('quiz-next');
  nextBtn.textContent = quizIdx === QUIZ.length - 1 ? 'See result ▸' : 'Next ▸';
  nextBtn.classList.add('visible');
}

function quizNext() {
  quizIdx++;
  if (quizIdx < QUIZ.length) {
    showQuizQuestion();
    setSpriteState('yeojin','active');
    setSpriteState('ginie', 'active');
  } else {
    showFinale();
  }
}

// ─────────────────────────────────────────────────
//  FINALE
// ─────────────────────────────────────────────────
function showFinale() {
  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('mood-bar-wrap').style.opacity = '0';

  const warm = mood >= 1;
  const icon  = warm ? '🌿' : '❄️';
  const title = warm ? 'Ginie warms up.' : 'Ginie stays cold.';
  const text  = warm
    ? '"Matthew\'s farm. Follow the stream north, cross at the stone bridge, through the gate at the bottom of the hill. The barn has a red roof — you won\'t miss it." She almost smiles. "Don\'t let the lambs knock you over."'
    : '"Matthew\'s farm is somewhere past the hill." She turns back to her shelves. "Ask the signpost."';

  // sprites
  setSprite('yeojin', warm ? 'yeojin_has_an_idea' : 'yeojin_neutral_aside');
  setSprite('ginie',  warm ? 'ginie_warm'     : 'ginie_cold');
  setSpriteState('yeojin', warm ? 'speaking-wrap' : 'dim-wrap');
  setSpriteState('ginie',  warm ? 'speaking-wrap' : 'active');

  document.getElementById('finale-icon').textContent  = icon;
  document.getElementById('finale-title').textContent = title;
  document.getElementById('finale-text').textContent  = text;
  document.getElementById('finale-score').textContent =
    `${score} / ${QUIZ.length} correct`;

  document.getElementById('finale-panel').classList.add('visible');
}

// ─────────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────────
function startGame() {
  const tc = document.getElementById('title-card');
  tc.style.opacity = '0';
  setTimeout(() => { tc.style.display = 'none'; }, 800);
  setMood(0); // draw initial bar
  runScript();
}
</script>
