const PREPS=['in','on','under','next to','in front of'];
const RU=['в / внутри','на','под','рядом с','перед'];
const TITLES=['Find the picture','Choose the preposition','Set up the party'];
const tasks=[
 {obj:'ghost',anchor:'jar',prep:'in'}, {obj:'pumpkin',anchor:'table',prep:'on'},
 {obj:'black-cat',anchor:'table',prep:'under'}, {obj:'candles',anchor:'cauldron',prep:'next to'},
 {obj:'black-cat',anchor:'cauldron',prep:'in front of'}, {obj:'pumpkin',anchor:'jar',prep:'in'},
 {obj:'candles',anchor:'table',prep:'on'}, {obj:'ghost',anchor:'table',prep:'under'},
 {obj:'ghost',anchor:'gravestone',prep:'next to'}, {obj:'zombie-hand',anchor:'gravestone',prep:'in front of'}];
const app=document.querySelector('#app'),dialog=document.querySelector('dialog');
let mode=0,index=0,first=0,attempts=0,locked=false,sound=true,order=[],drag=null;
const noun=o=>({'black-cat':'black cat','zombie-hand':'zombie hand'}[o]||o);
const verb=o=>o==='candles'?'are':'is';
const sentence=t=>`The ${noun(t.obj)} ${verb(t.obj)} ${t.prep} the ${t.anchor}.`;
const instruction=t=>`Put the ${noun(t.obj)} ${t.prep} the ${t.anchor}.`;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(text){if(!sound||!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
// Global character tuning: scale and baseline offset in the 600 x 400 scene.
const CHARACTER_STYLE = {'black-cat': {scale:1.25, lower:22}, ghost:{scale:1.22, lower:0}};
function characterPosition(name,x,bottom,h){const c=CHARACTER_STYLE[name]||{scale:1,lower:0};return [x,bottom+c.lower,h*c.scale]}
function img(name,x,bottom,h){[x,bottom,h]=characterPosition(name,x,bottom,h);return `<image href="${A[name]}" x="${x-h*ratios[name]/2}" y="${bottom-h}" width="${h*ratios[name]}" height="${h}"/>`}
const ratios={'black-cat':589/975,'ghost':541/992,'pumpkin':820/718,'candles':578/818,'cauldron':796/820,'gravestone':512/819,'skeleton':380/988,'zombie-hand':612/810};
// Fixed 600 × 400 coordinate system shared by pictures and placement targets.
function positions(anchor){if(anchor==='table')return {'on':[300,181,96],'under':[300,337,96],'next to':[490,337,96]};if(anchor==='jar')return {'in':[300,307,100],'next to':[450,337,100],'in front of':[300,360,100]};return {'next to':[450,337,112],'in front of':[300,360,112]}}
function jar(){return `<path d="M245 142 L245 160 Q222 175 222 202 V316 Q222 335 242 335 H358 Q378 335 378 316 V202 Q378 175 355 160 V142Z" fill="#bde5ee" fill-opacity=".24" stroke="#6c929d" stroke-width="4"/><ellipse cx="300" cy="143" rx="56" ry="9" fill="#e9f6f7" stroke="#6c929d" stroke-width="4"/><path d="M238 203 V305" stroke="white" stroke-width="6" opacity=".7"/>`}
function anchorArt(anchor){if(anchor==='table')return `<path d="M170 193V339M430 193V339" stroke="#7b5947" stroke-width="19"/><rect x="145" y="181" width="310" height="23" rx="6" fill="#c99365" stroke="#866044" stroke-width="3"/><path d="M162 190H438" stroke="#e3bc8c" stroke-width="3"/>`;if(anchor==='jar')return jar();return img(anchor,300,337,anchor==='cauldron'?179:210)}
function scene(t,prep,{placement=false,preview=false}={}){const pos=positions(t.anchor),p=pos[prep];let content=anchorArt(t.anchor);if(p&&!placement)content+=img(t.obj,...p);if(t.anchor==='jar'&&prep==='in'&&!placement)content+=`<path d="M230 320Q300 337 370 320" fill="none" stroke="#7aa9b4" stroke-width="3" opacity=".7"/>`;if(placement){content+=Object.entries(pos).map(([key,raw],i)=>{const v=characterPosition(t.obj,...raw);return `<circle class="target" tabindex="0" role="button" aria-label="Position ${i+1}" data-place="${key}" cx="${v[0]}" cy="${v[1]-v[2]/2}" r="28"/>`}).join('');content+=`<g class="move-item" data-draggable="true" role="img" aria-label="${noun(t.obj)}">${img(t.obj,75,337,96)}</g>`}
return `<svg ${placement?'id="placementSvg"':''} viewBox="0 0 600 400" role="img" aria-label="${preview?'Preposition illustration':placement?'Arrange the object':'Halloween scene'}"><rect width="600" height="400" rx="18" fill="${t.obj==='ghost'?'#777487':'#f1ebf3'}"/><path d="M0 337H600V400H0Z" fill="${t.obj==='ghost'?'#a49aaa':'#e2d8cb'}"/><path d="M0 337H600" stroke="${t.obj==='ghost'?'#85788c':'#cabdb0'}" stroke-width="2"/><circle cx="542" cy="53" r="23" fill="#eadfb7"/><path d="M523 38Q528 69 554 73Q517 84 519 49" fill="${t.obj==='ghost'?'#777487':'#f1ebf3'}"/>${content}</svg>`}
function home(){if('speechSynthesis'in window)speechSynthesis.cancel();drag=null;app.innerHTML=`<section class="hero"><div><p class="eyebrow">A LITTLE ENGLISH ADVENTURE</p><h1>The Midnight House</h1><p class="muted">Help our Halloween friends get ready for the party. Find, describe, and arrange their hiding places.</p><p>in · on · under · next to · in front of</p></div><img src="${A.kitchen}" alt="Watercolour witch’s kitchen"></section><section class="modes">${TITLES.map((title,i)=>`<button class="mode" data-mode="${i}"><span class="eyebrow">LEVEL ${i+1}</span><b>${title}</b><small>${['Read a clue. Choose one of three pictures.','Look at one picture. Choose the missing preposition.','Drag the object or tap a marked position to follow the clue.'][i]}</small></button>`).join('')}</section><p class="muted">10 tasks per level · No timer · Open Guide whenever you need it.</p>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(+b.dataset.mode))}
function start(m){mode=m;index=0;first=0;render()}
function render(){locked=false;attempts=0;drag=null;let t=tasks[index];order=shuffle(Object.keys(positions(t.anchor)));let title=mode===0?sentence(t):mode===1?`The ${noun(t.obj)} ${verb(t.obj)} ___ the ${t.anchor}.`:instruction(t);app.innerHTML=`<div class="bar"><div><p class="eyebrow">LEVEL ${mode+1} · ${index+1} / ${tasks.length}</p><h2>${TITLES[mode]}</h2></div><button id="listen">▶ Listen</button></div><div class="progress"><i style="width:${index/tasks.length*100}%"></i></div><section class="quest"><p class="prompt">${title}</p><p class="muted">${['Choose the matching picture.','Choose the missing preposition.','Move the object to a circle. Or simply tap a circle.'][mode]}</p>${mode===0?`<div class="cards">${order.map((p,i)=>`<button class="picture" data-answer="${p}" aria-label="Picture ${i+1}">${scene(t,p)}<span>${String.fromCharCode(65+i)}</span></button>`).join('')}</div>`:mode===1?`<div class="large">${scene(t,t.prep)}</div><div class="options">${shuffle(PREPS).map(p=>`<button class="chip" data-answer="${p}">${p}</button>`).join('')}</div>`:`<div class="large"><div class="stage">${scene(t,null,{placement:true})}</div><div class="tray">${noun(t.obj)} · Drag it, or choose a marked position.</div></div>`}<div class="nextrow"><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="primary" id="next" hidden>Next →</button></div></section>`;
document.querySelector('#listen').onclick=()=>speak(mode===1?`Where ${verb(t.obj)} the ${noun(t.obj)}?`:mode===2?instruction(t):sentence(t));app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b.dataset.answer,b));document.querySelector('#next').onclick=()=>{index++;index===tasks.length?finish():render()};if(mode===2)setupDrag()}
function check(answer,button){if(locked)return;attempts++;let ok=answer===tasks[index].prep,f=document.querySelector('#feedback');if(!ok){f.className='feedback error';f.textContent='Try again. Look at the object and its position.';if(button){button.classList.add('wrong');button.disabled=true}return}locked=true;if(attempts===1)first++;f.className='feedback';f.textContent='Yes! '+sentence(tasks[index]);if(button)button.classList.add('correct');app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);if(mode===2){document.querySelector('.stage').innerHTML=scene(tasks[index],answer)}document.querySelector('#next').hidden=false;speak(sentence(tasks[index]))}
function setupDrag(){const svg=document.querySelector('#placementSvg'),item=svg.querySelector('[data-draggable]');svg.querySelectorAll('[data-place]').forEach(c=>{c.onclick=()=>check(c.dataset.place);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();check(c.dataset.place)}}});const point=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};item.onpointerdown=e=>{if(locked)return;e.preventDefault();let p=point(e);drag={x:p.x,y:p.y};item.setPointerCapture(e.pointerId)};item.onpointermove=e=>{if(!drag)return;let p=point(e);item.setAttribute('transform',`translate(${p.x-drag.x} ${p.y-drag.y})`)};item.onpointercancel=()=>{drag=null;item.removeAttribute('transform')};item.onpointerup=e=>{if(!drag)return;let p=point(e);drag=null;let entries=Object.entries(positions(tasks[index].anchor)).map(([key,v])=>({key,d:Math.hypot(p.x-characterPosition(tasks[index].obj,...v)[0],p.y-(characterPosition(tasks[index].obj,...v)[1]-characterPosition(tasks[index].obj,...v)[2]/2))})).sort((a,b)=>a.d-b.d);if(entries[0].d<76){check(entries[0].key)}else{document.querySelector('#feedback').textContent='Drop it near a marked circle.'}if(!locked)item.removeAttribute('transform')}}
function finish(){let best=first;try{let key='midnight-v2-level-'+mode;best=Math.max(first,Number(localStorage.getItem(key)||0));localStorage.setItem(key,best)}catch{}app.innerHTML=`<section class="result"><p class="eyebrow">LEVEL ${mode+1} COMPLETE</p><h1>Party ready!</h1><p>You completed all 10 clues.</p><div class="score">${first} / 10</div><p class="muted">Correct on the first try · Best: ${best} / 10</p><div class="actions"><button id="replay">Play again</button><button id="menu">Choose a level</button>${mode<2?'<button class="primary" id="advance">Next level →</button>':''}</div></section>`;document.querySelector('#replay').onclick=()=>start(mode);document.querySelector('#menu').onclick=home;if(mode<2)document.querySelector('#advance').onclick=()=>start(mode+1)}
function guide(){document.querySelector('#guideCards').innerHTML=PREPS.map((p,i)=>{let t={obj:'pumpkin',anchor:i===0?'jar':i<3?'table':'cauldron',prep:p};return `<article>${scene(t,p,{preview:true})}<b>${p}</b><p lang="ru">${RU[i]}</p><small>${sentence(t)}</small></article>`}).join('');dialog.showModal()}
document.querySelector('#guideBtn').onclick=guide;document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#home').onclick=home;document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.querySelector('.nav-label').textContent=sound?'On':'Off';e.currentTarget.setAttribute('aria-label',sound?'Sound on':'Sound off');e.currentTarget.title=sound?'Sound on':'Sound off';e.currentTarget.style.opacity=sound?'1':'.55';e.currentTarget.setAttribute('aria-pressed',String(sound));if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};home();
</script></html>
