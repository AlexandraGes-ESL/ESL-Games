<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Quest: Capybara's Day!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FFE680 50%, #A8D5FF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 30px 15px;
            color: #1b3d2b;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            background: #ffffff;
            padding: 14px 28px;
            border-radius: 26px;
            box-shadow: 0 6px 0 #FFB6D9, 0 12px 20px rgba(0,0,0,0.08);
            border: 4px solid #ffffff;
            width: 100%;
            max-width: 800px;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-icon {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        h1 {
            color: #d946a6;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #a855a8;
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 12px 0 #FFB6D9, 0 20px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            margin-top: 10px;
        }

        .menu-header-decor {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .menu-capybara-icon {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .menu-title {
            font-size: 2rem;
            color: #d946a6;
            font-weight: 800;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            margin-bottom: 25px;
        }

        .mode-btn {
            padding: 16px;
            border: 3px solid #ffc0eb;
            background: #fef5fb;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            color: #d946a6;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 0 #FFB6D9;
            text-align: center;
        }

        .mode-btn-emoji {
            font-size: 2rem;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #FFB6D9;
            background: #ffffff;
        }

        .mode-btn.selected {
            border-color: #d946a6;
            background: #ffe0f0;
            box-shadow: 0 5px 0 #d946a6;
        }

        .start-btn {
            width: 100%;
            padding: 18px;
            border: none;
            background: #e67e22;
            color: white;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 7px 0 #d35400;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #d35400;
            background: #f39c12;
        }

        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 12px 0 #FFB6D9, 0 20px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        .game-container.active {
            display: flex;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .audio-box {
            background: #fef5fb;
            border: 3px solid #ffc0eb;
            border-radius: 20px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 0 #FFB6D9;
            flex: 1;
            min-width: 240px;
            justify-content: center;
        }

        .btn-audio {
            background: #d946a6;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #a855a8;
            flex-shrink: 0;
        }

        .btn-audio:hover {
            transform: scale(1.06);
            background: #ec4899;
        }

        .word-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #d946a6;
            letter-spacing: 0.5px;
            word-break: break-all;
        }

        .hearts-container {
            display: flex;
            gap: 8px;
            background: #fef5fb;
            padding: 10px 18px;
            border-radius: 20px;
            border: 3px solid #ffc0eb;
            box-shadow: 0 5px 0 #FFB6D9;
            align-items: center;
        }

        .heart-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            transition: opacity 0.3s, transform 0.3s;
        }

        .heart-img.lost {
            opacity: 0.2;
            filter: grayscale(1);
            transform: scale(0.85);
        }

        .btn-nav {
            background: #ffffff;
            border: 3px solid #ffc0eb;
            color: #d946a6;
            font-family: inherit;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #FFB6D9;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            background: #fef5fb;
            box-shadow: 0 7px 0 #FFB6D9;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            background-color: #FFE0F0;
            border-radius: 24px;
            padding: 25px 15px;
            margin-bottom: 15px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.08);
            overflow: auto;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .honeycomb-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 5px 10px 10px 10px;
        }

        .hex-row {
            display: flex;
            gap: 2px;
        }

        .hex-row + .hex-row {
            margin-top: -26px;
        }

        .hex-row-odd {
            margin-left: 48px;
        }

        .hex {
            width: 94px;
            height: 108px;
            background: #ffffff;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
            transform: none !important;
            filter: drop-shadow(0px 0px 1.5px #FFB6D9);
            flex-shrink: 0;
        }

        .hex.start {
            background: #fff4e6;
            cursor: default;
        }

        .hex.finish {
            background: #f3e8ff;
            cursor: default;
        }

        .hex.item:hover {
            background: #fff0f8;
        }

        .hex.selected {
            background: #e0f5f1 !important;
        }

        .hex.incorrect {
            background: #ffdede !important;
            animation: shake 0.35s ease-in-out;
        }

        .hex-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hex-emotion-img {
            width: 62px;
            height: 62px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .hex-capybara-overlay {
            position: absolute;
            width: 72px;
            height: 72px;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
            z-index: 10;
            animation: capybaraPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes capybaraPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1b3d2b;
            background: #ffffff;
            padding: 14px 20px;
            border-radius: 20px;
            border: 3px solid #ffc0eb;
            box-shadow: 0 5px 0 #FFB6D9;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-value {
            color: #e67e22;
            font-weight: 800;
            font-size: 1.3rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(217, 70, 166, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 30px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 14px 0 #a855a8;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #fff;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-capybara-final {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 12px auto;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
        }

        .modal-content h2 {
            color: #d946a6;
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 800;
        }

        .modal-content p {
            color: #a855a8;
            margin-bottom: 22px;
            font-size: 1.1rem;
            line-height: 1.5;
            font-weight: 600;
        }

        .modal-btn {
            width: 100%;
            padding: 16px;
            border: none;
            background: #e67e22;
            color: white;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #d35400;
            background: #f39c12;
        }

        .app-footer {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            background: #ffffff;
            border-radius: 22px;
            border: 3px solid #fff;
            box-shadow: 0 5px 0 #FFB6D9;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            width: 100%;
            max-width: 800px;
        }

        .footer-by {
            color: #d946a6;
            font-size: 0.95rem;
        }

        .footer-links {
            display: flex;
            gap: 12px;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            transition: all 0.2s;
        }

        .footer-link.boosty {
            background: #fff4e6;
            color: #d35400;
            border: 2px solid #f39c12;
        }

        .footer-link.tg {
            background: #eef8ff;
            color: #0088cc;
            border: 2px solid #0088cc;
        }

        .footer-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        @media (max-width: 850px) {
            body { padding: 10px; }
            h1 { font-size: 1.8rem; }
            header { padding: 12px 20px; }
            .menu-screen { padding: 20px 15px; border-radius: 24px; }
            .mode-grid { grid-template-columns: 1fr; gap: 10px; }
            .game-container { padding: 15px 10px; border-radius: 24px; }
            .controls { gap: 8px; }
            .audio-box { min-width: 160px; padding: 6px 12px; }
            .word-text { font-size: 1.2rem; }
            .btn-audio { width: 42px; height: 42px; }
            .hearts-container { padding: 8px 12px; }
            .heart-img { width: 24px; height: 24px; }
        }

        @media (max-width: 1000px) and (orientation: landscape) {
            body { padding: 8px; }
            header { display: none; }
            .app-footer { display: none; }
            .game-container { padding: 10px; }
            .controls { margin-bottom: 8px; }
            .status-bar { padding: 8px 14px; font-size: 0.95rem; }
            .board-wrapper { padding: 12px 8px; margin-bottom: 8px; }
            .hex {
                width: 62px;
                height: 71px;
            }
            .hex-row + .hex-row { margin-top: -17px; }
            .hex-row-odd { margin-left: 32px; }
            .hex-emotion-img { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png" alt="Capybara" class="header-icon">
            <h1>Emotion Quest!</h1>
        </div>
        <p class="subtitle">Explore emotions with our cute capybara friend!</p>
    </header>

    <div class="menu-screen" id="menuScreen">
        <div class="menu-header-decor">
            <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png" alt="Capybara" class="menu-capybara-icon">
            <h2 class="menu-title">Choose Your Mode</h2>
        </div>

        <div class="mode-grid">
            <button class="mode-btn selected" data-mode="word" onclick="window.selectMode('word')">
                <span class="mode-btn-emoji">📝</span>
                <span>Word Mode</span>
                <small style="font-size: 0.8rem; opacity: 0.8;">Tap the emotion!</small>
            </button>
            <button class="mode-btn" data-mode="story" onclick="window.selectMode('story')">
                <span class="mode-btn-emoji">📖</span>
                <span>Story Mode</span>
                <small style="font-size: 0.8rem; opacity: 0.8;">Live the day!</small>
            </button>
        </div>

        <button class="start-btn" onclick="window.startGame()">
            <span>START GAME</span> 🐹
        </button>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="controls">
            <div class="audio-box">
                <button class="btn-audio" id="btnPlayAudio" title="Listen" aria-label="Listen">
                    <svg viewBox="0 0 24 24" style="width:26px; height:26px; fill:currentColor;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <span class="word-text" id="targetWordText">???</span>
            </div>

            <div class="hearts-container" id="heartsContainer">
                <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png" alt="Life" class="heart-img" style="width:30px; height:30px;">
                <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png" alt="Life" class="heart-img" style="width:30px; height:30px;">
                <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png" alt="Life" class="heart-img" style="width:30px; height:30px;">
            </div>

            <button class="btn-nav" onclick="window.backToMenu()">📋 Menu</button>
        </div>

        <div class="board-wrapper">
            <div class="honeycomb-container" id="board"></div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span>Steps Left:</span>
                <span class="status-value" id="stepsLeftCount">7</span>
            </div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/happy.png" alt="Happy Capybara" class="modal-capybara-final">
            <h2>Awesome! 🎉</h2>
            <p>You helped our capybara friend understand all the emotions!</p>
            <button class="modal-btn" onclick="window.restartGame()">Play Again 🐹</button>
        </div>
    </div>

    <div class="modal" id="loseModal">
        <div class="modal-content">
            <img src="https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/sad.png" alt="Sad Capybara" class="modal-capybara-final">
            <h2>Oops! 😢</h2>
            <p>The capybara got confused. Let's try again!</p>
            <button class="modal-btn" onclick="window.restartGame()">Try Again 🔄</button>
        </div>
    </div>

    <footer class="app-footer">
        <span class="footer-by">Made with ❤️ by Alexandra Ges · ESL</span>
        <div class="footer-links">
            <a class="footer-link boosty" href="https://boosty.to/alexandrages_esl" target="_blank" rel="noopener" aria-label="Boosty">
                <span>Boosty</span>
            </a>
            <a class="footer-link tg" href="https://t.me/alexandragesESL" target="_blank" rel="noopener" aria-label="Telegram">
                <span>Telegram</span>
            </a>
        </div>
    </footer>

    <script>
        const EMOTIONS = {
            angry: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/angry.png',
            bored: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/bored.png',
            confused: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/confused.png',
            cool: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/cool.png',
            happy: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/happy.png',
            hungry: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/hungry.png',
            lovely: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/lovely.png',
            sad: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/sad.png',
            shy: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/shy.png',
            surprised: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/surprised.png',
            thirsty: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/thirsty.png',
            tired: 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/tired.png'
        };

        const CAPYBARA_START = 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/character-start.png';
        const CAPYBARA_HAPPY = 'https://raw.githubusercontent.com/AlexandraGes-ESL/Pictures/main/final-positive-result_ult.png';

        const STORY_MODE = [
            { prompt: 'I wake up and see the sun! ☀️', correct: 'happy' },
            { prompt: 'I eat lots of grass for breakfast! 🌾', correct: 'happy' },
            { prompt: 'Uh oh... I lost my favorite toy 😞', correct: 'sad' },
            { prompt: 'Someone took my snacks! 😤', correct: 'angry' },
            { prompt: 'I don\'t understand the puzzle 🤔', correct: 'confused' },
            { prompt: 'Cool! My friend looks so cool! 😎', correct: 'cool' },
            { prompt: 'Wow! What a big surprise! 🎉', correct: 'surprised' },
            { prompt: 'It\'s night time... I\'m very tired 😴', correct: 'tired' }
        ];

        let currentMode = 'word';
        let gameState = {
            board: [],
            capybaraPath: [],
            currentPathIndex: 0,
            currentTargetEmotion: '',
            lives: 3,
            isPlaying: false,
            storyIndex: 0
        };

        const ROWS = 5, COLS = 7;

        const verifiedPaths = [
            [{r:0,c:0}, {r:0,c:1}, {r:0,c:2}, {r:0,c:3}, {r:0,c:4}, {r:1,c:4}, {r:2,c:5}, {r:3,c:5}, {r:4,c:6}],
            [{r:0,c:0}, {r:0,c:1}, {r:0,c:2}, {r:1,c:2}, {r:1,c:3}, {r:2,c:4}, {r:3,c:4}, {r:3,c:5}, {r:4,c:6}],
            [{r:0,c:0}, {r:0,c:1}, {r:0,c:2}, {r:1,c:2}, {r:2,c:3}, {r:3,c:3}, {r:4,c:4}, {r:4,c:5}, {r:4,c:6}],
            [{r:0,c:0}, {r:0,c:1}, {r:1,c:1}, {r:1,c:2}, {r:2,c:3}, {r:2,c:4}, {r:3,c:4}, {r:4,c:5}, {r:4,c:6}]
        ];

        window.selectMode = function(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
        }

        window.startGame = function() {
            gameState.lives = 3;
            gameState.currentPathIndex = 0;
            gameState.isPlaying = true;
            gameState.storyIndex = 0;
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameContainer').classList.add('active');
            updateHearts();
            setupBoard();
            nextTurn();
        }

        function getNeighbors(r, c) {
            let candidates = [];
            if(r % 2 === 0) {
                candidates = [{r: r, c: c-1}, {r: r, c: c+1}, {r: r-1, c: c-1}, {r: r-1, c: c}, {r: r+1, c: c-1}, {r: r+1, c: c}];
            } else {
                candidates = [{r: r, c: c-1}, {r: r, c: c+1}, {r: r-1, c: c}, {r: r-1, c: c+1}, {r: r+1, c: c}, {r: r+1, c: c+1}];
            }
            return candidates.filter(p => p.r >= 0 && p.r < ROWS && p.c >= 0 && p.c < COLS);
        }

        function setupBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            gameState.board = [];

            gameState.capybaraPath = verifiedPaths[Math.floor(Math.random() * verifiedPaths.length)];
            const path = gameState.capybaraPath;
            const pathLen = path.length - 2;

            let pathEmotions = [];
            const emotionList = Object.keys(EMOTIONS);
            for(let i = 0; i < pathLen; i++) {
                const prev = pathEmotions[i-1] || null;
                const valid = emotionList.filter(w => w !== prev);
                pathEmotions.push(valid[Math.floor(Math.random() * valid.length)]);
            }

            const boardObj = {};
            for(let idx = 0; idx < pathLen; idx++) {
                const pos = path[idx + 1];
                boardObj[pos.r + ',' + pos.c] = pathEmotions[idx];
            }
            boardObj['0,0'] = 'start';
            boardObj['4,6'] = 'finish';

            for(let r = 0; r < ROWS; r++) {
                gameState.board[r] = [];
                for(let c = 0; c < COLS; c++) {
                    const key = r + ',' + c;
                    let emotion = '';
                    let type = 'item';

                    if(key === '0,0') {
                        type = 'start';
                        emotion = 'start';
                    } else if(key === '4,6') {
                        type = 'finish';
                        emotion = 'finish';
                    } else if(boardObj[key]) {
                        emotion = boardObj[key];
                    } else {
                        const forbidden = new Set();
                        for(let stepIdx = 0; stepIdx < pathLen; stepIdx++) {
                            const capyPos = path[stepIdx];
                            const targetEmotion = pathEmotions[stepIdx];
                            const nbrs = getNeighbors(capyPos.r, capyPos.c);
                            if(nbrs.some(n => n.r === r && n.c === c)) {
                                forbidden.add(targetEmotion);
                            }
                        }
                        let available = emotionList.filter(w => !forbidden.has(w));
                        if(available.length === 0) available = emotionList;
                        emotion = available[Math.floor(Math.random() * available.length)];
                        boardObj[key] = emotion;
                    }

                    const emotionUrl = (type === 'start') ? CAPYBARA_START : (type === 'finish' ? CAPYBARA_HAPPY : EMOTIONS[emotion]);
                    gameState.board[r][c] = {r, c, type, emotion, emotionUrl};
                }
            }

            for(let r = 0; r < ROWS; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'hex-row' + (r % 2 === 1 ? ' hex-row-odd' : '');

                for(let c = 0; c < COLS; c++) {
                    const cell = gameState.board[r][c];
                    const hexEl = document.createElement('div');
                    hexEl.className = 'hex ' + cell.type;
                    hexEl.id = 'hex-' + r + '-' + c;

                    let innerHtml = '<div class="hex-content">';
                    innerHtml += '<img src="' + cell.emotionUrl + '" class="hex-emotion-img" alt="' + cell.emotion + '" />';
                    innerHtml += '</div>';

                    hexEl.innerHTML = innerHtml;

                    if(cell.type === 'item') {
                        hexEl.addEventListener('click', (function(r, c) {
                            return function() { handleCellClick(r, c); }
                        })(r, c));
                    }

                    rowEl.appendChild(hexEl);
                }

                boardEl.appendChild(rowEl);
            }
        }

        function nextTurn() {
            if(!gameState.isPlaying) return;

            const pathLen = gameState.capybaraPath.length - 2;
            const nextStepIndex = gameState.currentPathIndex + 1;

            if(nextStepIndex > pathLen) {
                moveCapybaraOverlay(4, 6);
                setTimeout(() => showVictory(), 600);
                return;
            }

            const nextCellPos = gameState.capybaraPath[nextStepIndex];
            const nextCell = gameState.board[nextCellPos.r][nextCellPos.c];
            gameState.currentTargetEmotion = nextCell.emotion;

            if(currentMode === 'word') {
                document.getElementById('targetWordText').textContent = gameState.currentTargetEmotion.toUpperCase();
            } else {
                const story = STORY_MODE[gameState.storyIndex % STORY_MODE.length];
                document.getElementById('targetWordText').textContent = story.prompt;
                gameState.currentTargetEmotion = story.correct;
                gameState.storyIndex++;
            }

            document.getElementById('stepsLeftCount').textContent = (pathLen + 1) - nextStepIndex;
        }

        function handleCellClick(r, c) {
            if(!gameState.isPlaying || gameState.currentTargetEmotion === '') return;

            const cell = gameState.board[r][c];
            const hexEl = document.getElementById('hex-' + r + '-' + c);
            const currentPos = gameState.capybaraPath[gameState.currentPathIndex];
            const prevPos = gameState.currentPathIndex > 0 ? gameState.capybaraPath[gameState.currentPathIndex - 1] : null;

            const neighbors = getNeighbors(currentPos.r, currentPos.c);
            const isNeighbor = neighbors.some(n => n.r === r && n.c === c);

            if(!isNeighbor || (prevPos && prevPos.r === r && prevPos.c === c)) return;

            if(cell.emotion === gameState.currentTargetEmotion) {
                hexEl.classList.add('selected');
                gameState.currentPathIndex++;
                playSound('munch');
                moveCapybaraOverlay(r, c);
                setTimeout(() => nextTurn(), 600);
            } else {
                gameState.lives--;
                updateHearts();
                hexEl.classList.add('incorrect');
                playSound('phew');

                setTimeout(() => hexEl.classList.remove('incorrect'), 400);

                if(gameState.lives <= 0) {
                    gameState.isPlaying = false;
                    setTimeout(() => showGameOver(), 500);
                }
            }
        }

        function moveCapybaraOverlay(targetR, targetC) {
            const oldCapy = document.getElementById('capy-overlay');
            if(oldCapy) oldCapy.remove();

            const newHex = document.getElementById('hex-' + targetR + '-' + targetC);
            const contentDiv = newHex.querySelector('.hex-content');

            const newCapy = document.createElement('img');
            newCapy.src = CAPYBARA_START;
            newCapy.className = 'hex-capybara-overlay';
            newCapy.id = 'capy-overlay';
            newCapy.alt = 'Capybara';
            contentDiv.appendChild(newCapy);
        }

        function updateHearts() {
            const hearts = document.querySelectorAll('.hearts-container .heart-img');
            hearts.forEach((h, idx) => {
                if(idx < gameState.lives) {
                    h.classList.remove('lost');
                } else {
                    h.classList.add('lost');
                }
            });
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if(type === 'munch') {
                    for(let i = 0; i < 3; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(450 + i * 120, ctx.currentTime + i * 0.08);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.07);
                        osc.start(ctx.currentTime + i * 0.08);
                        osc.stop(ctx.currentTime + i * 0.08 + 0.07);
                    }
                } else if(type === 'phew') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch(e) {
                console.log('Audio not available');
            }
        }

        function showVictory() {
            gameState.isPlaying = false;
            document.getElementById('winModal').classList.add('show');
        }

        function showGameOver() {
            gameState.isPlaying = false;
            document.getElementById('loseModal').classList.add('show');
        }

        window.restartGame = function() {
            document.getElementById('winModal').classList.remove('show');
            document.getElementById('loseModal').classList.remove('show');
            startGame();
        }

        window.backToMenu = function() {
            gameState.isPlaying = false;
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('menuScreen').style.display = 'flex';
        }

        // Preload images
        Object.values(EMOTIONS).forEach(url => {
            const img = new Image();
            img.src = url;
        });
    </script>
</body>
