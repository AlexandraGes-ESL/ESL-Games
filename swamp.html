<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wisps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:Georgia,serif;}
#stage{position:absolute;inset:0;}

/* ТУМАН — рассеивается в конце */
#fog{position:absolute;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(circle at 60% 50%,rgba(255,255,255,.55),rgba(220,230,240,.25) 60%,transparent 80%);
  opacity:1;transition:opacity 3s ease;}
#fog.clear{opacity:0;}

/* ====== ОГОНЁК ====== */
.wisp{position:absolute;cursor:pointer;z-index:20;will-change:transform;}
.wisp .core{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle,
    rgba(220,240,255,.95) 0%,
    rgba(110,190,255,.7) 25%,
    rgba(60,150,255,.35) 45%,
    rgba(40,120,255,.12) 65%,
    rgba(30,108,255,0) 80%);
  filter:blur(2px);
  animation:flick 2s ease-in-out infinite;
}
@keyframes flick{
  0%,100%{transform:scale(1);opacity:.65;}
  50%{transform:scale(1.25);opacity:1;}
}
.wisp.pop{animation:pop .6s forwards;pointer-events:none;}
@keyframes pop{
  0%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.6);opacity:1;}
  100%{transform:scale(0);opacity:0;}
}

/* МОДАЛКА */
#ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(5,15,20,.55);backdrop-filter:blur(3px);}
#ov.on{display:flex;}
#box{background:#0a1c24;border:1px solid #4fa8ff;border-radius:16px;padding:26px 30px;
  max-width:440px;width:90%;color:#eaf6ff;box-shadow:0 0 30px #1e6cff88;}
#q{font-size:16px;line-height:1.5;margin-bottom:18px;}
.opt{display:block;width:100%;text-align:left;background:rgba(80,168,255,.08);
  border:1px solid #4fa8ff55;border-radius:10px;color:#dff0ff;font-size:14px;
  padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:.2s;font-family:Georgia,serif;}
.opt:hover{background:#4fa8ff22;transform:translateX(4px);}
.opt.correct{background:#3fd07a33;border-color:#3fd07a;}
.opt.wrong{background:#e0503033;border-color:#e05030;}
#fb{min-height:18px;text-align:center;font-size:13px;margin-top:6px;}

/* СЧЁТЧИК */
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(5,20,28,.6);border:1px solid #4fa8ff;border-radius:30px;
  padding:6px 18px;color:#cdeaff;font-size:13px;letter-spacing:1px;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fog"></div>
<div id="hud">Wisps caught: <span id="cnt">0</span> / <span id="tot">12</span></div>

<div id="ov"><div id="box">
  <div id="q"></div><div id="opts"></div><div id="fb"></div>
</div></div>

<script>
/* ====== ВОПРОСЫ ====== */
const WISPS=[
{q:"While Vasilisa ___ near the swamp, she ___ a strange whisper.",
 o:["walked / was hearing","was walking / heard"],c:1},
{q:"The wind ___ strongly when the dark curse ___.",
 o:["was blowing / began","blew / was beginning"],c:0},
{q:"I ___ magical mushrooms when I suddenly ___ a blue light.",
 o:["was picking / saw","picked / was seeing"],c:0},
{q:"While the frogs ___ their song, a dark shadow ___ the moon.",
 o:["sang / covered","were singing / covered"],c:1},
{q:"The green water ___ when a scary hand ___ my shoe!",
 o:["was bubbling / grabbed","bubbled / was grabbing"],c:0},
{q:"I ___ under the old oak tree when the magic lightning ___.",
 o:["slept / was striking","was sleeping / struck"],c:1},
{q:"While the forest spirits ___, the fire suddenly ___ out.",
 o:["danced / was going","were dancing / went"],c:1},
{q:"The black birds ___ away when the trees ___ to whisper my name.",
 o:["flew / started","were flying / started"],c:0},
{q:"I ___ to run away when I ___ my memory.",
 o:["was trying / lost","tried / was losing"],c:0},
{q:"While the old witch ___ a potion, her pot ___!",
 o:["brewed / exploded","was brewing / exploded"],c:1},
{q:"The stars ___ brightly when the thick fog ___ the path.",
 o:["were shining / hid","shone / was hiding"],c:0},
{q:"I ___ at the dark water when a green face ___ back at me!",
 o:["was looking / looked","looked / was looking"],c:0,
 link:true} // ← последний: переход к Кикиморе
];
let caught = 0;
/* ====== ЗВУК (магический дзинь) ====== */
let ac=null;
function chime(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const notes=[880,1174,1567,2093];
  notes.forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type='sine';
    o.frequency.setValueAtTime(f,ac.currentTime+i*0.08);
    g.gain.setValueAtTime(0,ac.currentTime+i*0.08);
    g.gain.linearRampToValueAtTime(0.18,ac.currentTime+i*0.08+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.08+0.9);
    o.start(ac.currentTime+i*0.08);o.stop(ac.currentTime+i*0.08+0.9);
  });
}

WISPS.forEach((w,i)=>{
  const el=document.createElement('div');
  el.className='wisp';
  el.innerHTML='<div class="core"></div>';

  // случайный размер: 26–64 px
  const sz=26+Math.random()*38;
  el.style.width=sz+'px';
  el.style.height=sz+'px';

  // случайная яркость и своё мерцание у каждого
  const core=el.querySelector('.core');
  core.style.opacity=0.55+Math.random()*0.45;
  core.style.animationDuration=(1.4+Math.random()*1.6)+'s';
  core.style.animationDelay=(Math.random()*2)+'s';

  // случайная стартовая позиция (в %)
  let x=10+Math.random()*75, y=15+Math.random()*65;
  let vx=(Math.random()-.5)*0.06, vy=(Math.random()-.5)*0.06;
  el.style.left=x+'%';el.style.top=y+'%';
  el.dataset.i=i;
  stage.appendChild(el);

  // хаотичное плавное движение
  function float(){
    x+=vx;y+=vy;
    if(x<5||x>88){vx*=-1;x=Math.max(5,Math.min(88,x));}
    if(y<8||y>80){vy*=-1;y=Math.max(8,Math.min(80,y));}
    vx+=(Math.random()-.5)*0.004; vy+=(Math.random()-.5)*0.004;
    vx=Math.max(-0.1,Math.min(0.1,vx)); vy=Math.max(-0.1,Math.min(0.1,vy));
    el.style.left=x+'%';el.style.top=y+'%';
    el._raf=requestAnimationFrame(float);
  }
  float();
  el.onclick=()=>openQ(i,el);
});

/* ====== МОДАЛКА ====== */
const ov=document.getElementById('ov');
let curEl=null,curI=null;
function openQ(i,el){
  curEl=el;curI=i;const w=WISPS[i];
  document.getElementById('q').textContent='Wisp '+(i+1)+': '+w.q;
  document.getElementById('fb').textContent='';
  const oc=document.getElementById('opts');oc.innerHTML='';
  w.o.forEach((t,j)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>answer(j,w,b,oc);
    oc.appendChild(b);
  });
  ov.classList.add('on');
}
function answer(j,w,btn,oc){
  const bs=oc.querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);
  if(j===w.c){
    btn.classList.add('correct');
    document.getElementById('fb').textContent='✦ Correct!';
    document.getElementById('fb').style.color='#3fd07a';
    chime();
    setTimeout(()=>{
      ov.classList.remove('on');
      popWisp(curEl);
      if(w.link){
        // ПЕРЕХОД К КИКИМОРЕ (в Genially заменишь на нужный URL слайда)
        setTimeout(()=>{ window.parent.postMessage('go-kikimora','*');
          /* или: location.href = 'URL_СЛАЙДА'; */ },800);
      }
    },800);
  } else {
    btn.classList.add('wrong');bs[w.c].classList.add('correct');
    document.getElementById('fb').textContent='✦ Try to feel the past...';
    document.getElementById('fb').style.color='#e05030';
    setTimeout(()=>{bs.forEach(b=>{b.disabled=false;b.classList.remove('wrong','correct');});
      document.getElementById('fb').textContent='';},1400);
  }
}
function popWisp(el){
  el.classList.add('pop');
  cancelAnimationFrame(el._raf);
  caught++;
  document.getElementById('cnt').textContent=caught;
  setTimeout(()=>el.remove(),600);
  if(caught>=WISPS.length){
    setTimeout(()=>document.getElementById('fog').classList.add('clear'),500);
  }
}
</script>
</body>
</html>
