<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Games — The Honor Trial | Fourth Wing Quest</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Pontano+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   FOURTH WING QUEST · SCENE 5 · WAR GAMES — HONOR TRIAL
   Complete stylesheet (Phase 0 → Graduation)
   ============================================================ */

/* ===== 1. VARIABLES ===== */
:root{
  --gold:#c9a96e;
  --gold-bright:#e8c989;
  --gold-dark:#8b7349;
  --ink:#1a1410;
  --ink-deep:#0a0806;
  --parch:#f4e8d0;
  --parch-dark:#d9c9a8;
  --red:#8b2c2c;
  --red-bright:#c44545;
  --green-ok:#4a7c4e;
  --blue-mana:#3b5f8f;
  --crimson:#a83232;
  --purple-signet:#a78bfa;
  --purple-signet-light:#c4b5fd;

  --font-heading:'Cinzel', 'Cormorant Garamond', Georgia, serif;
  --font-body:'Pontano Sans', 'Segoe UI', sans-serif;
}

/* ===== 2. BASE ===== */
*{margin:0; padding:0; box-sizing:border-box}
html, body{
  height:100%;
  font-family:var(--font-body);
  color:var(--parch);
  background:var(--ink-deep);
  overflow:hidden;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* ===== 3. BACKGROUND & PARALLAX ===== */
#sky-bg{
  position:fixed; inset:0; z-index:1;
  background-size:cover; background-position:center; background-repeat:no-repeat;
  transition:background-image 1.2s ease, opacity 1.2s ease;
  animation:skyDrift 30s ease-in-out infinite;
}
#sky-bg::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,8,6,.3) 0%, rgba(10,8,6,.55) 60%, rgba(10,8,6,.85) 100%);
  pointer-events:none;
}
@keyframes skyDrift{
  0%, 100%{transform:scale(1.05) translateY(0)}
  50%{transform:scale(1.08) translateY(-15px)}
}

.cloud-layer{
  position:fixed; inset:0; z-index:2;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s ease;
}
body.flight-active .cloud-layer{opacity:1}
.cloud-layer.far{
  background-image:
    radial-gradient(ellipse 200px 60px at 20% 30%, rgba(255,255,255,.15), transparent 70%),
    radial-gradient(ellipse 180px 50px at 70% 50%, rgba(255,255,255,.12), transparent 70%),
    radial-gradient(ellipse 220px 70px at 45% 75%, rgba(255,255,255,.18), transparent 70%);
  background-size:1200px 100%;
  animation:cloudDriftFar 60s linear infinite;
}
.cloud-layer.near{
  background-image:
    radial-gradient(ellipse 300px 80px at 15% 40%, rgba(255,255,255,.3), transparent 70%),
    radial-gradient(ellipse 280px 70px at 65% 65%, rgba(255,255,255,.28), transparent 70%),
    radial-gradient(ellipse 320px 90px at 90% 25%, rgba(255,255,255,.32), transparent 70%);
  background-size:1500px 100%;
  filter:blur(2px);
  animation:cloudDriftNear 25s linear infinite;
}
@keyframes cloudDriftFar{from{background-position:0 0}to{background-position:-1200px 0}}
@keyframes cloudDriftNear{from{background-position:0 0}to{background-position:-1500px 0}}

/* ===== 4. DRAGON POV ===== */
#pov-dragon{
  position:fixed;
  left:0; bottom:0;
  width:100vw;
  height:35vh;
  object-fit:cover;
  object-position:center top;
  z-index:3;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease, filter .3s ease;
  filter:drop-shadow(0 -10px 40px rgba(0,0,0,.7));
}
#pov-dragon.visible{
  opacity:1;
  animation:wingFlap 3s ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes wingFlap{
  0%, 100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.03) translateY(-6px)}
}
#pov-dragon.tilt-left{animation:tiltLeft .6s ease-in-out}
#pov-dragon.tilt-right{animation:tiltRight .6s ease-in-out}
#pov-dragon.shake{animation:dragonShake .5s ease-in-out}
@keyframes tiltLeft{
  0%, 100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.02) rotate(-2deg) translateX(-10px)}
}
@keyframes tiltRight{
  0%, 100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.02) rotate(2deg) translateX(10px)}
}
@keyframes dragonShake{
  0%, 100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}

/* ===== 5. MAIN CARD ===== */
.card-wrap{
  position:relative; z-index:10;
  width:min(1100px, 95vw);
  max-height:95vh;
  display:flex; flex-direction:column;
}
.card{
  background:linear-gradient(180deg, rgba(20,15,10,.92), rgba(15,10,7,.95));
  border:1px solid var(--gold-dark);
  border-radius:4px;
  box-shadow:
    0 0 0 1px rgba(201,169,110,.15),
    0 20px 60px rgba(0,0,0,.7),
    inset 0 0 80px rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
  display:flex; flex-direction:column;
  max-height:95vh;
}
body.flight-active .card{
  background:linear-gradient(180deg, rgba(20,15,10,.78), rgba(15,10,7,.82));
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.corner{
  position:absolute; width:32px; height:32px;
  border:1px solid var(--gold); z-index:5; pointer-events:none;
}
.corner.tl{top:10px; left:10px; border-right:none; border-bottom:none}
.corner.tr{top:10px; right:10px; border-left:none; border-bottom:none}
.corner.bl{bottom:10px; left:10px; border-right:none; border-top:none}
.corner.br{bottom:10px; right:10px; border-left:none; border-top:none}

/* HUD */
.head{
  padding:16px 36px 12px;
  border-bottom:1px solid rgba(201,169,110,.3);
  display:flex; align-items:center; justify-content:space-between;
  gap:20px; flex-shrink:0;
  background:linear-gradient(180deg, rgba(0,0,0,.4), transparent);
}
.head-left{display:flex; align-items:center; gap:24px; flex-wrap:wrap}
.timer-box, .hp-box, .honor-box, .streak-box{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-heading);
  font-size:14px; letter-spacing:1.5px;
  color:var(--gold-bright);
}
.timer-box .icon, .hp-box .icon, .honor-box .icon, .streak-box .icon{
  font-size:16px;
  filter:drop-shadow(0 0 4px rgba(201,169,110,.5));
}
.hp-box .value{color:var(--red-bright)}
.honor-box .value{color:var(--gold-bright)}
.streak-box{display:none; color:#ff9b6e}
.streak-box.active{display:flex; animation:streakPulse 1s ease-in-out infinite}
.streak-box .value{color:#ff9b6e; text-shadow:0 0 8px rgba(255,155,110,.6)}
@keyframes streakPulse{
  0%, 100%{text-shadow:0 0 8px rgba(255,155,110,.4)}
  50%{text-shadow:0 0 16px rgba(255,155,110,.9)}
}
.hp-box.low .value{animation:pulseRed .8s ease-in-out infinite}
@keyframes pulseRed{
  0%, 100%{color:var(--red-bright); text-shadow:0 0 8px rgba(196,69,69,.4)}
  50%{color:#ff6666; text-shadow:0 0 14px rgba(255,102,102,.8)}
}

.phase-progress{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-heading);
  font-size:13px; letter-spacing:2px;
}
.phase-progress .step{
  color:var(--gold-dark);
  transition:color .4s ease, text-shadow .4s ease;
}
.phase-progress .step.active{
  color:var(--gold-bright);
  text-shadow:0 0 12px rgba(232,201,137,.6);
}
.phase-progress .step.done{color:var(--gold)}
.phase-progress .sep{color:var(--gold-dark); font-size:11px}

.content{
  padding:24px 36px;
  flex:1; overflow-y:auto;
  display:flex; flex-direction:column; gap:18px;
  scrollbar-width:thin;
  scrollbar-color:var(--gold-dark) transparent;
  position:relative;
}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--gold-dark); border-radius:3px}

h1.scene-title{
  font-family:var(--font-heading);
  font-weight:700; font-size:clamp(22px, 3vw, 32px);
  letter-spacing:4px; color:var(--gold-bright);
  text-align:center;
  text-shadow:0 2px 20px rgba(201,169,110,.4);
  margin-bottom:6px;
}
h2.phase-title{
  font-family:var(--font-heading);
  font-weight:500; font-size:clamp(16px, 2vw, 20px);
  letter-spacing:3px; color:var(--gold);
  text-align:center; text-transform:uppercase;
}
.scene-subtitle{
  font-family:var(--font-body);
  font-style:italic; font-size:clamp(15px, 1.8vw, 17px);
  color:var(--parch-dark); text-align:center; opacity:.9;
}

.divider{
  display:flex; align-items:center; justify-content:center;
  gap:14px; color:var(--gold-dark); margin:4px 0;
}
.divider::before, .divider::after{
  content:''; flex:1; max-width:120px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-dark), transparent);
}
.divider .ornament{font-size:14px; color:var(--gold)}

/* ===== 6. COMMS PANEL ===== */
.comms-panel{
  background:linear-gradient(135deg, rgba(15,12,8,.85), rgba(25,18,12,.85));
  border:1px solid var(--gold-dark);
  border-radius:3px;
  padding:16px 20px;
  display:flex; gap:18px; align-items:flex-start;
  position:relative;
  box-shadow:inset 0 0 30px rgba(0,0,0,.4), 0 4px 20px rgba(0,0,0,.4);
  animation:commsIn .6s ease;
}
@keyframes commsIn{
  from{opacity:0; transform:translateY(-10px)}
  to{opacity:1; transform:translateY(0)}
}
.comms-panel.urgent{
  border-color:var(--red-bright);
  animation:commsIn .6s ease, urgentPulse 2s ease-in-out infinite;
}
@keyframes urgentPulse{
  0%, 100%{box-shadow:inset 0 0 30px rgba(0,0,0,.4), 0 0 0 0 rgba(196,69,69,0)}
  50%{box-shadow:inset 0 0 30px rgba(0,0,0,.4), 0 0 24px rgba(196,69,69,.5)}
}
.comms-panel.formal{
  border:2px double var(--gold);
  padding:18px 22px;
}
.comms-portrait{
  flex-shrink:0; width:80px; height:80px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:rgba(0,0,0,.5);
  overflow:hidden;
  box-shadow:0 0 16px rgba(201,169,110,.3);
}
.comms-portrait img{
  width:100%; height:100%;
  object-fit:cover; object-position:center top;
}
.comms-body{flex:1; min-width:0}
.comms-header{
  display:flex; align-items:center; gap:12px;
  margin-bottom:8px; padding-bottom:8px;
  border-bottom:1px solid rgba(201,169,110,.2);
}
.comms-name{
  font-family:var(--font-heading);
  font-weight:600; font-size:14px;
  letter-spacing:2px; color:var(--gold-bright);
  text-transform:uppercase;
}
.comms-role{
  font-family:var(--font-body);
  font-style:italic; font-size:14px;
  color:var(--parch-dark); flex:1;
}
.comms-text{
  font-family:var(--font-body);
  font-size:17px; line-height:1.55;
  color:var(--parch);
  min-height:1.5em;
}
.comms-text::after{
  content:'▌'; color:var(--gold);
  animation:cursorBlink .8s infinite;
  margin-left:2px;
}
.comms-text.done::after{display:none}
@keyframes cursorBlink{
  0%, 49%{opacity:1}
  50%, 100%{opacity:0}
}

/* ===== 7. TASK CARDS ===== */
.task-card{
  background:linear-gradient(180deg, rgba(244,232,208,.05), rgba(244,232,208,.02));
  border:1px solid rgba(201,169,110,.3);
  border-radius:3px;
  padding:18px 22px;
  position:relative;
}
.task-label{
  font-family:var(--font-heading);
  font-size:11px; letter-spacing:3px;
  color:var(--gold); text-transform:uppercase;
  margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.task-label::before, .task-label::after{
  content:''; flex:1; height:1px;
  background:rgba(201,169,110,.2);
}
.tactical-text{
  font-family:var(--font-body);
  font-size:16px; line-height:1.6;
  color:var(--parch);
  padding:12px 16px;
  background:rgba(0,0,0,.3);
  border-left:3px solid var(--gold);
  border-radius:2px;
  margin-bottom:14px;
}
.tactical-text strong{color:var(--gold-bright); font-weight:600}
.tactical-text em{color:var(--parch-dark); font-style:italic}

.question-block{margin-bottom:14px}
.question-block:last-child{margin-bottom:0}
.question-text{
  font-family:var(--font-heading);
  font-size:14px; color:var(--gold-bright);
  letter-spacing:1px; margin-bottom:10px;
  font-weight:500;
}
.question-text .qnum{color:var(--gold); margin-right:8px}
.question-hint{
  font-family:var(--font-body);
  font-style:italic;
  font-size:13px;
  color:var(--parch-dark);
  margin-bottom:10px;
  opacity:.8;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.option-btn{
  background:rgba(244,232,208,.04);
  border:1px solid rgba(201,169,110,.3);
  border-radius:2px;
  padding:11px 14px;
  font-family:var(--font-body);
  font-size:15px;
  color:var(--parch);
  cursor:pointer;
  text-align:left;
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
}
.option-btn:hover:not(.disabled){
  background:rgba(201,169,110,.12);
  border-color:var(--gold);
  transform:translateX(2px);
}
.option-btn.correct{
  background:rgba(74,124,78,.25);
  border-color:var(--green-ok);
  color:#a8e0a8;
  animation:correctFlash .5s ease;
}
.option-btn.wrong{
  background:rgba(139,44,44,.25);
  border-color:var(--red-bright);
  color:#ffb8b8;
  animation:wrongShake .5s ease;
}
.option-btn.disabled{cursor:not-allowed; opacity:.5}
.option-btn.eliminated{
  opacity:.25;
  text-decoration:line-through;
  pointer-events:none;
}
.option-btn.hinted{
  box-shadow:0 0 16px rgba(232,201,137,.5);
  border-color:var(--gold-bright);
  animation:hintGlow 1.5s ease-in-out infinite;
}
@keyframes correctFlash{
  0%{background:rgba(74,124,78,.6)}
  100%{background:rgba(74,124,78,.25)}
}
@keyframes wrongShake{
  0%, 100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}
@keyframes hintGlow{
  0%, 100%{box-shadow:0 0 8px rgba(232,201,137,.4)}
  50%{box-shadow:0 0 20px rgba(232,201,137,.8)}
}

/* Listening (gap selects) */
.listening-text{
  font-family:var(--font-body);
  font-size:17px; line-height:2;
  color:var(--parch);
  padding:14px 18px;
  background:rgba(0,0,0,.3);
  border-left:3px solid var(--gold);
  border-radius:2px;
  margin-bottom:14px;
}
.gap-select{
  display:inline-block;
  background:rgba(20,15,10,.95);
  border:1px solid var(--gold);
  border-radius:2px;
  padding:3px 26px 3px 10px;
  font-family:var(--font-heading);
  font-size:14px;
  letter-spacing:1px;
  color:var(--gold-bright);
  cursor:pointer;
  min-width:130px;
  text-align:center;
  text-align-last:center;
  margin:0 3px;
  transition:all .2s ease;
  -webkit-appearance:none;
  -moz-appearance:none;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%23c9a96e' d='M6 8L0 0h12z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:9px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.5), 0 0 0 1px rgba(201,169,110,.15);
}
.gap-select:hover{
  background-color:rgba(201,169,110,.18);
  border-color:var(--gold-bright);
}
.gap-select:focus{
  outline:none;
  border-color:var(--gold-bright);
  box-shadow:inset 0 0 12px rgba(0,0,0,.4), 0 0 0 2px rgba(232,201,137,.4);
}
.gap-select.correct{
  background-color:rgba(74,124,78,.35);
  border-color:var(--green-ok);
  color:#c8f0c8;
}
.gap-select.wrong{
  background-color:rgba(139,44,44,.35);
  border-color:var(--red-bright);
  color:#ffd0d0;
}
.gap-select:disabled{cursor:not-allowed; opacity:.95}
.gap-select option{
  background:#1a1410;
  color:var(--parch);
  font-family:var(--font-body);
  font-size:16px;
  padding:8px 12px;
}

/* ===== 8. SELECTION CARDS ===== */
.selection-grid{display:grid; gap:14px; width:100%}
.selection-grid.dragons{grid-template-columns:repeat(2, 1fr)}
.selection-grid.signets{grid-template-columns:repeat(3, 1fr)}

.dragon-card{
  background:linear-gradient(180deg, rgba(244,232,208,.06), rgba(244,232,208,.02));
  border:2px solid var(--gold-dark);
  border-radius:4px;
  padding:16px 14px 14px;
  cursor:pointer;
  text-align:center;
  transition:all .3s ease;
  position:relative;
  overflow:hidden;
}
.dragon-card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at center top, rgba(201,169,110,.1), transparent 60%);
  opacity:0; transition:opacity .3s ease;
  pointer-events:none;
}
  .dragon-card:hover{
  border-color:var(--gold);
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 20px rgba(201,169,110,.25);
}
.dragon-card:hover::before{opacity:1}
.dragon-card.selected{
  border-color:var(--gold-bright);
  background:linear-gradient(180deg, rgba(201,169,110,.15), rgba(201,169,110,.05));
  box-shadow:0 0 30px rgba(232,201,137,.5);
}
.dragon-card.selected.glow-red{box-shadow:0 0 30px rgba(196,69,69,.6), 0 0 50px rgba(196,69,69,.3)}
.dragon-card.selected.glow-blue{box-shadow:0 0 30px rgba(59,95,143,.6), 0 0 50px rgba(59,95,143,.3)}
.dragon-card.selected.glow-green{box-shadow:0 0 30px rgba(74,124,78,.6), 0 0 50px rgba(74,124,78,.3)}
.dragon-card.selected.glow-black{box-shadow:0 0 30px rgba(40,30,50,.8), 0 0 50px rgba(120,90,180,.4)}

.dragon-portrait{
  width:140px; height:140px;
  margin:0 auto 12px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid var(--gold-dark);
  background:rgba(0,0,0,.5);
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.7));
  transition:all .3s ease;
}
.dragon-card:hover .dragon-portrait{
  border-color:var(--gold);
  filter:drop-shadow(0 8px 20px rgba(201,169,110,.4));
}
.dragon-card.selected .dragon-portrait{
  border-color:var(--gold-bright);
  filter:drop-shadow(0 8px 24px rgba(232,201,137,.6));
}
.dragon-card .dragon-name{
  font-family:var(--font-heading);
  font-size:15px;
  letter-spacing:3px;
  color:var(--gold-bright);
  text-transform:uppercase;
  margin-bottom:6px;
}
.dragon-card .dragon-desc{
  font-family:var(--font-body);
  font-size:14px;
  color:var(--parch-dark);
  font-style:italic;
  line-height:1.4;
  margin-bottom:8px;
}
.dragon-card .dragon-bonus{
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--gold);
  padding:6px 10px;
  background:rgba(0,0,0,.4);
  border-top:1px solid rgba(201,169,110,.25);
  margin:8px -14px -14px;
}

.signet-card{
  background:linear-gradient(180deg, rgba(244,232,208,.06), rgba(244,232,208,.02));
  border:1px solid var(--gold-dark);
  border-radius:3px;
  padding:14px 10px;
  cursor:pointer;
  text-align:center;
  transition:all .3s ease;
  position:relative;
  overflow:hidden;
}
.signet-card:hover{
  background:rgba(167,139,250,.1);
  border-color:var(--purple-signet);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.5), 0 0 16px rgba(167,139,250,.25);
}
.signet-card.selected{
  background:rgba(167,139,250,.18);
  border-color:var(--purple-signet-light);
  box-shadow:0 0 24px rgba(167,139,250,.5);
}
.signet-card .sigil{
  width:50px; height:50px;
  margin:0 auto 6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold);
  transition:color .3s ease;
}
.signet-card.selected .sigil{
  color:var(--purple-signet-light);
  filter:drop-shadow(0 0 8px rgba(167,139,250,.6));
}
.signet-card .sigil svg{width:100%; height:100%}
.signet-card .signet-name{
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--gold-bright);
  text-transform:uppercase;
  margin-bottom:4px;
}
.signet-card .signet-desc{
  font-family:var(--font-body);
  font-size:12px;
  color:var(--parch-dark);
  font-style:italic;
  line-height:1.3;
}

/* ===== 9. JUDGMENT CHOICES (Phase 4) ===== */
.choices-grid{display:flex; flex-direction:column; gap:10px}
.choice-btn{
  background:linear-gradient(180deg, rgba(244,232,208,.06), rgba(244,232,208,.02));
  border:1px solid var(--gold-dark);
  border-left:4px solid var(--gold-dark);
  border-radius:2px;
  padding:14px 18px;
  font-family:var(--font-body);
  font-size:16px;
  color:var(--parch);
  cursor:pointer;
  text-align:left;
  transition:all .25s ease;
  display:flex; gap:14px; align-items:flex-start;
}
.choice-btn:hover:not(:disabled){
  background:rgba(201,169,110,.12);
  border-color:var(--gold);
  border-left-color:var(--gold-bright);
  transform:translateX(3px);
}
.choice-btn:disabled{opacity:.4; cursor:not-allowed}
.choice-btn.locked{opacity:.35; cursor:not-allowed}
.choice-btn.chosen{
  background:rgba(201,169,110,.18);
  border-color:var(--gold-bright);
  transform:scale(1.01);
}
.choice-btn .label{
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:2px;
  padding:3px 8px;
  border:1px solid;
  border-radius:2px;
  flex-shrink:0;
  white-space:nowrap;
  display:flex; flex-direction:column;
  align-items:center; gap:2px;
  min-width:84px;
}
.choice-btn .label .lock-req{
  font-size:9px;
  letter-spacing:1px;
  opacity:.8;
}
.choice-btn .label.defiant{color:#ff9b6e; border-color:#ff9b6e; background:rgba(255,155,110,.08)}
.choice-btn .label.humble{color:#9ec0ff; border-color:#9ec0ff; background:rgba(158,192,255,.08)}
.choice-btn .label.personal{color:#ff8fb1; border-color:#ff8fb1; background:rgba(255,143,177,.08)}
.choice-btn .label.formal{color:#c9a96e; border-color:#c9a96e; background:rgba(201,169,110,.08)}
.choice-btn .text{flex:1; font-style:italic; line-height:1.4}

/* ===== 10. FOOTER & BUTTONS ===== */
.foot{
  padding:14px 36px 18px;
  border-top:1px solid rgba(201,169,110,.3);
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-shrink:0;
  background:linear-gradient(0deg, rgba(0,0,0,.4), transparent);
  flex-wrap:wrap;
}
.foot-hint{
  font-family:var(--font-body);
  font-style:italic;
  font-size:15px;
  color:var(--parch-dark);
  opacity:.85;
  flex:1; min-width:200px;
}
.foot-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

.btn{
  font-family:var(--font-heading);
  font-size:13px; letter-spacing:2px;
  text-transform:uppercase;
  padding:11px 22px;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold-bright);
  cursor:pointer;
  transition:all .25s ease;
  border-radius:2px;
}
.btn:hover:not(:disabled){
  background:var(--gold);
  color:var(--ink);
  box-shadow:0 0 20px rgba(201,169,110,.5);
}
.btn:disabled{opacity:.3; cursor:not-allowed}
.btn.primary{
  background:rgba(201,169,110,.15);
  border-width:2px;
}
.btn.signet{
  border-color:var(--purple-signet);
  color:var(--purple-signet-light);
}
.btn.signet:hover:not(:disabled){
  background:#7c5fc0;
  color:#fff;
  box-shadow:0 0 24px rgba(167,139,250,.6);
}
.btn.signet.used{
  opacity:.4;
  border-color:var(--gold-dark);
  color:var(--gold-dark);
}

/* ===== 11. CIRCULAR TIMER (Phase 3) ===== */
.circular-timer{
  position:absolute;
  top:14px; right:14px;
  width:64px; height:64px;
  z-index:20;
}
.circular-timer svg{
  transform:rotate(-90deg);
  width:100%; height:100%;
}
.circular-timer .ring-bg{
  fill:rgba(0,0,0,.5);
  stroke:rgba(201,169,110,.2);
  stroke-width:3;
}
.circular-timer .ring-fg{
  fill:none;
  stroke:var(--gold-bright);
  stroke-width:3;
  stroke-linecap:round;
  transition:stroke-dashoffset .1s linear, stroke .3s ease;
  filter:drop-shadow(0 0 4px rgba(232,201,137,.6));
}
.circular-timer .ring-fg.warn{
  stroke:var(--red-bright);
  filter:drop-shadow(0 0 6px rgba(196,69,69,.8));
}
.circular-timer .timer-num{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-heading);
  font-size:18px; font-weight:600;
  color:var(--gold-bright);
}
.circular-timer.heartbeat{animation:heartbeat .5s ease-in-out infinite}
@keyframes heartbeat{
  0%, 100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

/* ===== 12. COMBO INDICATOR ===== */
.combo-overlay{
  position:fixed;
  top:30%; left:50%;
  transform:translate(-50%, -50%) scale(.5);
  font-family:var(--font-heading);
  font-size:48px; font-weight:900;
  letter-spacing:6px;
  z-index:500;
  pointer-events:none;
  opacity:0;
  text-align:center;
}
.combo-overlay.show{animation:comboShow 2s ease-out forwards}
.combo-overlay.perfect{
  color:var(--gold-bright);
  text-shadow:0 0 30px rgba(232,201,137,.9), 0 0 60px rgba(232,201,137,.5);
}
.combo-overlay.fail{
  color:var(--red-bright);
  text-shadow:0 0 30px rgba(196,69,69,.9);
}
@keyframes comboShow{
  0%{opacity:0; transform:translate(-50%, -50%) scale(.5)}
  20%{opacity:1; transform:translate(-50%, -50%) scale(1.2)}
  60%{opacity:1; transform:translate(-50%, -50%) scale(1)}
  100%{opacity:0; transform:translate(-50%, -80%) scale(.9)}
}

/* ===== 13. WYVERN SILHOUETTES ===== */
.wyvern-layer{
  position:fixed; inset:0; z-index:4;
  pointer-events:none;
}
.wyvern{
  position:absolute;
  width:120px; height:80px;
  opacity:0;
  transition:opacity .8s ease, transform 1.2s cubic-bezier(.4, 0, .2, 1);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));
}
.wyvern svg{width:100%; height:100%}
.wyvern.visible{
  opacity:.85;
  animation:wyvernGlide 4s ease-in-out infinite;
}
.wyvern.falling{
  transform:translateY(400px) rotate(60deg) scale(.5) !important;
  opacity:0 !important;
  animation:none !important;
}
@keyframes wyvernGlide{
  0%, 100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* ===== 14. CUTSCENE OVERLAY ===== */
.cutscene-overlay{
  position:fixed; inset:0;
  background:rgba(10,8,6,.92);
  z-index:700;
  display:none;
  align-items:center; justify-content:center;
  padding:30px;
}
.cutscene-overlay.active{display:flex; animation:overlayIn .5s ease}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.cutscene-text{
  font-family:var(--font-heading);
  font-size:clamp(20px, 2.6vw, 30px);
  letter-spacing:3px;
  color:var(--gold-bright);
  text-align:center;
  text-shadow:0 0 24px rgba(232,201,137,.5);
  max-width:800px;
  line-height:1.5;
  font-style:italic;
  font-weight:400;
}

/* ===== 15. INTRO ===== */
#intro-screen{
  position:fixed; inset:0; z-index:1000;
  background:var(--ink-deep);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:40px;
  opacity:1;
  transition:opacity 1.5s ease;
}
#intro-screen.fading{opacity:0; pointer-events:none}
.intro-text{
  font-family:var(--font-body);
  font-size:clamp(19px, 2.6vw, 26px);
  line-height:1.8;
  color:var(--parch);
  max-width:780px;
  text-align:center;
  font-style:italic;
  min-height:6em;
}
.intro-text::after{
  content:'▌'; color:var(--gold);
  animation:cursorBlink .8s infinite;
  margin-left:4px;
}
.intro-text.done::after{display:none}
.intro-continue{
  margin-top:40px;
  opacity:0;
  transition:opacity .8s ease;
}
.intro-continue.visible{opacity:1}

/* ===== 16. SIGNET CAST OVERLAY ===== */
#signet-overlay{
  position:fixed; inset:0;
  background:rgba(10,8,6,.92);
  z-index:600;
  display:none;
  align-items:center; justify-content:center;
  padding:30px;
}
#signet-overlay.active{display:flex; animation:overlayIn .5s ease}
.signet-cast-box{
  background:linear-gradient(180deg, rgba(30,20,40,.95), rgba(15,10,25,.95));
  border:2px solid var(--purple-signet);
  border-radius:4px;
  padding:30px 40px;
  max-width:520px;
  text-align:center;
  box-shadow:0 0 60px rgba(167,139,250,.5);
  animation:signetPulse 2s ease-in-out infinite;
}
@keyframes signetPulse{
  0%, 100%{box-shadow:0 0 60px rgba(167,139,250,.5)}
  50%{box-shadow:0 0 100px rgba(167,139,250,.8)}
}
.signet-cast-title{
  font-family:var(--font-heading);
  font-weight:700;
  font-size:18px;
  letter-spacing:5px;
  color:var(--purple-signet-light);
  margin-bottom:14px;
  text-shadow:0 0 16px rgba(167,139,250,.6);
}
.signet-cast-desc{
  font-family:var(--font-body);
  font-style:italic;
  font-size:18px;
  color:var(--parch);
  line-height:1.5;
  margin-bottom:20px;
}
.signet-cast-cost{
  font-family:var(--font-heading);
  font-size:12px;
  letter-spacing:2px;
  color:var(--red-bright);
  margin-bottom:20px;
}
.signet-cast-buttons{display:flex; gap:12px; justify-content:center}

/* ===== 17. AUDIO PANEL ===== */
#audio-toggle{
  position:fixed;
  top:20px; right:20px;
  z-index:1100;
  width:44px; height:44px;
  border-radius:50%;
  background:rgba(20,15,10,.85);
  border:1px solid var(--gold-dark);
  color:var(--gold);
  cursor:pointer;
  font-size:18px;
  display:flex; align-items:center; justify-content:center;
  transition:all .25s ease;
  backdrop-filter:blur(8px);
}
#audio-toggle:hover{
  border-color:var(--gold);
  background:rgba(201,169,110,.2);
  color:var(--gold-bright);
}
#audio-panel{
  position:fixed;
  top:70px; right:20px;
  z-index:1100;
  background:linear-gradient(180deg, rgba(20,15,10,.96), rgba(15,10,7,.98));
  border:1px solid var(--gold);
  border-radius:4px;
  padding:18px 20px;
  width:260px;
  display:none;
  box-shadow:0 10px 40px rgba(0,0,0,.7), 0 0 0 1px rgba(201,169,110,.15);
  backdrop-filter:blur(10px);
}
#audio-panel.open{display:block; animation:commsIn .3s ease}
.audio-panel-title{
  font-family:var(--font-heading);
  font-size:12px;
  letter-spacing:3px;
  color:var(--gold-bright);
  text-align:center;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(201,169,110,.25);
}
.audio-slider-row{margin-bottom:14px}
.audio-slider-row:last-child{margin-bottom:0}
.audio-slider-label{
  display:flex; justify-content:space-between;
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--gold);
  margin-bottom:6px;
}
.audio-slider-value{color:var(--gold-bright)}
.audio-slider{
  width:100%;
  -webkit-appearance:none;
  appearance:none;
  height:4px;
  background:rgba(201,169,110,.2);
  border-radius:2px;
  outline:none;
  cursor:pointer;
}
.audio-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px; height:14px;
  border-radius:50%;
  background:var(--gold-bright);
  cursor:pointer;
  box-shadow:0 0 6px rgba(232,201,137,.6);
  border:none;
}
.audio-slider::-moz-range-thumb{
  width:14px; height:14px;
  border-radius:50%;
  background:var(--gold-bright);
  cursor:pointer;
  box-shadow:0 0 6px rgba(232,201,137,.6);
  border:none;
}
.audio-mute-row{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(201,169,110,.25);
  display:flex; justify-content:center;
}
.audio-mute-btn{
  font-family:var(--font-heading);
  font-size:11px;
  letter-spacing:2px;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold-bright);
  padding:6px 16px;
  border-radius:2px;
  cursor:pointer;
  transition:all .2s ease;
}
.audio-mute-btn:hover{
  background:var(--gold);
  color:var(--ink);
}
.audio-mute-btn.muted{
  background:var(--red);
  border-color:var(--red-bright);
  color:#fff;
}

/* ===== 18. FLOAT FEEDBACK & SCREEN FX ===== */
.float-feedback{
  position:fixed; top:50%; left:50%;
  transform:translate(-50%, -50%);
  font-family:var(--font-heading);
  font-size:28px; font-weight:700;
  letter-spacing:3px;
  color:var(--gold-bright);
  text-shadow:0 0 30px rgba(232,201,137,.8);
  z-index:500;
  pointer-events:none;
  animation:floatFade 1.4s ease-out forwards;
}
.float-feedback.minus{
  color:var(--red-bright);
  text-shadow:0 0 30px rgba(196,69,69,.8);
}
@keyframes floatFade{
  0%{opacity:0; transform:translate(-50%, -30%) scale(.8)}
  20%{opacity:1; transform:translate(-50%, -50%) scale(1.1)}
  100%{opacity:0; transform:translate(-50%, -120%) scale(1)}
}

.screen-flash{
  position:fixed; inset:0;
  z-index:400;
  pointer-events:none;
  opacity:0;
}
.screen-flash.gold{
  background:radial-gradient(circle at center, transparent 40%, rgba(232,201,137,.3) 100%);
  animation:flashFade .4s ease-out;
}
.screen-flash.red{
  background:radial-gradient(circle at center, transparent 30%, rgba(196,69,69,.5) 100%);
  animation:flashFade .5s ease-out;
}
.screen-flash.gray{
  background:radial-gradient(circle at center, transparent 40%, rgba(150,150,150,.3) 100%);
  animation:flashFade .4s ease-out;
}
.screen-flash.white{
  background:rgba(255,255,255,.7);
  animation:flashFade .35s ease-out;
}
@keyframes flashFade{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

body.screen-shake{animation:screenShake .3s ease-in-out}
@keyframes screenShake{
  0%, 100%{transform:translateX(0)}
  20%{transform:translateX(-4px) translateY(-2px)}
  40%{transform:translateX(4px) translateY(2px)}
  60%{transform:translateX(-3px) translateY(1px)}
  80%{transform:translateX(3px) translateY(-1px)}
}

/* ===== 19. VERDICT OVERLAY ===== */
.verdict-overlay{
  position:fixed; inset:0;
  background:rgba(8,4,2,.95);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:18px;
  opacity:0;
  transition:opacity .8s ease;
  border:3px solid;
  z-index:800;
  padding:30px;
}
.verdict-overlay.visible{opacity:1}
.verdict-icon{font-size:4rem; filter:drop-shadow(0 0 20px currentColor)}
.verdict-title{
  font-family:var(--font-heading);
  font-size:clamp(28px, 4vw, 44px);
  font-weight:900;
  letter-spacing:.2em;
  text-shadow:0 0 24px currentColor;
}
.verdict-subtitle{
  font-family:var(--font-heading);
  font-size:13px;
  opacity:.7;
  letter-spacing:.15em;
  color:var(--parch-dark);
}
.verdict-caeden{
  max-width:600px;
  padding:18px 24px;
  border:1px solid rgba(201,169,110,.3);
  background:rgba(0,0,0,.4);
  font-style:italic;
  line-height:1.6;
  text-align:center;
  font-family:var(--font-body);
  font-size:17px;
  color:var(--parch);
}
.verdict-attr{
  margin-top:8px;
  font-size:.85rem;
  opacity:.6;
  font-style:normal;
  font-family:var(--font-heading);
  letter-spacing:2px;
  color:var(--gold);
}
.verdict-btn{
  margin-top:20px;
  padding:12px 28px;
  background:linear-gradient(180deg, #2a1a0a, #1a0a05);
  border:1px solid var(--gold);
  color:var(--gold-bright);
  letter-spacing:.15em;
  font-family:var(--font-heading);
  font-size:13px;
  cursor:pointer;
  transition:all .2s ease;
  text-transform:uppercase;
}
.verdict-btn:hover{
  background:var(--gold);
  color:var(--ink);
  box-shadow:0 0 20px rgba(201,169,110,.5);
}
.verdict-btn.secondary{
  border-color:#888;
  color:#ccc;
}
.verdict-btn.secondary:hover{
  background:#888;
  color:var(--ink);
}

/* ===== 20. DOSSIER ===== */
.dossier-overlay{
  position:fixed; inset:0;
  background:linear-gradient(180deg, #0d0805 0%, #1a0f08 100%);
  padding:32px 48px;
  overflow-y:auto;
  opacity:0;
  transition:opacity .6s ease;
  z-index:800;
}
.dossier-overlay.visible{opacity:1}
.dossier-header{
  text-align:center;
  border-bottom:1px solid var(--gold);
  padding-bottom:18px;
  margin-bottom:24px;
}
.dossier-seal{
  font-size:2.4rem;
  color:var(--gold);
  margin-bottom:6px;
}
.dossier-title{
  font-family:var(--font-heading);
  font-size:clamp(20px, 2.4vw, 28px);
  letter-spacing:.3em;
  color:var(--gold);
  font-weight:700;
}
.dossier-sub{
  font-family:var(--font-body);
  font-style:italic;
  font-size:14px;
  opacity:.6;
  letter-spacing:.1em;
  color:var(--parch-dark);
  margin-top:4px;
}
.dossier-stats{
  max-width:760px;
  margin:0 auto;
}
.dossier-stats .stat-row{
  display:grid;
  grid-template-columns:160px 1fr 130px;
  gap:14px;
  align-items:center;
  margin:10px 0;
  font-family:var(--font-body);
  font-size:14px;
}
.stat-label{
  font-family:var(--font-heading);
  color:var(--gold-bright);
  letter-spacing:1px;
  font-size:13px;
}
.stat-bar{
  height:14px;
  background:rgba(201,169,110,.1);
  border:1px solid rgba(201,169,110,.3);
  position:relative;
  border-radius:2px;
  overflow:hidden;
}
.stat-fill{
  display:block;
  height:100%;
  background:linear-gradient(90deg, #8b2c2c, var(--gold));
  transition:width 1.2s ease-out;
}
.stat-val{
  font-family:var(--font-heading);
  color:var(--gold-bright);
  text-align:right;
  font-size:13px;
  letter-spacing:1px;
}
.dossier-meta{
  max-width:760px;
  margin:24px auto;
  padding:16px 20px;
  background:rgba(201,169,110,.06);
  border-left:3px solid var(--gold);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 24px;
  font-family:var(--font-body);
  font-size:14px;
  color:var(--parch);
}
.dossier-meta strong{
  color:var(--gold-bright);
  font-family:var(--font-heading);
  font-size:12px;
  letter-spacing:1px;
  margin-right:6px;
}
.dossier-section-title{
  max-width:760px;
  margin:24px auto 12px;
  color:var(--gold);
  font-family:var(--font-heading);
  letter-spacing:.15em;
  font-size:14px;
  text-transform:uppercase;
}
.dossier-errors{
  max-width:760px;
  margin:0 auto;
  list-style:none;
  padding:0;
}
.dossier-error{
  padding:12px 16px;
  margin:8px 0;
  background:rgba(139,44,44,.1);
  border-left:3px solid var(--red);
  font-size:14px;
  font-family:var(--font-body);
  list-style:none;
  border-radius:2px;
}
.err-q{
  font-style:italic;
  margin-bottom:6px;
  color:var(--parch);
}
.err-given, .err-correct{
  font-size:13px;
  margin:2px 0;
}
.err-wrong{color:#ff8888; font-weight:600}
.err-right{color:#88dd88; font-weight:600}
.err-explain{
  margin-top:6px;
  opacity:.75;
  font-size:13px;
  font-style:italic;
  color:var(--parch-dark);
}
.dossier-perfect{
  text-align:center;
  padding:32px;
  color:var(--gold);
  font-size:1.2rem;
  letter-spacing:.1em;
  font-family:var(--font-heading);
  max-width:760px;
  margin:0 auto;
}
.dossier-actions{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:30px auto 20px;
  max-width:760px;
  flex-wrap:wrap;
}

/* ===== 21. FINAL CARD ===== */
.final-card{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #1a0f08 0%, #050302 100%);
  opacity:0;

/* ===== AUDIO ENGINE ===== */
const AUDIO = {
  music: { calm: null, battle: null },
  sfx: {},
  volumes: { music: 0.15, sfx: 0.3, voice: 0.85 },
  muted: false,
  currentMusic: null,

  init() {
    // Load music
    Object.entries(MUSIC_FILES).forEach(([key, file]) => {
      const a = new Audio(CONFIG.AUDIO_BASE + file);
      a.loop = true;
      a.volume = 0;
      a.preload = 'auto';
      this.music[key] = a;
    });
    // Load SFX
    Object.entries(SFX_FILES).forEach(([key, file]) => {
      const a = new Audio(CONFIG.AUDIO_BASE + file);
      a.volume = this.volumes.sfx;
      a.preload = 'auto';
      this.sfx[key] = a;
    });
    this.bindControls();
  },

  bindControls() {
    const toggle = document.getElementById('audio-toggle');
    const panel = document.getElementById('audio-panel');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && e.target !== toggle) {
        panel.classList.remove('open');
      }
    });

    const bindSlider = (id, valId, key) => {
      const slider = document.getElementById(id);
      const valEl = document.getElementById(valId);
      slider.addEventListener('input', (e) => {
        const v = parseInt(e.target.value, 10) / 100;
        this.volumes[key] = v;
        valEl.textContent = e.target.value + '%';
        this.applyVolumes();
      });
    };
    bindSlider('music-slider', 'music-val', 'music');
    bindSlider('sfx-slider', 'sfx-val', 'sfx');
    bindSlider('voice-slider', 'voice-val', 'voice');

    document.getElementById('mute-btn').addEventListener('click', () => {
      this.muted = !this.muted;
      const btn = document.getElementById('mute-btn');
      btn.classList.toggle('muted', this.muted);
      btn.innerHTML = this.muted ? '🔇 UNMUTE' : '🔇 MUTE ALL';
      this.applyVolumes();
    });
  },

  applyVolumes() {
    Object.values(this.music).forEach(a => {
      if (!a) return;
      const target = (a === this.currentMusic && !this.muted) ? this.volumes.music : 0;
      a.volume = target;
    });
    Object.values(this.sfx).forEach(a => {
      if (a) a.volume = this.muted ? 0 : this.volumes.sfx;
    });
  },

  playMusic(key) {
    const next = this.music[key];
    if (!next || next === this.currentMusic) return;
    // Fade out current
    if (this.currentMusic) {
      const old = this.currentMusic;
      const startVol = old.volume;
      let step = 0;
      const fade = setInterval(() => {
        step++;
        old.volume = Math.max(0, startVol * (1 - step / 20));
        if (step >= 20) { clearInterval(fade); old.pause(); }
      }, 50);
    }
    this.currentMusic = next;
    next.currentTime = 0;
    next.volume = 0;
    const p = next.play();
    if (p && p.catch) p.catch(() => {});
    if (!this.muted) {
      let step = 0;
      const target = this.volumes.music;
      const fade = setInterval(() => {
        step++;
        next.volume = target * (step / 20);
        if (step >= 20) clearInterval(fade);
      }, 50);
    }
  },

  stopMusic() {
    if (this.currentMusic) {
      this.currentMusic.pause();
      this.currentMusic = null;
    }
  },

  play(key) {
    const a = this.sfx[key];
    if (!a || this.muted) return;
    try {
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
};

  async typewriter(el, text, speed = CONFIG.TYPING_SPEED) {
    el.innerHTML = '';
    el.classList.remove('done');
    // Use innerHTML char by char while parsing tags
    const tokens = [];
    let i = 0;
    while (i < text.length) {
      if (text[i] === '<') {
        const end = text.indexOf('>', i);
        if (end !== -1) { tokens.push(text.slice(i, end + 1)); i = end + 1; continue; }
      }
      tokens.push(text[i]);
      i++;
    }
    let acc = '';
    for (const t of tokens) {
      acc += t;
      el.innerHTML = acc;
      if (t.length === 1 && t !== ' ') {
        await this.sleep(speed);
      }
    }
    el.classList.add('done');
  },

  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },

  floatFeedback(text, isNegative = false) {

    el.className = 'float-feedback' + (isNegative ? ' minus' : '');

/* ===== HP / HONOR / STREAK ===== */
function modifyHP(delta) {
  if (delta < 0 && STATE.shieldArmed) {
    STATE.shieldArmed = false;
    UI.floatFeedback('🛡 SHIELDED');
    return;
  }
  // Fealath shield: -5 damage reduction
  if (delta < 0 && STATE.dragon === 'fealath') {
    delta = Math.min(0, delta + 5);
  }
  STATE.hp = Math.max(0, Math.min(100, STATE.hp + delta));
  if (delta !== 0) {
    UI.floatFeedback((delta > 0 ? '+' : '') + delta + ' HP', delta < 0);
    if (delta < 0) {
      AUDIO.play('hpLoss');
      UI.screenFlash('red');
      UI.screenShake();
      UI.povShake();
    }
  }
  UI.updateHUD();
}

function modifyHonor(delta) {
  STATE.honor = Math.max(0, Math.min(100, STATE.honor + delta));
  if (delta !== 0) {
    UI.floatFeedback((delta > 0 ? '+' : '') + delta + ' HONOR', delta < 0);
    if (delta > 0) {
      AUDIO.play('honorGain');
      UI.screenFlash('gold');
    }
  }
  UI.updateHUD();
}

function bumpStreak(correct) {
  if (correct) {
    STATE.streak++;
    if (STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak;
    if (STATE.streak === 3) {
      UI.showCombo('TRIPLE STRIKE!', 'perfect');
      AUDIO.play('comboPerfect');
      modifyHonor(+5);
      // Caorragh bonus
      if (STATE.dragon === 'caorragh') modifyHonor(+10);
    } else if (STATE.streak === 5) {
      UI.showCombo('PERFECT STORM!', 'perfect');
      AUDIO.play('comboPerfect');
      modifyHonor(+10);
    }
  } else {
    if (STATE.streak >= 3) {
      UI.showCombo('STREAK BROKEN', 'fail');
      AUDIO.play('comboFail');
    }
    STATE.streak = 0;
  }
  UI.updateHUD();
}

/* ===== SIGNET INVOCATION SYSTEM ===== */
function buildSignetBar(allowedPhases = [1, 2, 3]) {
  if (STATE.signetUsed || !allowedPhases.includes(STATE.phase)) return null;
  const bar = document.createElement('div');
  bar.className = 'signet-bar';
  const s = SIGNETS.find(x => x.id === STATE.signet);
  if (!s) return null;
  const btn = document.createElement('button');
  btn.className = 'signet-quick-btn';
  btn.innerHTML = `<span class="signet-icon">⚡</span> INVOKE ${s.name.toUpperCase()}`;
  btn.addEventListener('click', () => promptSignet());
  bar.appendChild(btn);
  return bar;
}

function promptSignet() {
  if (STATE.signetUsed) return;
  const s = SIGNETS.find(x => x.id === STATE.signet);
  if (!s) return;
  const overlay = document.getElementById('signet-overlay');
  document.getElementById('signet-cast-title').textContent = '⚡ ' + s.name.toUpperCase() + ' ⚡';
  document.getElementById('signet-cast-desc').textContent = s.desc;
  document.getElementById('signet-cast-cost').textContent = 'Cost: ' + s.cost;
  overlay.classList.add('active');

  const confirm = document.getElementById('signet-confirm');
  const cancel = document.getElementById('signet-cancel');
  const confirmHandler = () => {
    overlay.classList.remove('active');
    invokeSignet(s);
    confirm.removeEventListener('click', confirmHandler);
    cancel.removeEventListener('click', cancelHandler);
  };
  const cancelHandler = () => {
    overlay.classList.remove('active');
    confirm.removeEventListener('click', confirmHandler);
    cancel.removeEventListener('click', cancelHandler);
  };
  confirm.addEventListener('click', confirmHandler);
  cancel.addEventListener('click', cancelHandler);
}

function invokeSignet(s) {
  STATE.signetUsed = true;
  AUDIO.play('signetCast');
  UI.screenFlash('white');

  switch (s.id) {
    case 'peek':
      modifyHonor(-10);
      STATE.signetReadyForUse = 'peek';
      UI.floatFeedback('👁 TRUTH REVEALED');
      hintNextCorrect();
      break;
    case 'skip':
      modifyHP(-5);
      STATE.signetReadyForUse = 'skip';
      UI.floatFeedback('⏭ PATH FOUND');
      skipCurrentQuestion();
      break;
    case 'time':
      modifyHonor(-5);
      STATE.signetReadyForUse = 'time';
      addTimerSeconds(10);
      UI.floatFeedback('⏳ TIME SLOWED');
      break;
    case 'shield':
      modifyHonor(-10);
      STATE.shieldArmed = true;
      UI.floatFeedback('🛡 WARDED');
      break;
    case 'fifty':
      modifyHonor(-5);
      STATE.signetReadyForUse = 'fifty';
      eliminateTwoOptions();
      UI.floatFeedback('🎯 MIND READ');
      break;
    case 'heal':
      modifyHonor(-15);
      modifyHP(+20);
      UI.floatFeedback('💚 HEALED');
      break;
  }
    // Disable any signet-bar buttons currently on screen
  document.querySelectorAll('.signet-quick-btn').forEach(b => {
    b.disabled = true;
    b.innerHTML = '<span class="signet-icon">✓</span> SIGNET SPENT';
  });
}

/* Hooks the active question container's options to support signet effects */
let CURRENT_QUESTION = null; // { container, options:[{el,isCorrect}], onAnswer, addTimer }

function registerCurrentQuestion(q) { CURRENT_QUESTION = q; }
function clearCurrentQuestion() { CURRENT_QUESTION = null; }

function hintNextCorrect() {
  if (!CURRENT_QUESTION) return;
  CURRENT_QUESTION.options.forEach(o => {
    if (o.isCorrect) o.el.classList.add('hint-correct');
  });
}

function skipCurrentQuestion() {
  if (!CURRENT_QUESTION) return;
  if (typeof CURRENT_QUESTION.onAnswer === 'function') {
    CURRENT_QUESTION.onAnswer({ skipped: true });
  }
}

function eliminateTwoOptions() {
  if (!CURRENT_QUESTION) return;
  const wrongs = CURRENT_QUESTION.options.filter(o => !o.isCorrect);
  // Pick two to eliminate
  const pool = [...wrongs].sort(() => Math.random() - 0.5).slice(0, 2);
  pool.forEach(o => o.el.classList.add('eliminated'));
}

function addTimerSeconds(s) {
  if (CURRENT_QUESTION && typeof CURRENT_QUESTION.addTimer === 'function') {
    CURRENT_QUESTION.addTimer(s);
  }
}

/* Sequence runner: present questions one by one within container */
async function runQuestionSequence(questions, container, opts = {}) {
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    const result = await askQuestion(q, container, i, questions.length);
    // Track stats
    const trackKey = q.type || opts.trackKey;
    if (trackKey && STATE.stats[trackKey]) {
      STATE.stats[trackKey].total++;
      if (result.correct) STATE.stats[trackKey].correct++;
      else if (!result.skipped) {
        STATE.stats[trackKey].errors.push({
          q: q.q || q.prompt,
          given: q.options[result.chosen],
          correct: q.options[q.correct],
          explain: q.explain
        });
      }
    }
    await UI.sleep(450);
  }
}

/* Single question: returns Promise<{correct, chosen, skipped}> */
function askQuestion(q, container, idx, total) {
  return new Promise(resolve => {
    const block = document.createElement('div');
    block.className = 'task-card reveal';
    block.style.marginTop = '14px';
    block.innerHTML = `
      <div class="task-label">Question ${idx + 1} / ${total}</div>
      <p class="tactical-text">${q.q || q.prompt}${q.hint ? ` <em style="opacity:.7">(${q.hint})</em>` : ''}</p>
      <div class="options-grid"></div>
    `;
    container.appendChild(block);

    const grid = block.querySelector('.options-grid');
    const optEls = [];
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-key">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
      btn.addEventListener('click', () => answer(i));
      grid.appendChild(btn);
      optEls.push({ el: btn, isCorrect: i === q.correct });
    });

    registerCurrentQuestion({
      container: block,
      options: optEls,
      onAnswer: (r) => {
        if (r.skipped) {
          optEls.forEach(o => o.el.disabled = true);
          clearCurrentQuestion();
          resolve({ correct: false, chosen: -1, skipped: true });
        }
      }
    });

    function answer(chosen) {
      optEls.forEach(o => o.el.disabled = true);
      const correct = chosen === q.correct;
      optEls[chosen].el.classList.add(correct ? 'correct' : 'wrong');
      if (!correct) optEls[q.correct].el.classList.add('correct');

      if (correct) {
        AUDIO.play('correct');
        modifyHonor(+5);
        bumpStreak(true);
      } else {
        AUDIO.play('wrong');
        modifyHP(-10);
        modifyHonor(-3);
        bumpStreak(false);
      }

      // Explanation
      const exp = document.createElement('div');
      exp.style.cssText = 'margin-top:12px;padding:10px 14px;background:rgba(0,0,0,.35);border-left:3px solid var(--gold);font-style:italic;font-size:14px;color:var(--parch);border-radius:2px';
      exp.innerHTML = `<strong style="color:var(--gold-bright);font-family:var(--font-heading);letter-spacing:1px;font-size:12px">${correct ? '✓ CORRECT' : '✗ WRONG'}</strong> — ${q.explain}`;
      block.appendChild(exp);

      clearCurrentQuestion();
      setTimeout(() => resolve({ correct, chosen, skipped: false }), 1100);
    }
  });
}

function solveClozeGap(gap, gapEl, panel, idx, total) {

    const block = document.createElement('div');
    block.className = 'task-card reveal cloze-question';
    block.style.marginTop = '14px';

      <div class="task-label">Gap ${idx} / ${total}</div>
      <p class="tactical-text">Choose the word/phrase that fits the highlighted gap.</p>
      <div class="options-grid"></div>
    `;
    panel.appendChild(block);

    const grid = block.querySelector('.options-grid');
    const optEls = [];
    gap.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-key">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
      btn.addEventListener('click', () => answer(i));
      grid.appendChild(btn);
      optEls.push({ el: btn, isCorrect: i === gap.correct });
    });

    registerCurrentQuestion({
      container: block,
      options: optEls,
      onAnswer: (r) => {
        if (r.skipped) {
          optEls.forEach(o => o.el.disabled = true);
          gapEl.innerHTML = gap.options[gap.correct];
          gapEl.classList.add('filled');
          clearCurrentQuestion();
          STATE.stats.listening.total++;
          resolve();
        }

    });

    function answer(chosen) {
      optEls.forEach(o => o.el.disabled = true);

      optEls[chosen].el.classList.add(correct ? 'correct' : 'wrong');
      if (!correct) optEls[gap.correct].el.classList.add('correct');

      gapEl.innerHTML = gap.options[gap.correct];
      gapEl.classList.add(correct ? 'filled' : 'wrong-fill');

      STATE.stats.listening.total++;
      if (correct) {
        STATE.stats.listening.correct++;
        AUDIO.play('correct');
        modifyHonor(+4);
        bumpStreak(true);
      } else {
        STATE.stats.listening.errors.push({
          q: 'Rhiannon\'s order — gap ' + idx,

          correct: gap.options[gap.correct],
          explain: gap.explain

function askTimedQuestion(q, container, idx, total) {
  return new Promise(resolve => {
    const block = document.createElement('div');
    block.className = 'task-card reveal';
    block.style.position = 'relative';
    block.style.marginTop = '14px';
    block.innerHTML = `
      <div class="circular-timer" id="ct-${idx}">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="44"></circle>
          <circle class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-num">--</div>
      </div>
      <div class="task-label">⚔ Strike ${idx + 1} / ${total} ⚔</div>
      <p class="tactical-text">${q.prompt}${q.hint ? ` <em style="opacity:.7">(${q.hint})</em>` : ''}</p>
      <div class="options-grid"></div>
    `;
    container.appendChild(block);

    const grid = block.querySelector('.options-grid');
    const optEls = [];
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-key">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
      btn.addEventListener('click', () => answer(i));
      grid.appendChild(btn);
      optEls.push({ el: btn, isCorrect: i === q.correct });
    });

    // Timer config
    let totalTime = CONFIG.PHASE_3_TIME_PER_Q;
    // Taevin bonus
    if (STATE.dragon === 'taevin') totalTime += 3;
    let remaining = totalTime;
    const timerNum = block.querySelector('.timer-num');
    const fgCircle = block.querySelector('.circular-timer .fg');
    const ctBox = block.querySelector('.circular-timer');
    const CIRC = 2 * Math.PI * 44;
    fgCircle.style.strokeDasharray = CIRC;

    function updateTimerVisual() {
      timerNum.textContent = remaining;
      const offset = CIRC * (1 - remaining / totalTime);
      fgCircle.style.strokeDashoffset = offset;
      document.getElementById('timer-val').textContent = '00:' + String(remaining).padStart(2, '0');
      ctBox.classList.toggle('warn', remaining <= CONFIG.PHASE_3_TIMER_WARN && remaining > 0);
    }
    updateTimerVisual();

    let interval = setInterval(() => {
      remaining--;
      if (remaining <= CONFIG.PHASE_3_TIMER_WARN && remaining > 0) AUDIO.play('timerTick');
      updateTimerVisual();
      if (remaining <= 0) {
        clearInterval(interval);
        timeOut();
      }
    }, 1000);

    registerCurrentQuestion({
      container: block,
      options: optEls,
      onAnswer: (r) => {
        if (r.skipped) {
          clearInterval(interval);
          optEls.forEach(o => o.el.disabled = true);
          clearCurrentQuestion();
          resolve({ correct: false, chosen: -1, skipped: true });
        }
      },
      addTimer: (s) => {
        totalTime += s;
        remaining += s;
        updateTimerVisual();
      }
    });

    function timeOut() {
      optEls.forEach(o => o.el.disabled = true);
      optEls[q.correct].el.classList.add('correct');
      AUDIO.play('wrong');
      modifyHP(-15);
      modifyHonor(-5);
      bumpStreak(false);
      UI.povShake();

      const exp = document.createElement('div');
      exp.style.cssText = 'margin-top:12px;padding:10px 14px;background:rgba(0,0,0,.35);border-left:3px solid var(--red);font-style:italic;font-size:14px;color:var(--parch);border-radius:2px';
      exp.innerHTML = `<strong style="color:#ff8888;font-family:var(--font-heading);letter-spacing:1px;font-size:12px">⏱ TIMED OUT</strong> — ${q.explain}`;
      block.appendChild(exp);

      clearCurrentQuestion();
      setTimeout(() => resolve({ correct: false, chosen: -1, skipped: false }), 1100);
    }

    function answer(chosen) {
      clearInterval(interval);
      optEls.forEach(o => o.el.disabled = true);
      const correct = chosen === q.correct;
      optEls[chosen].el.classList.add(correct ? 'correct' : 'wrong');
      if (!correct) optEls[q.correct].el.classList.add('correct');

      if (correct) {
        AUDIO.play('correct');
        modifyHonor(+6);
        bumpStreak(true);
        UI.povTilt(Math.random() > 0.5 ? 'right' : 'left');
      } else {
        AUDIO.play('wrong');
        modifyHP(-12);
        modifyHonor(-4);
        bumpStreak(false);
        UI.povShake();
      }

      const exp = document.createElement('div');
      exp.style.cssText = 'margin-top:12px;padding:10px 14px;background:rgba(0,0,0,.35);border-left:3px solid var(--gold);font-style:italic;font-size:14px;color:var(--parch);border-radius:2px';
      exp.innerHTML = `<strong style="color:var(--gold-bright);font-family:var(--font-heading);letter-spacing:1px;font-size:12px">${correct ? '✓ STRIKE LANDED' : '✗ MISS'}</strong> — ${q.explain}`;
      block.appendChild(exp);

      clearCurrentQuestion();
      setTimeout(() => resolve({ correct, chosen, skipped: false }), 1000);
    }
  });
}

/* ===== VERDICT ===== */
function calculateVerdict() {
  const hp = STATE.hp;
  const honor = STATE.honor;
  const total = STATE.stats.reading.total + STATE.stats.listening.total +
                STATE.stats.grammar.total + STATE.stats.combat.total;
  const correct = STATE.stats.reading.correct + STATE.stats.listening.correct +
                  STATE.stats.grammar.correct + STATE.stats.combat.correct;
  const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

  if (hp <= 0) {
    return { tier: 'fallen', title: 'FALLEN', color: '#8b2c2c', icon: '💀',
      caeden: 'You bled out in the sky, cadet. The Quadrant mourns its loss. The wyverns... do not.' };
  }
  if (honor >= 80 && accuracy >= 85) {
    return { tier: 'paragon', title: 'PARAGON', color: '#ffd97a', icon: '👑',
      caeden: 'In all my years training cadets, I have rarely seen courage and judgment in such balance. The wing is yours to command, when the time comes.' };
  }
  if (honor >= 60 && accuracy >= 70) {
    return { tier: 'honored', title: 'HONORED', color: '#c9a96e', icon: '⚜',
      caeden: 'A solid performance. Garrick will be pleased. You have the makings of a fine rider, cadet.' };
  }
  if (accuracy >= 50) {
    return { tier: 'survivor', title: 'SURVIVOR', color: '#a8b5c0', icon: '⚔',
      caeden: 'You lived. Many do not. There is much to learn — but you have time. Use it well.' };
  }
  return { tier: 'disgraced', title: 'DISGRACED', color: '#5a3a3a', icon: '⚠',
    caeden: 'You made it back. Barely. The Quadrant does not forget a poor showing. Train harder, cadet — or the next flight will be your last.' };
}

  const v = calculateVerdict();

  const overlay = document.createElement('div');

/* ===== DOSSIER ===== */
function runDossier() {
  const totalQ = STATE.stats.reading.total + STATE.stats.listening.total +
                 STATE.stats.grammar.total + STATE.stats.combat.total;
  const totalC = STATE.stats.reading.correct + STATE.stats.listening.correct +
                 STATE.stats.grammar.correct + STATE.stats.combat.correct;
  const acc = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;

  const elapsed = Math.round((Date.now() - STATE.startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  const dragon = DRAGONS.find(d => d.id === STATE.dragon);
  const signet = SIGNETS.find(s => s.id === STATE.signet);

  // Dominant tone
  const tones = STATE.stats.judgment;
  let dominant = 'humble';
  let max = 0;
  Object.entries(tones).forEach(([k, v]) => { if (v > max) { max = v; dominant = k; } });
  const toneLabels = {
    defiant: '🔥 DEFIANT — A rider who bends rules to fit the moment',
    humble: '⚜ HUMBLE — A rider who honors the drill and the line',
    personal: '💚 PERSONAL — A rider who leads with heart and bond',
    formal: '📜 FORMAL — A rider who quotes protocol with precision'
  };

  // Collect all errors
  const allErrors = [
    ...STATE.stats.reading.errors,
    ...STATE.stats.listening.errors,
    ...STATE.stats.grammar.errors,
    ...STATE.stats.combat.errors
  ];

  const sectionStat = (label, c, t) => {
    const pct = t > 0 ? Math.round((c / t) * 100) : 0;
    return `
      <div class="stat-row">
        <div class="stat-label">${label}</div>
        <div class="stat-bar"><span class="stat-fill" style="width:0%" data-target="${pct}"></span></div>
        <div class="stat-val">${c}/${t} · ${pct}%</div>
      </div>`;
  };

  const overlay = document.createElement('div');
  overlay.className = 'dossier-overlay';
  overlay.innerHTML = `
    <div class="dossier-header">
      <div class="dossier-seal">⚜</div>
      <div class="dossier-title">⚜ OFFICIAL DOSSIER ⚜</div>
      <div class="dossier-sub">Basgiath War College · Honor Trial Record</div>
    </div>

    <div class="dossier-meta">
      <div><strong>VERDICT:</strong> <span style="color:${STATE.verdict.color}">${STATE.verdict.title}</span></div>
      <div><strong>HONOR:</strong> ${STATE.honor} / 100</div>
      <div><strong>DRAGON:</strong> ${dragon ? dragon.name : '—'}</div>
      <div><strong>HP REMAINING:</strong> ${STATE.hp} / 100</div>
      <div><strong>SIGNET:</strong> ${signet ? signet.name : '—'} ${STATE.signetUsed ? '(used)' : '(unused)'}</div>
      <div><strong>TIME:</strong> ${mins}m ${secs}s</div>
      <div><strong>BEST STREAK:</strong> 🔥 ×${STATE.bestStreak}</div>
      <div><strong>DOMINANT TONE:</strong> ${toneLabels[dominant]}</div>
      ${STATE.romanceFlag ? '<div style="grid-column:span 2"><strong style="color:#ff9ec5">💗 ROMANCE FLAG:</strong> Caeden noticed you...</div>' : ''}
    </div>

    <div class="dossier-section-title">⚔ PERFORMANCE BY SKILL ⚔</div>
    <div class="dossier-stats">
      ${sectionStat('READING', STATE.stats.reading.correct, STATE.stats.reading.total)}
      ${sectionStat('LISTENING', STATE.stats.listening.correct, STATE.stats.listening.total)}
      ${sectionStat('GRAMMAR', STATE.stats.grammar.correct, STATE.stats.grammar.total)}
      ${sectionStat('COMBAT', STATE.stats.combat.correct, STATE.stats.combat.total)}
      <div class="stat-row" style="margin-top:16px;border-top:1px solid rgba(201,169,110,.3);padding-top:12px">
        <div class="stat-label" style="color:var(--gold)">⚜ OVERALL</div>
        <div class="stat-bar"><span class="stat-fill" style="width:0%;background:linear-gradient(90deg, var(--gold), var(--gold-bright))" data-target="${acc}"></span></div>
                <div class="stat-val" style="color:var(--gold-bright)">${totalC}/${totalQ} · ${acc}%</div>
      </div>
    </div>

    ${allErrors.length > 0 ? `
      <div class="dossier-section-title">📜 LESSONS FROM THE SKY 📜</div>
      <div class="errors-list">
        ${allErrors.map(e => `
          <div class="error-item">
            <div class="error-q">"${e.q}"</div>
            <div class="error-pair">
              <span class="given">Your answer: ${e.given}</span>
              <span class="arrow">→</span>
              <span class="correct">Correct: ${e.correct}</span>
            </div>
            <div class="error-explain">⚜ ${e.explain}</div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div class="dossier-section-title">📜 FLAWLESS FLIGHT 📜</div>
      <div style="text-align:center;padding:24px;font-family:var(--font-heading);color:var(--gold-bright);letter-spacing:2px">
        ⚜ NO ERRORS RECORDED · A PERFECT TRIAL ⚜
      </div>
    `}

    <div class="dossier-footer">
      <button class="btn primary" id="dossier-final">⚜ CONTINUE ⚜</button>
    </div>
  `;
  document.body.appendChild(overlay);

  setTimeout(() => {
    overlay.classList.add('visible');
    // Animate stat bars
    setTimeout(() => {
      overlay.querySelectorAll('.stat-fill').forEach(bar => {
        const target = bar.dataset.target;
        bar.style.width = target + '%';
      });
    }, 400);
  }, 50);

  document.getElementById('dossier-final').addEventListener('click', () => {
    overlay.remove();
    runFinalCard();
  }, { once: true });
}

/* ===== FINAL CARD ===== */
function runFinalCard() {
  AUDIO.stopMusic();
  AUDIO.playMusic('calm');

  const v = STATE.verdict;
  const dragon = DRAGONS.find(d => d.id === STATE.dragon);

  const overlay = document.createElement('div');
  overlay.className = 'verdict-overlay';
  overlay.style.borderColor = v.color;
  overlay.innerHTML = `
    <div class="verdict-icon" style="color:${v.color}">⚜</div>
    <div class="verdict-subtitle">— THE TRIAL IS COMPLETE —</div>
    <div class="verdict-title" style="color:${v.color};font-size:42px">${v.title}</div>
    <div class="verdict-caeden" style="font-size:16px">
      The wind carries you home as the sun bleeds gold across the cliffs of Basgiath.<br><br>
      ${dragon ? dragon.name : 'Your dragon'} hums beneath you — a low, steady note that means
      <em>"well flown, rider."</em><br><br>
      Tonight you will sleep in the barracks. Tomorrow, the next trial begins.<br><br>
      <strong style="color:${v.color};font-family:var(--font-heading);letter-spacing:2px">
        ⚜ THE SKY REMEMBERS ⚜
      </strong>
      ${STATE.romanceFlag ? '<br><br><em style="color:#ff9ec5">...and a certain Squad Leader will be watching the next flight roster very, very carefully.</em>' : ''}
    </div>
    <button class="verdict-btn" id="final-restart">⚔ FLY AGAIN ⚔</button>
  `;
  document.body.appendChild(overlay);

  setTimeout(() => overlay.classList.add('visible'), 50);
  AUDIO.play('gong');

  document.getElementById('final-restart').addEventListener('click', () => {
    location.reload();
  }, { once: true });
}

/* ===== BOOTSTRAP ===== */
document.addEventListener('DOMContentLoaded', () => {
  AUDIO.init();
  UI.updateHUD();

  // Build dynamic clouds
  const farLayer = document.querySelector('.cloud-layer.far');
  const nearLayer = document.querySelector('.cloud-layer.near');
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = (10 + i * 22) + '%';
    c.style.left = (Math.random() * 100) + '%';
    c.style.width = (180 + Math.random() * 120) + 'px';
    c.style.height = (60 + Math.random() * 40) + 'px';
    c.style.animationDuration = (60 + Math.random() * 40) + 's';
    c.style.animationDelay = (-Math.random() * 60) + 's';
    farLayer.appendChild(c);
  }
  for (let i = 0; i < 3; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = (20 + i * 28) + '%';
    c.style.left = (Math.random() * 100) + '%';
    c.style.width = (240 + Math.random() * 160) + 'px';
    c.style.height = (80 + Math.random() * 50) + 'px';
    c.style.opacity = '0.5';
    c.style.animationDuration = (40 + Math.random() * 30) + 's';
    c.style.animationDelay = (-Math.random() * 40) + 's';
    nearLayer.appendChild(c);
  }

  // Start intro
  runIntro();
});

</script>
</body>
</html>
