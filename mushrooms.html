<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Old Ways</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:Georgia,serif;color:#eaf6ff;}
#stage{position:absolute;inset:0;}

/* ====== ГРИБЫ ====== */
.shroom{position:absolute;width:90px;height:110px;cursor:pointer;z-index:20;
  transition:filter .5s,transform .3s;filter:drop-shadow(0 0 8px #6fffa055);}
.shroom:hover{transform:scale(1.08);}
.shroom.lit{filter:drop-shadow(0 0 22px #ffd86fcc) drop-shadow(0 0 40px #ffaa3388);}
.shroom .cap{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:80px;height:55px;border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 50% 35%,#7affb0,#2fa86a 70%,#1c6e44);
  transition:background .6s;}
.shroom.lit .cap{background:radial-gradient(circle at 50% 35%,#fff3c0,#ffcb52 60%,#e8941f);}
.shroom .stem{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:30px;height:70px;border-radius:14px 14px 8px 8px;
  background:linear-gradient(#f0ead8,#cbbf9e);}
.shroom .dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.85);}
/* пульсация свечения у незажжённых */
.shroom:not(.lit){animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 8px #6fffa055);}50%{filter:drop-shadow(0 0 18px #6fffa0aa);}}

/* ====== ИНСТРУКЦИЯ ====== */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(5,18,12,.6);backdrop-filter:blur(3px);}
#intro.hide{display:none;}
#introBox{background:#0c1f15;border:1px solid #6fffa0;border-radius:16px;
  padding:28px 32px;max-width:460px;width:90%;text-align:center;box-shadow:0 0 30px #2fa86a88;}
#introBox h2{font-size:18px;color:#9fffc4;letter-spacing:2px;margin-bottom:14px;}
#introBox p{font-size:15px;line-height:1.7;margin-bottom:20px;}
#introBox b{color:#ffd86f;}
.btn{background:rgba(111,255,160,.12);border:1px solid #6fffa0;border-radius:10px;
  color:#dfffe9;font-size:15px;padding:11px 26px;cursor:pointer;font-family:Georgia,serif;transition:.2s;}
.btn:hover{background:#6fffa022;transform:translateY(-2px);}

/* ====== МОДАЛКА ВОПРОСА ====== */
#ov{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;
  background:rgba(5,18,12,.55);backdrop-filter:blur(3px);}
#ov.on{display:flex;}
#box{background:#0c1f15;border:1px solid #6fffa0;border-radius:16px;padding:26px 30px;
  max-width:460px;width:90%;box-shadow:0 0 30px #2fa86a88;}
#q{font-size:16px;line-height:1.6;margin-bottom:18px;}
.opt{display:block;width:100%;text-align:left;background:rgba(111,255,160,.08);
  border:1px solid #6fffa055;border-radius:10px;color:#dfffe9;font-size:15px;
  padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:.2s;font-family:Georgia,serif;}
.opt:hover{background:#6fffa022;transform:translateX(4px);}
.opt.correct{background:#3fd07a33;border-color:#3fd07a;}
.opt.wrong{background:#e0503033;border-color:#e05030;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
#fb{min-height:18px;text-align:center;font-size:13px;margin-top:6px;}

/* ====== ФИНАЛ ====== */
#final{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  background:rgba(5,18,12,.6);backdrop-filter:blur(4px);}
#final.on{display:flex;animation:fade 1.2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#finalBox{background:#0c1f15;border:1px solid #ffd86f;border-radius:16px;
  padding:30px 34px;max-width:480px;width:90%;text-align:center;box-shadow:0 0 40px #e8941f88;}
#finalBox p{font-size:16px;line-height:1.8;font-style:italic;color:#ffe9b0;margin-bottom:24px;}
.btn-gold{background:rgba(255,216,111,.12);border:1px solid #ffd86f;color:#fff3c0;}
.btn-gold:hover{background:#ffd86f22;}

/* счётчик */
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(8,28,18,.6);border:1px solid #6fffa0;border-radius:30px;
  padding:6px 18px;color:#cdffe0;font-size:13px;letter-spacing:1px;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">Mushrooms lit: <span id="cnt">0</span> / 3</div>

<!-- ИНСТРУКЦИЯ -->
<div id="intro"><div id="introBox">
  <h2>🍄 The Old Ways</h2>
  <p>Remember the Old Ways: complete the sentences using <b>used to</b> or
  <b>didn't use to</b> to reveal the first part of your memory.</p>
  <button class="btn" onclick="document.getElementById('intro').classList.add('hide')">I remember...</button>
</div></div>

<!-- ВОПРОС -->
<div id="ov"><div id="box">
  <div id="q"></div><div id="opts"></div><div id="fb"></div>
</div></div>

<!-- ФИНАЛ -->
<div id="final"><div id="finalBox">
  <p>"You remember... Good.<br>Now, untangle the timeline of what happened to you before the curse."</p>
  <button class="btn btn-gold" onclick="goNext()">Untangle the timeline →</button>
</div></div>

<script>
/* данные грибов */
const TASKS=[
  {q:"When I was a child, this forest ______ (be) a safe place.",
   o:["used to be","was used to be"],c:0,
   x:18,y:55},
  {q:"The glowing mushrooms ______ (guide) travelers, but now they lead them into traps.",
   o:["use to guide","used to guide"],c:1,
   x:46,y:62},
  {q:"Baba Yaga ______ (not / be) so cruel before the dark magic corrupted her.",
   o:["didn't used to be","didn't use to be"],c:1,
   x:73,y:50}
];
let lit=0;

/* ====== ЗВУК ====== */
let ac=null;
function chime(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  [659,880,1174,1568].forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type='sine';
    o.frequency.value=f;const t=ac.currentTime+i*0.08;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.15,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    o.start(t);o.stop(t+0.8);
  });
}

/* ====== СОЗДАЁМ ГРИБЫ ====== */
const stage=document.getElementById('stage');
TASKS.forEach((task,i)=>{
  const m=document.createElement('div');
  m.className='shroom';
  m.style.left=task.x+'%';
  m.style.top=task.y+'%';
  m.dataset.i=i;
  // ножка + шляпка + точки
  m.innerHTML='<div class="stem"></div><div class="cap"></div>';
  // случайные точки на шляпке
  const cap=m.querySelector('.cap');
  for(let k=0;k<4;k++){
    const d=document.createElement('div');d.className='dot';
    const s=6+Math.random()*8;
    d.style.width=s+'px';d.style.height=s+'px';
    d.style.left=(15+Math.random()*55)+'%';
    d.style.top=(20+Math.random()*45)+'%';
    cap.appendChild(d);
  }
  m.style.animationDelay=(Math.random()*2)+'s';
  m.onclick=()=>openQ(i,m);
  stage.appendChild(m);
});

/* ====== ВОПРОС ====== */
const ov=document.getElementById('ov');
let curEl=null,curI=null;
function openQ(i,el){
  if(el.classList.contains('lit'))return;
  curEl=el;curI=i;const t=TASKS[i];
  document.getElementById('q').textContent=t.q;
  document.getElementById('fb').textContent='';
  const oc=document.getElementById('opts');oc.innerHTML='';
  t.o.forEach((txt,j)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=txt;
    b.onclick=()=>answer(j,t,b,oc);
    oc.appendChild(b);
  });
  ov.classList.add('on');
}
function answer(j,t,btn,oc){
  const bs=oc.querySelectorAll('.opt');
  if(j===t.c){
    bs.forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    document.getElementById('fb').textContent='✦ Yes... I remember.';
    document.getElementById('fb').style.color='#6fffa0';
    chime();
    setTimeout(()=>{
      ov.classList.remove('on');
      curEl.classList.add('lit');
      lit++;
      document.getElementById('cnt').textContent=lit;
      if(lit>=TASKS.length)setTimeout(()=>document.getElementById('final').classList.add('on'),700);
    },800);
  } else {
    btn.classList.add('wrong');
    document.getElementById('fb').textContent='✦ No... that path is wrong.';
    document.getElementById('fb').style.color='#e05030';
    setTimeout(()=>{btn.classList.remove('wrong');document.getElementById('fb').textContent='';},1200);
  }
}

/* ====== ПЕРЕХОД ====== */
function goNext(){
  window.parent.postMessage('old-ways-done','*');
  /* или: location.href='URL_СЛЕДУЮЩЕГО_СЛАЙДА'; */
}
</script>
</body>
</html>
