const app=document.querySelector('#app');const $=s=>document.querySelector(s);const key='quiet-season-v2';let saved={chapters:[false,false,false],matching:false,mix:false},state=null;
try{let v=JSON.parse(localStorage.getItem(key));if(v&&Array.isArray(v.chapters)&&v.chapters.length===3)saved={chapters:v.chapters.map(Boolean),matching:!!v.matching,mix:!!v.mix}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}
function e(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scroll(){window.scrollTo(0,0)}
function bar(title,n,total){return `<div class="barline"><div><div class="eyebrow">${e(title)}</div><span class="tiny">${n} / ${total}</span></div><button class="btn outline" id="back">← Меню</button></div><div class="progress"><span style="width:${Math.min(100,(n-1)/total*100)}%"></span></div>`}
function image(scene){return `<div class="picture"><img src="https://i.yapx.ru/${scene.img}.jpg" alt="${e(scene.note)}" referrerpolicy="no-referrer"><div class="pic-controls"><span>Иллюстрация ${scenes.indexOf(scene)+1} / ${scenes.length}</span><button type="button" class="retry" aria-label="Перезагрузить иллюстрацию">↻ Перезагрузить</button></div></div>`}
function wireImage(){let img=app.querySelector('.picture img');if(!img)return;let retry=app.querySelector('.retry');let original=img.src;let failed=false;img.onerror=()=>{failed=true;img.alt='Не удалось загрузить картинку. Нажми «Перезагрузить».';retry.textContent='↻ Попробовать снова'};img.onload=()=>{failed=false;retry.textContent='↻ Перезагрузить'};retry.onclick=()=>{retry.textContent='Загружаем…';img.src=original+(original.includes('?')?'&':'?')+'retry='+Date.now()}}
function bindBack(){$('#back').onclick=home;wireImage()}
function home(){state=null;app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow">English · A1 · 21 пара</span><h1>The Quiet<br><i>Season.</i></h1><p>Слова-противоположности в историях маленькой книжной лавки.</p><button class="btn" id="openDict">Открыть словарь →</button></div><div class="hero-img" role="img" aria-label="Витрины книжной лавки осенью"></div></section><div class="list-title"><span class="eyebrow">Твой маршрут</span><h2>Изучай в своём темпе</h2></div><div class="stages"><article class="stage"><div><span class="eyebrow">01 · знакомство</span><h3>Словарь с картинками</h3><p>21 пара · озвучка и перевод</p></div><button class="btn outline" data-go="dict">Открыть →</button></article>${[0,1,2].map(i=>`<article class="stage"><div><span class="eyebrow">0${i+2} · практика</span><h3>Блок ${i+1}</h3><p>7 пар · выбор слова ${saved.chapters[i]?'· ✓ пройдено':''}</p></div><button class="btn outline" data-go="c${i}">${saved.chapters[i]?'Повторить':'Начать'} →</button></article>`).join('')}<article class="stage"><div><span class="eyebrow">05 · повторение</span><h3>Найди антоним</h3><p>21 пара · подбери противоположное слово ${saved.matching?'· ✓ пройдено':''}</p></div><button class="btn outline" data-go="match">Начать →</button></article><article class="stage"><div><span class="eyebrow">06 · финал</span><h3>Микс заданий</h3><p>21 задание · выбор и ввод слова ${saved.mix?'· ✓ пройдено':''}</p></div><button class="btn outline" data-go="mix">Начать →</button></article></div><p class="course-note">Разделы доступны в любом порядке. Завершённые блоки сохраняются в этом браузере; при выходе незавершённый блок начинается заново.</p><div class="foot">A little book of opposites · <button class="plain" id="reset">Сбросить прогресс</button></div>`;$('#openDict').onclick=()=>dictionary(0);app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const v=b.dataset.go;if(v==='dict')dictionary(0);else if(v==='match')startMatching();else if(v==='mix')startMix();else startChapter(Number(v[1]))});$('#reset').onclick=()=>{if(confirm('Сбросить отметки о завершении разделов на этом устройстве?')){saved={chapters:[false,false,false],matching:false,mix:false};save();home()}};scroll()}
// Android may populate voices asynchronously. Read the current list at each tap;
// do not assume that an incomplete list means an English voice cannot be used.
let speechRequest = 0;
let activeUtterance = null;
let speechTimer = null;
function speak(text){
  const info = $('#audioInfo');
  if (!info) return;
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    info.textContent = 'Озвучка недоступна в этом браузере.';
    return;
  }
  const request = ++speechRequest;
  clearTimeout(speechTimer);
  const update = message => {
    if (request === speechRequest && info.isConnected) info.textContent = message;
  };
  try {
    const synth = window.speechSynthesis;
    const voices = synth.getVoices();
    const english = voices.find(v => /^en(?:[-_]|$)/i.test(v.lang || ''));
    if (synth.speaking || synth.pending) synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    activeUtterance = utterance;
    utterance.lang = english ? english.lang : 'en-US';
    if (english) utterance.voice = english;
    utterance.rate = 0.85;
    utterance.onstart = () => { if (request !== speechRequest) return; clearTimeout(speechTimer); update(''); };
    utterance.onend = () => { if (request !== speechRequest) return; clearTimeout(speechTimer); activeUtterance = null; update(''); };
    utterance.onerror = event => {
      if (request !== speechRequest) return;
      clearTimeout(speechTimer); activeUtterance = null;
      if (event.error === 'canceled' || event.error === 'interrupted') return;
      update('Не удалось включить озвучку. Проверь громкость и английский голос в настройках синтеза речи телефона.');
    };
    update('Запускаем озвучку…');
    speechTimer = setTimeout(() => update('Озвучка не запустилась. Попробуй ещё раз и проверь английский голос в настройках телефона.'), 5000);
    // Called directly from the user's click: some mobile browsers require this.
    synth.speak(utterance);
  } catch (error) {
    activeUtterance = null;
    update('Не удалось запустить озвучку. Проверь настройки синтеза речи телефона.');
  }
}
function dictionary(i){state={mode:'dict',i};let s=scenes[i];app.innerHTML=`${bar('Словарь',i+1,21)}<div class="layout">${image(s)}<section class="panel"><span class="eyebrow">Слушай и сравнивай</span><h2>Пара слов</h2><div class="vocab">${s.words.map((w,j)=>`<div class="word"><div class="word-main"><strong lang="en">${e(w.w)}</strong><button class="listen" data-speak="${j}" aria-label="Прослушать ${e(w.w)}">🔊</button></div><div class="example" lang="en">${e(w.ex)}</div><div class="translation" hidden>${e(w.ru)}</div></div>`).join('')}</div><div class="message" id="audioInfo" role="status"></div><p class="tiny">${e(s.note)}</p><div class="actions"><button id="translate" class="btn outline" aria-pressed="false">Показать перевод</button></div><div class="actions"><button id="prev" class="btn outline" ${i===0?'disabled':''}>← Назад</button>${i<20?'<button id="next" class="btn push">Дальше →</button>':'<button id="next" class="btn push">К практике →</button>'}</div></section></div>`;bindBack();app.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(s.words[+b.dataset.speak].w));$('#translate').onclick=ev=>{let on=ev.currentTarget.getAttribute('aria-pressed')!=='true';ev.currentTarget.setAttribute('aria-pressed',String(on));ev.currentTarget.textContent=on?'Скрыть перевод':'Показать перевод';app.querySelectorAll('.translation').forEach(el=>el.hidden=!on)};$('#prev').onclick=()=>{dictionary(i-1);scroll()};$('#next').onclick=()=>{if(i<20){dictionary(i+1);scroll()}else home()}}
function blank(sentence,word){const pos=sentence.toLowerCase().indexOf(word.toLowerCase());if(pos<0)throw new Error('Missing word in example: '+sentence);return e(sentence.slice(0,pos))+'<span class="blank">&nbsp;_____&nbsp;</span>'+e(sentence.slice(pos+word.length))}
function startChapter(i){state={mode:'chapter',chapter:i,step:0,first:0,attempted:false,solved:false};renderChapter();scroll()}
function renderChapter(){let n=Math.floor(state.step/2),s=scenes[state.chapter*7+n],side=(n%2?1-state.step%2:state.step%2),w=s.words[side],other=s.words[1-side];state.attempted=false;state.solved=false;let opts=shuffle([w.w,other.w]);app.innerHTML=`${bar('Блок '+(state.chapter+1),state.step+1,14)}<div class="layout">${image(s)}<section class="panel"><span class="eyebrow">Выбери слово</span><h2>Посмотри и дополни</h2><div class="cue">${e(w.cue)}</div>${s.id==='safe-dangerous'||s.id==='beautiful-ugly'||s.id==='fast-slow'||s.id==='new-old'||s.id==='good-bad'?`<p class="tiny">${e(s.note)}</p>`:''}<p class="sentence" lang="en">${blank(w.ex,w.w)}</p><div class="choices">${opts.map(o=>`<button class="choice" data-choice="${e(o)}" lang="en">${e(o)}</button>`).join('')}</div><details class="hint"><summary>Подсказка</summary><p>${s.words.map(x=>`${e(x.w)} — ${e(x.ru)}`).join(' · ')}</p></details><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="btn push" id="next" hidden>${state.step===13?'Завершить':'Дальше'} →</button></div></section></div>`;bindBack();app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>checkChoice(b,w.w,w.ex));$('#next').onclick=()=>{state.step++;if(state.step===14){saved.chapters[state.chapter]=true;save();finish('Блок '+(state.chapter+1)+' завершён',state.first,14)}else{renderChapter();scroll()}}}
function checkChoice(btn,correct,example){if(state.solved)return;if(btn.dataset.choice!==correct){state.attempted=true;btn.classList.add('wrong');$('#feedback').innerHTML='<div class="feedback bad">Не совсем. Посмотри ещё раз или открой подсказку.</div>';return}if(!state.attempted)state.first++;state.solved=true;app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(b.dataset.choice===correct)b.classList.add('right')});$('#feedback').innerHTML=`<div class="feedback">Верно! <span lang="en">${e(example)}</span></div>`;$('#next').hidden=false}
function finish(title,score,total){app.innerHTML=`<section class="finish"><span class="eyebrow">Отличная работа</span><h2>${e(title)}</h2><p>С первой попытки: ${score} из ${total}. Остальные слова можно спокойно повторить.</p><div class="actions"><button class="btn" id="finishHome">К разделам →</button></div></section>`;$('#finishHome').onclick=home;scroll()}
// Four options, excluding other valid opposites when a word has multiple senses.
function startMatching(){state={mode:'matching',items:shuffle(scenes.map((_,i)=>i)),step:0,first:0,attempted:false,solved:false};renderMatching();scroll()}
function renderMatching(){let s=scenes[state.items[state.step]],a=s.words[0],b=s.words[1];state.solved=false;state.attempted=false;let avoid=new Set([a.w,b.w]);if(a.w==='old')avoid.add('young');if(a.w==='right')avoid.add('left');let pool=[...new Set(scenes.flatMap(x=>x.words.map(w=>w.w)))].filter(x=>!avoid.has(x));let opts=shuffle([b.w,...shuffle(pool).slice(0,3)]);app.innerHTML=`<div class="text-game">${bar('Антонимы',state.step+1,21)}<section class="panel"><span class="eyebrow">Найди противоположность</span><p class="center-word" lang="en">${e(a.w)}</p><p class="tiny" style="text-align:center">${e(a.ru)}${s.id==='young-old'?' · возраст':''}${s.id==='right-wrong'?' · оценка ответа':''}</p><p class="lead" style="text-align:center">Выбери слово с противоположным значением.</p><div class="choices">${opts.map(x=>`<button class="choice" data-choice="${e(x)}" lang="en">${e(x)}</button>`).join('')}</div><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="btn push" id="next" hidden>${state.step===20?'Завершить':'Дальше'} →</button></div></section></div>`;bindBack();app.querySelectorAll('[data-choice]').forEach(bu=>bu.onclick=()=>checkChoice(bu,b.w,`${a.w} ↔ ${b.w}`));$('#next').onclick=()=>{state.step++;if(state.step===21){saved.matching=true;save();finish('Антонимы найдены',state.first,21)}else{renderMatching();scroll()}}}
// New, self-contained contexts for transfer: two sentences per pair, one for each meaning.
const mixedExamples=[
 ['This bag is big. Ten books can fit in it.','This bag is small. Only one book fits in it.'],
 ['My hands are clean. I washed them.','My hands are dirty. I need to wash them.'],
 ['The glass is full. There is no room for more water.','The glass is empty. There is no water in it.'],
 ['The soup is hot. Wait before you eat it.','The water is cold. There is ice in it.'],
 ['This book is old. It was printed 100 years ago.','This book is new. I bought it today.'],
 ['This scarf is long. It reaches the floor.','This scarf is short. It does not reach my waist.'],
 ['I like light blue, not dark blue.','I like dark blue, not light blue.'],
 ['Tom is tall. He is 195 cm.','Sam is short. He is 150 cm.'],
 ['The woman is young. She is 20 years old.','The man is old. He is 90 years old.'],
 ['Anna has millions of pounds. She is rich.','Ben has very little money. He is poor.'],
 ['The pen costs £1. It is cheap.','The pen costs £500. It is expensive.'],
 ['The café is on the left, not on the right.','The café is on the right, not on the left.'],
 ['The top shelf is high. I need a ladder.','The bottom shelf is low. It is near the floor.'],
 ['The train is fast. It travels at 200 km per hour.','The bicycle is slow. It travels at 5 km per hour.'],
 ['Both cups are green. They are the same.','One cup is green and one is red. They are different.'],
 ['2 + 2 is easy for me.','47 × 68 is difficult for me without a calculator.'],
 ['2 + 2 = 4. This answer is right.','2 + 2 = 5. This answer is wrong.'],
 ['This box is heavy. I can lift it because I am strong.','I am ill and feel weak. I cannot lift the box.'],
 ['It is sunny and dry. This is good weather for a picnic.','It is raining. This is bad weather for a picnic.'],
 ['The road is closed to cars. It is safe to walk here.','Cars are moving fast. It is dangerous to play on the road.'],
 ['I love this painting. I think it is beautiful.','I do not like this poster. I think it is ugly.']
];
// Mixed retrieval revisits one word from each pair, alternating recognition and written recall.
function startMix(){state={mode:'mix',items:shuffle(scenes.map((_,i)=>({i,side:Math.random()<.5?0:1}))),step:0,first:0,attempted:false,solved:false};renderMix();scroll()}
function renderMix(){let item=state.items[state.step],s=scenes[item.i],w=s.words[item.side],other=s.words[1-item.side],typed=state.step%2===1,example=mixedExamples[item.i][item.side];state.attempted=false;state.solved=false;let opts=shuffle([w.w,other.w]);app.innerHTML=`<div class="text-game">${bar('Финальный микс',state.step+1,21)}<section class="panel"><span class="eyebrow">${typed?'Впиши слово':'Выбери слово'}</span><h2>Закончи фразу</h2><p class="lead">Прочитай контекст и подбери слово.</p><p class="sentence" lang="en">${blank(example,w.w)}</p>${typed?`<form id="form"><label class="sr" for="answer">Ответ на английском</label><input class="input" id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Слово на английском" required><div class="actions"><button class="btn" id="check">Проверить</button><button type="button" class="btn push" id="next" hidden>${state.step===20?'Завершить':'Дальше'} →</button></div></form>`:`<div class="choices">${opts.map(o=>`<button class="choice" data-choice="${e(o)}" lang="en">${e(o)}</button>`).join('')}</div><div class="actions"><button class="btn push" id="next" hidden>${state.step===20?'Завершить':'Дальше'} →</button></div>`}<details class="hint"><summary>Подсказка</summary><p>${e(w.ru)}${w.w==='the same'?' · два слова':''}</p></details><div id="feedback" role="status" aria-live="polite"></div></section></div>`;bindBack();if(typed){$('#form').onsubmit=ev=>{ev.preventDefault();if(state.solved)return;let value=$('#answer').value.trim().toLowerCase().replace(/\s+/g,' ');if(value===w.w||(w.w==='the same'&&value==='same')){if(!state.attempted)state.first++;state.solved=true;$('#answer').disabled=true;$('#check').disabled=true;$('#feedback').innerHTML=`<div class="feedback">Верно! <span lang="en">${e(example)}</span></div>`;$('#next').hidden=false}else{state.attempted=true;$('#feedback').innerHTML='<div class="feedback bad">Попробуй ещё раз. Проверь написание или открой подсказку.</div>'}}}else app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>checkChoice(b,w.w,example));$('#next').onclick=()=>{state.step++;if(state.step===21){saved.mix=true;save();finish('Микс завершён',state.first,21)}else{renderMix();scroll()}}}
$('#home').onclick=home;$('#menu').onclick=home;home();
</script></body></html>
