<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Games — The Honor Trial | Fourth Wing Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FOURTH WING QUEST · SCENE 5 · WAR GAMES (FINAL)
   ============================================================ */
:root{
  --gold:#c9a96e; --gold-bright:#e8c989; --gold-dark:#8b7349;
  --ink:#1a1410; --ink-deep:#0a0806;
  --parch:#f4e8d0; --parch-dark:#d9c9a8;
  --red:#8b2c2c; --red-bright:#c44545;
  --green-ok:#4a7c4e; --blue-mana:#3b5f8f;
  --crimson:#a83232;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Cormorant Garamond',Georgia,serif;color:var(--parch);background:var(--ink-deep);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;position:relative}

#sky-bg{position:fixed;inset:0;z-index:1;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image 1.2s ease,opacity 1.2s ease,filter 1.2s ease}
#sky-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.3) 0%,rgba(10,8,6,.55) 60%,rgba(10,8,6,.85) 100%);pointer-events:none}

#pov-dragon{
  position:fixed;left:50%;bottom:-8%;transform:translateX(-50%);
  width:min(900px,95vw);height:auto;z-index:2;opacity:0;pointer-events:none;
  transition:opacity 1.4s ease;
  filter:drop-shadow(0 -10px 40px rgba(0,0,0,.7))
}
#pov-dragon.visible{opacity:1;animation:dragonFloat 5s ease-in-out infinite}
#pov-dragon.flying{animation:dragonFly 4s ease-in-out infinite}
@keyframes dragonFloat{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(0deg)}
  50%{transform:translateX(-50%) translateY(-18px) rotate(-0.5deg)}
}
@keyframes dragonFly{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}
  25%{transform:translateX(-52%) translateY(-20px) rotate(-2deg)}
  50%{transform:translateX(-50%) translateY(-8px) rotate(0deg)}
  75%{transform:translateX(-48%) translateY(-22px) rotate(2deg)}
}

/* Фон с лёгким параллаксом */
#sky-bg{animation:skyDrift 20s ease-in-out infinite}
@keyframes skyDrift{
  0%,100%{transform:scale(1.05) translateY(0)}
  50%{transform:scale(1.08) translateY(-15px)}
}

.card-wrap{position:relative;z-index:10;width:min(1100px,95vw);max-height:95vh;display:flex;flex-direction:column}
.card{background:linear-gradient(180deg,rgba(20,15,10,.92),rgba(15,10,7,.95));border:1px solid var(--gold-dark);border-radius:4px;box-shadow:0 0 0 1px rgba(201,169,110,.15),0 20px 60px rgba(0,0,0,.7),inset 0 0 80px rgba(0,0,0,.4);position:relative;overflow:hidden;display:flex;flex-direction:column;max-height:95vh}

.corner{position:absolute;width:32px;height:32px;border:1px solid var(--gold);z-index:5;pointer-events:none}
.corner.tl{top:10px;left:10px;border-right:none;border-bottom:none}
.corner.tr{top:10px;right:10px;border-left:none;border-bottom:none}
.corner.bl{bottom:10px;left:10px;border-right:none;border-top:none}
.corner.br{bottom:10px;right:10px;border-left:none;border-top:none}

.head{padding:18px 36px 14px;border-bottom:1px solid rgba(201,169,110,.3);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent)}
.head-left{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.timer-box,.hp-box,.honor-box{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:1.5px;color:var(--gold-bright)}
.timer-box .icon,.hp-box .icon,.honor-box .icon{font-size:16px;filter:drop-shadow(0 0 4px rgba(201,169,110,.5))}
.hp-box .value{color:var(--red-bright)}
.honor-box .value{color:var(--gold-bright)}
.hp-box.low .value{animation:pulseRed .8s ease-in-out infinite}
@keyframes pulseRed{0%,100%{color:var(--red-bright);text-shadow:0 0 8px rgba(196,69,69,.4)}50%{color:#ff6666;text-shadow:0 0 14px rgba(255,102,102,.8)}}
.phase-progress{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px}
.phase-progress .step{color:var(--gold-dark);transition:color .4s ease,text-shadow .4s ease}
.phase-progress .step.active{color:var(--gold-bright);text-shadow:0 0 12px rgba(232,201,137,.6)}
.phase-progress .step.done{color:var(--gold)}
.phase-progress .sep{color:var(--gold-dark);font-size:11px}

.content{padding:24px 36px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--gold-dark) transparent}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}

h1.scene-title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(22px,3vw,32px);letter-spacing:4px;color:var(--gold-bright);text-align:center;text-shadow:0 2px 20px rgba(201,169,110,.4);margin-bottom:6px}
h2.phase-title{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(16px,2vw,20px);letter-spacing:3px;color:var(--gold);text-align:center;text-transform:uppercase}
.scene-subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,1.8vw,18px);color:var(--parch-dark);text-align:center;opacity:.9}

.divider{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold-dark);margin:4px 0}
.divider::before,.divider::after{content:'';flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent)}
.divider .ornament{font-size:14px;color:var(--gold)}

.comms-panel{background:linear-gradient(135deg,rgba(15,12,8,.85),rgba(25,18,12,.85));border:1px solid var(--gold-dark);border-radius:3px;padding:16px 20px;display:flex;gap:18px;align-items:flex-start;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 4px 20px rgba(0,0,0,.4);animation:commsIn .6s ease}
@keyframes commsIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.comms-panel.urgent{border-color:var(--red-bright);animation:commsIn .6s ease,urgentPulse 2s ease-in-out infinite}
@keyframes urgentPulse{0%,100%{box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 0 0 rgba(196,69,69,0)}50%{box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 24px rgba(196,69,69,.5)}}
.comms-panel.formal{border:2px double var(--gold);padding:18px 22px}
.comms-portrait{flex-shrink:0;width:80px;height:80px;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.5);overflow:hidden;box-shadow:0 0 16px rgba(201,169,110,.3);position:relative}
.comms-portrait img{width:100%;height:100%;object-fit:cover;object-position:center top}
.comms-body{flex:1;min-width:0}
.comms-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(201,169,110,.2)}
.comms-name{font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:2px;color:var(--gold-bright);text-transform:uppercase}
.comms-role{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--parch-dark);flex:1}
.comms-audio-btn{background:transparent;border:1px solid var(--gold-dark);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);transition:all .25s ease;font-size:14px}
.comms-audio-btn:hover{background:rgba(201,169,110,.15);border-color:var(--gold);transform:scale(1.08)}
.comms-audio-btn.playing{background:var(--gold);color:var(--ink);animation:audioPulse 1s ease-in-out infinite}
@keyframes audioPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,169,110,.5)}50%{box-shadow:0 0 0 8px rgba(201,169,110,0)}}
.comms-text{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;color:var(--parch);font-style:italic;min-height:1.5em}
.comms-text::after{content:'▌';color:var(--gold);animation:cursorBlink .8s infinite;margin-left:2px}
.comms-text.done::after{display:none}
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.task-card{background:linear-gradient(180deg,rgba(244,232,208,.05),rgba(244,232,208,.02));border:1px solid rgba(201,169,110,.3);border-radius:3px;padding:18px 22px;position:relative}
.task-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.task-label::before,.task-label::after{content:'';flex:1;height:1px;background:rgba(201,169,110,.2)}
.tactical-text{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.65;color:var(--parch);padding:10px 14px;background:rgba(0,0,0,.3);border-left:3px solid var(--gold);border-radius:2px;margin-bottom:14px;font-style:italic}
.tactical-text strong{color:var(--gold-bright);font-style:normal;font-weight:600}
.question-block{margin-bottom:14px}
.question-block:last-child{margin-bottom:0}
.question-text{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-bright);letter-spacing:1px;margin-bottom:10px;font-weight:500}
.question-text .qnum{color:var(--gold);margin-right:8px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{background:rgba(244,232,208,.04);border:1px solid rgba(201,169,110,.3);border-radius:2px;padding:10px 14px;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--parch);cursor:pointer;text-align:left;transition:all .2s ease;position:relative;overflow:hidden}
.option-btn:hover:not(.disabled){background:rgba(201,169,110,.12);border-color:var(--gold);transform:translateX(2px)}
.option-btn.correct{background:rgba(74,124,78,.25);border-color:var(--green-ok);color:#a8e0a8;animation:correctFlash .5s ease}
.option-btn.wrong{background:rgba(139,44,44,.25);border-color:var(--red-bright);color:#ffb8b8;animation:wrongShake .5s ease}
.option-btn.disabled{cursor:not-allowed;opacity:.5}
.option-btn.hidden-by-signet{opacity:.25;text-decoration:line-through;pointer-events:none}
.option-btn.hinted{box-shadow:0 0 16px rgba(232,201,137,.5);border-color:var(--gold-bright);animation:hintGlow 1.5s ease-in-out infinite}
@keyframes correctFlash{0%{background:rgba(74,124,78,.6)}100%{background:rgba(74,124,78,.25)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes hintGlow{0%,100%{box-shadow:0 0 8px rgba(232,201,137,.4)}50%{box-shadow:0 0 20px rgba(232,201,137,.8)}}

.listening-text{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:2;color:var(--parch);padding:14px 18px;background:rgba(0,0,0,.3);border-left:3px solid var(--gold);border-radius:2px;margin-bottom:14px;font-style:italic}
/* ===== GAP SELECT — стилизация выпадающего списка ===== */
.gap-select{
  display:inline-block;
  background:rgba(20,15,10,.95);
  border:1px solid var(--gold);
  border-radius:2px;
  padding:3px 26px 3px 10px;
  font-family:'Cinzel',serif;
  font-size:15px;
  letter-spacing:1.5px;
  color:var(--gold-bright);
  cursor:pointer;
  font-style:normal;
  min-width:130px;
  text-align:center;
  text-align-last:center;
  margin:0 3px;
  transition:all .2s ease;
  /* Убираем дефолтную стрелку браузера и рисуем свою */
  -webkit-appearance:none;
  -moz-appearance:none;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%23c9a96e' d='M6 8L0 0h12z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:9px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.5), 0 0 0 1px rgba(201,169,110,.15);
}
.gap-select:hover{
  background-color:rgba(201,169,110,.18);
  border-color:var(--gold-bright);
  box-shadow:inset 0 0 12px rgba(0,0,0,.4), 0 0 12px rgba(232,201,137,.3);
}
.gap-select:focus{
  outline:none;
  border-color:var(--gold-bright);
  box-shadow:inset 0 0 12px rgba(0,0,0,.4), 0 0 0 2px rgba(232,201,137,.4);
}
.gap-select.correct{
  background-color:rgba(74,124,78,.35);
  border-color:var(--green-ok);
  color:#c8f0c8;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%234a7c4e' d='M6 8L0 0h12z'/></svg>");
  box-shadow:inset 0 0 12px rgba(74,124,78,.3), 0 0 12px rgba(74,124,78,.4);
}
.gap-select.wrong{
  background-color:rgba(139,44,44,.35);
  border-color:var(--red-bright);
  color:#ffd0d0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%23c44545' d='M6 8L0 0h12z'/></svg>");
  box-shadow:inset 0 0 12px rgba(139,44,44,.3), 0 0 12px rgba(196,69,69,.4);
}
.gap-select:disabled{
  cursor:not-allowed;
  opacity:.95;
}

/* Стилизация раскрытого списка (option-ов) */
.gap-select option{
  background:#1a1410;
  color:var(--parch);
  font-family:'Cormorant Garamond',serif;
  font-size:17px;
  font-style:italic;
  padding:8px 12px;
  letter-spacing:0;
}
.gap-select option:checked{
  background:var(--gold) !important;
  color:var(--ink) !important;
  font-weight:600;
}
.gap-select option:hover{
  background:rgba(201,169,110,.3);
}
.gap-select option[value=""]{
  color:var(--gold-dark);
  font-style:italic;
}

.selection-grid{display:grid;gap:12px;width:100%}
.selection-grid.dragons{grid-template-columns:repeat(2,1fr)}
.selection-grid.signets{grid-template-columns:repeat(3,1fr)}
.select-card{background:linear-gradient(180deg,rgba(244,232,208,.06),rgba(244,232,208,.02));border:1px solid var(--gold-dark);border-radius:3px;padding:14px;cursor:pointer;text-align:center;transition:all .3s ease;position:relative;overflow:hidden}
.select-card:hover{background:rgba(201,169,110,.12);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 16px rgba(201,169,110,.2)}
.select-card.selected{background:rgba(201,169,110,.2);border-color:var(--gold-bright);box-shadow:0 0 24px rgba(232,201,137,.5)}
.select-card .sigil{width:60px;height:60px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.select-card .sigil svg{width:100%;height:100%}
.select-card.selected .sigil{color:var(--gold-bright);filter:drop-shadow(0 0 8px rgba(232,201,137,.6))}
.select-card .name{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:var(--gold-bright);text-transform:uppercase;margin-bottom:4px}
.select-card .desc{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--parch-dark);font-style:italic;line-height:1.3}
.select-card .dragon-mini{width:90px;height:90px;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}

.choices-grid{display:flex;flex-direction:column;gap:10px}
.choice-btn{background:linear-gradient(180deg,rgba(244,232,208,.06),rgba(244,232,208,.02));border:1px solid var(--gold-dark);border-left:4px solid var(--gold-dark);border-radius:2px;padding:14px 18px;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--parch);cursor:pointer;text-align:left;transition:all .25s ease;display:flex;gap:14px;align-items:flex-start}
.choice-btn:hover:not(:disabled){background:rgba(201,169,110,.12);border-color:var(--gold);border-left-color:var(--gold-bright);transform:translateX(3px)}
.choice-btn:disabled{opacity:.4;cursor:not-allowed}
.choice-btn .label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--gold-bright);padding:3px 8px;border:1px solid var(--gold);border-radius:2px;flex-shrink:0;white-space:nowrap}
.choice-btn .label.defiant{color:#ff9b6e;border-color:#ff9b6e}
.choice-btn .label.humble{color:#9ec0ff;border-color:#9ec0ff}
.choice-btn .label.personal{color:#ff8fb1;border-color:#ff8fb1}
.choice-btn .label.formal{color:#9ec0ff;border-color:#9ec0ff}
.choice-btn .text{flex:1;font-style:italic;line-height:1.4}

.foot{padding:14px 36px 18px;border-top:1px solid rgba(201,169,110,.3);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent);flex-wrap:wrap}
.foot-hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--parch-dark);opacity:.85;flex:1;min-width:200px}
.foot-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:11px 22px;background:transparent;border:1px solid var(--gold);color:var(--gold-bright);cursor:pointer;transition:all .25s ease;border-radius:2px;position:relative;overflow:hidden}
.btn:hover:not(:disabled){background:var(--gold);color:var(--ink);box-shadow:0 0 20px rgba(201,169,110,.5)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.primary{background:rgba(201,169,110,.15);border-width:2px}
.btn.signet{border-color:#a78bfa;color:#c4b5fd}
.btn.signet:hover:not(:disabled){background:#7c5fc0;color:#fff;box-shadow:0 0 24px rgba(167,139,250,.6)}
.btn.signet.used{opacity:.4;border-color:var(--gold-dark);color:var(--gold-dark)}

.timer-bar-wrap{width:100%;height:4px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden;margin-bottom:12px}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--gold-bright),var(--gold));transition:width .2s linear;box-shadow:0 0 8px rgba(201,169,110,.6)}
.timer-bar.warn{background:linear-gradient(90deg,#ffa050,#c44545)}

#intro-screen{position:fixed;inset:0;z-index:1000;background:var(--ink-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;opacity:1;transition:opacity 1.5s ease}
#intro-screen.fading{opacity:0;pointer-events:none}
.intro-text{font-family:'Cormorant Garamond',serif;font-size:clamp(21px,2.8vw,30px);line-height:1.8;color:var(--parch);max-width:780px;text-align:center;font-style:italic;min-height:6em}
.intro-text::after{content:'▌';color:var(--gold);animation:cursorBlink .8s infinite;margin-left:4px}
.intro-text.done::after{display:none}
.intro-continue{margin-top:40px;opacity:0;transition:opacity .8s ease}
.intro-continue.visible{opacity:1}

#final-screen{display:none;flex-direction:column;align-items:center;gap:18px;padding:30px 20px;text-align:center}
#final-screen.active{display:flex}
.final-emblem{font-size:54px;filter:drop-shadow(0 0 20px rgba(201,169,110,.5));margin-bottom:6px;animation:emblemPulse 2.4s ease-in-out infinite}
@keyframes emblemPulse{0%,100%{filter:drop-shadow(0 0 20px rgba(201,169,110,.5))}50%{filter:drop-shadow(0 0 36px rgba(232,201,137,.9))}}
.final-title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(20px,2.6vw,28px);letter-spacing:5px;color:var(--gold-bright);text-shadow:0 0 24px rgba(201,169,110,.5)}
.final-stats{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;margin:14px 0;font-family:'Cinzel',serif;font-size:14px;letter-spacing:1.5px;text-align:left}
.final-stats .lbl{color:var(--gold);text-transform:uppercase;font-size:12px}
.final-stats .val{color:var(--parch);font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic}
.final-stats .val.honor{color:var(--gold-bright)}
.final-stats .val.verdict{color:var(--gold-bright);font-weight:600;letter-spacing:2px}
.final-stats .val.verdict.failed{color:var(--red-bright)}
.final-stats .val.verdict.disappointed{color:#ffb060}
.final-stats .val.bond-romance{color:#ff8fb1}
.final-verdict-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2vw,22px);color:var(--parch);max-width:640px;line-height:1.6;padding:18px 26px;background:rgba(0,0,0,.4);border-left:3px solid var(--gold);border-right:3px solid var(--gold);border-radius:2px;margin:10px 0}
.final-verdict-sign{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:var(--gold);margin-top:8px}

.float-feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-size:32px;font-weight:700;letter-spacing:4px;color:var(--gold-bright);text-shadow:0 0 30px rgba(232,201,137,.8);z-index:500;pointer-events:none;animation:floatFade 1.4s ease-out forwards}

// ============================================================
// AUDIO HELPERS
// ============================================================
let currentAudio = null;
function playAudio(src){
  if(!src) return;
  stopAudio();
  try{
    currentAudio = new Audio(src);
    currentAudio.volume = 0.85;
    currentAudio.play().catch(()=>{});
  }catch(e){}
}
function stopAudio(){
  if(currentAudio){
    try{ currentAudio.pause(); }catch(e){}
    currentAudio = null;
  }
}
function playSfx(src, vol=0.5){
  if(!src) return;
  try{
    const a = new Audio(src);
    a.volume = vol;
    a.play().catch(()=>{});
  }catch(e){}
}

// ============================================================
// TYPING EFFECT
// ============================================================
function typeText(el, text, speed=24, callback){
  el.classList.remove('done');
  el.innerHTML = '';
  let i = 0;
  const tick = ()=>{
    if(i < text.length){
      if(text[i] === '<'){
        const end = text.indexOf('>', i);
        el.innerHTML += text.slice(i, end+1);
        i = end + 1;
      } else {
        el.innerHTML += text[i];
        i++;
      }
      setTimeout(tick, speed);
    } else {
      el.classList.add('done');
      if(callback) callback();
    }
  };
  tick();
}

// ============================================================
// FLOAT FEEDBACK
// ============================================================
function floatFeedback(text, isMinus=false){
  const el = document.createElement('div');
  el.className = 'float-feedback' + (isMinus ? ' minus' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1400);
}

// ============================================================
// HP / HONOR
// ============================================================
function changeHP(delta){
  STATE.hp = Math.max(0, Math.min(120, STATE.hp + delta));
  document.getElementById('hp-val').textContent = STATE.hp;
  document.getElementById('hp-box').classList.toggle('low', STATE.hp <= 30);
  if(delta !== 0) floatFeedback((delta>0?'+':'') + delta + ' HP', delta<0);
}
function changeHonor(delta, isCreative=false){
  // Apply Vorrath bonus to creative choices
  if(isCreative && STATE.dragon === 'vorrath' && delta > 0){
    delta = Math.round(delta * 1.5);
  }
  STATE.honor = Math.max(0, STATE.honor + delta);
  document.getElementById('honor-val').textContent = STATE.honor;
  if(delta !== 0) floatFeedback((delta>0?'+':'') + delta + ' HONOR', delta<0);
}

// ============================================================
// TIMER
// ============================================================
function startTimer(){
  STATE.startTime = Date.now();
  STATE.timerInterval = setInterval(()=>{
    const elapsed = Math.floor((Date.now() - STATE.startTime) / 1000);
    const m = String(Math.floor(elapsed/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    document.getElementById('timer-val').textContent = `${m}:${s}`;
  }, 1000);
}

// ============================================================
// PHASE PROGRESS / BACKGROUND / DRAGON

function updatePhaseProgress(phase){
  document.querySelectorAll('.phase-progress .step').forEach(el=>{
    const p = parseInt(el.dataset.phase);
    el.classList.remove('active','done');
    if(p < phase) el.classList.add('done');
    else if(p === phase) el.classList.add('active');
  });
}
function setBackground(key){
  const bg = document.getElementById('sky-bg');
  if(ASSETS.bg[key]) bg.style.backgroundImage = `url('${ASSETS.bg[key]}')`;
}
function showDragon(dragonId){
  const el = document.getElementById('pov-dragon');
  const d = DRAGONS.find(x=>x.id===dragonId);
  if(d){
    el.src = d.img;
    el.classList.add('visible');
  }
}
function hideDragon(){
  document.getElementById('pov-dragon').classList.remove('visible');
}

// ============================================================
// COMMS PANEL
// ============================================================
function buildCommsPanel({npc, text, urgent=false, formal=false, audioKey='', onDone}){
  const panel = document.createElement('div');
  panel.className = 'comms-panel';
  if(urgent) panel.classList.add('urgent');
  if(formal) panel.classList.add('formal');

  panel.innerHTML = `
    <div class="comms-portrait"><img src="${npc.portrait}" alt="${npc.name}" onerror="this.style.display='none'"/></div>
    <div class="comms-body">
      <div class="comms-header">
        <span class="comms-name">${npc.name}</span>
        <span class="comms-role">${npc.role}</span>
        <button class="comms-audio-btn" title="Play voice">🔊</button>
      </div>
      <div class="comms-text"></div>
    </div>
  `;

  const audioSrc = ASSETS.audio[audioKey] || '';
  const audioBtn = panel.querySelector('.comms-audio-btn');
  const txt = panel.querySelector('.comms-text');

  audioBtn.onclick = ()=>{
    if(audioSrc){
      playAudio(audioSrc);
      audioBtn.classList.add('playing');
      setTimeout(()=>audioBtn.classList.remove('playing'), 4000);
    }
  };

  if(audioSrc){
    setTimeout(()=>{
      playAudio(audioSrc);
      audioBtn.classList.add('playing');
      setTimeout(()=>audioBtn.classList.remove('playing'), 4000);
    }, 400);
  }

  setTimeout(()=>{
    typeText(txt, text, 22, onDone);
  }, 250);

  return panel;
}

      setTimeout(()=>{
        i++;

          setTimeout(next, 400);
        } else {
          continueBtn.classList.add('visible');
        }
      }, 1500);
    });
  };
  setTimeout(next, 600);

  continueBtn.onclick = ()=>{
    document.getElementById('intro-screen').classList.add('fading');
    setTimeout(()=>{
      document.getElementById('intro-screen').style.display = 'none';
      startTimer();
      runPhase0();
    }, 1500);

}

    }

function buildPhase2Listening(){
  const container = document.getElementById('listening-text');
  // Более явный regex без вложенности
  const gapRegex = /\[\[(\d+)\|([^|\]]+)\|([^\]]+)\]\]/g;
  let html = PHASE2.listeningText;
  const gaps = [];

  console.log('[Phase2] Source text:', html.substring(0, 200));
  console.log('[Phase2] Matches found:', html.match(gapRegex));

  html = html.replace(gapRegex, (match, id, correct, optsStr)=>{
    const opts = optsStr.split(',').map(o=>o.trim());
    const shuffled = [...opts].sort(()=>Math.random()-0.5);
    gaps.push({ id:parseInt(id), correct:correct.trim() });
    const optionsHtml = shuffled.map(o=>`<option value="${o}">${o}</option>`).join('');
    return `<select class="gap-select" data-gap-id="${id}" data-correct="${correct.trim()}"><option value="">— ? —</option>${optionsHtml}</select>`;
  });

  console.log('[Phase2] Gaps registered:', gaps.length);
  container.innerHTML = html;

  const totalGaps = gaps.length;
  let filled = 0;
  const answers = {};

  const selects = container.querySelectorAll('.gap-select');
  console.log('[Phase2] Select elements in DOM:', selects.length);

  selects.forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const id = sel.dataset.gapId;
      const correct = sel.dataset.correct;
      const val = sel.value;
      if(!val) return;
      if(answers[id] === undefined) filled++;
      answers[id] = val;
      sel.classList.remove('correct','wrong');
      if(val === correct){
        sel.classList.add('correct');
        changeHonor(+4);
      } else {
        sel.classList.add('wrong');
        changeHP(-5);
      }
      sel.disabled = true;

      if(filled === totalGaps){
        document.getElementById('phase2-next').disabled = false;
        setFooterHint('Signal received. Ready to engage.');
      }
    });
  });

  document.getElementById('phase2-next').onclick = ()=>{
    playSfx(ASSETS.audio.growl, 0.5);
    runPhase3();
  };
}

function showPhase3Question(){
  if(phase3State.qIndex >= PHASE3.questions.length){
    clearInterval(phase3State.timerInterval);
    setTimeout(runPhase4, 600);
    return;
  }

  const q = PHASE3.questions[phase3State.qIndex];
  document.getElementById('qf-label').textContent = `Question ${phase3State.qIndex+1} of ${PHASE3.questions.length}`;

  // 30 sec base + dragon bonus
  const d = DRAGONS.find(x=>x.id===STATE.dragon);
  const baseTime = 30 + (d ? d.bonus.timer : 0);
  phase3State.timeLeft = baseTime;
  const bar = document.getElementById('qf-timer-bar');
  bar.classList.remove('warn');
  bar.style.width = '100%';

  // Comms: scene description + question text — NO audio per question
  const commsContainer = document.getElementById('qf-comms');
  commsContainer.innerHTML = '';
  const fullText = (q.scene ? q.scene + '<br><br>' : '') + q.q;
  const panel = buildCommsPanel({
    npc:q.npc,
    text:fullText,
    urgent:true,
    audioKey:''  // ← intro-аудио уже отыграло, вопросы без аудио
  });
  commsContainer.appendChild(panel);

  // Hint line
  const qDiv = document.getElementById('qf-question');
  qDiv.innerHTML = `
    ${q.hint ? `<div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--gold);text-align:center;margin:8px 0 12px;opacity:.75">✦ ${q.hint} ✦</div>` : ''}
    <div class="options-grid" id="qf-options"></div>`;
  const grid = document.getElementById('qf-options');

  q.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.dataset.idx = i;
    btn.onclick = ()=> answerPhase3(i, q);
    grid.appendChild(btn);
  });

  if(phase3State.signetActiveEffect){
    applySignetEffect(phase3State.signetActiveEffect, grid, q.correct);
    phase3State.signetActiveEffect = null;
  }

  clearInterval(phase3State.timerInterval);
  const startTime = Date.now();
  const initialTime = phase3State.timeLeft;
  phase3State.timerInterval = setInterval(()=>{
    const elapsed = (Date.now() - startTime) / 1000;
    phase3State.timeLeft = Math.max(0, initialTime - elapsed);
    const pct = (phase3State.timeLeft / baseTime) * 100;
    bar.style.width = Math.min(100, pct) + '%';
    if(phase3State.timeLeft < 10) bar.classList.add('warn');
    if(phase3State.timeLeft <= 0){
      clearInterval(phase3State.timerInterval);
      grid.querySelectorAll('.option-btn').forEach(b=>b.classList.add('disabled'));
      grid.querySelectorAll('.option-btn')[q.correct].classList.add('correct');
      floatFeedback('TIMEOUT', true);
      // ← мягкий timeout: без штрафа HP
      setTimeout(()=>{
        phase3State.qIndex++;
        showPhase3Question();
      }, 1300);
    }
  }, 100);
}

function answerPhase3(chosen, q){
  clearInterval(phase3State.timerInterval);
  const grid = document.getElementById('qf-options');
  grid.querySelectorAll('.option-btn').forEach(b=>b.classList.add('disabled'));
  const chosenBtn = grid.querySelector(`[data-idx="${chosen}"]`);

  if(chosen === q.correct){
    chosenBtn.classList.add('correct');
    const d = DRAGONS.find(x=>x.id===STATE.dragon);
    let honorGain = 8;  // ← было 6
    if(d && d.bonus.dmgMul > 1) honorGain = Math.round(honorGain * d.bonus.dmgMul);
    changeHonor(honorGain, q.creative);
    STATE.qfCorrect++;
  } else {
    chosenBtn.classList.add('wrong');
    grid.querySelector(`[data-idx="${q.correct}"]`).classList.add('correct');
    if(phase3State.shieldActive){
      floatFeedback('SHIELDED', false);
      phase3State.shieldActive = false;
      renderSignetButton();
    } else {
      changeHP(-6);  // ← было -12
    }
  }

  setTimeout(()=>{
    phase3State.qIndex++;
    showPhase3Question();
  }, 1400);
}

// SIGNET LOGIC
// ============================================================
function openSignetOverlay(){
  if(STATE.signetUsed) return;
  const signet = SIGNETS.find(s=>s.id===STATE.signet);
  document.getElementById('signet-title').textContent = '✦ ' + signet.name + ' ✦';
  document.getElementById('signet-desc').textContent = signet.desc;
  document.getElementById('signet-cost').textContent = '⚠ ONE USE ONLY';
  document.getElementById('signet-overlay').classList.add('active');

  document.getElementById('signet-cancel').onclick = ()=>{
    document.getElementById('signet-overlay').classList.remove('active');
  };
  document.getElementById('signet-confirm').onclick = ()=>{
    document.getElementById('signet-overlay').classList.remove('active');
    castSignet(signet);
  };
}

function castSignet(signet){
  STATE.signetUsed = true;
  floatFeedback('✦ ' + signet.name + ' ✦', false);

  const grid = document.getElementById('qf-options');
  const q = PHASE3.questions[phase3State.qIndex];

  switch(signet.effect){
    case 'peek':
      // Memory Reading — flash correct answer for 1.2 sec
      if(grid && q){
        const correctBtn = grid.querySelectorAll('.option-btn')[q.correct];
        correctBtn.classList.add('hinted');
        setTimeout(()=>correctBtn.classList.remove('hinted'), 1200);
      }
      break;

    case 'skip':
      // Distance Wielding — skip current question with no penalty
      clearInterval(phase3State.timerInterval);
      if(grid) grid.querySelectorAll('.option-btn').forEach(b=>b.classList.add('disabled'));
      floatFeedback('SKIPPED', false);
      setTimeout(()=>{
        phase3State.qIndex++;
        showPhase3Question();
      }, 800);
      break;

    case 'time':
      // Summoning — +10 seconds
      phase3State.timeLeft += 10;
      floatFeedback('+10 SEC', false);
      // Re-render bar will happen next tick automatically
      break;

    case 'shield':
      // Warding — block next wrong answer
      phase3State.shieldActive = true;
      break;

    case 'fifty':
      // Shadow — eliminate 2 wrong options
      if(grid && q){
        const opts = Array.from(grid.querySelectorAll('.option-btn'));
        const wrongs = opts.filter((b,i)=> i !== q.correct && !b.classList.contains('disabled'));
        wrongs.sort(()=>Math.random()-0.5);
        wrongs.slice(0,2).forEach(b=>b.classList.add('hidden-by-signet'));
      }
      break;

    case 'heal':
      // Mending — +15 HP
      changeHP(+15);
      break;
  }

  renderSignetButton();
}

    btn.className = 'choice-btn';
    const labelClass = choice.id === 'personal' ? 'personal' : 'formal';
    btn.innerHTML = `
      <span class="label ${labelClass}">${choice.label}</span>
      <span class="text">${choice.text}</span>
    `;
    btn.onclick = ()=> selectRomanceChoice(choice);
    grid.appendChild(btn);
  });
}

function selectRomanceChoice(choice){
  document.querySelectorAll('#phase4-romance-choices .choice-btn').forEach(b=>b.disabled = true);
  STATE.romanceFlag = choice.romance;
  if(choice.romance) changeHonor(+3);

  setTimeout(()=>{
    const respDiv = document.getElementById('phase4-final-response');
    respDiv.style.display = 'block';
    respDiv.innerHTML = '';
    const respPanel = buildCommsPanel({
      npc:PHASE4.npc,
      text:choice.response,
      formal:true,
      audioKey:'',
      onDone:()=>{
        setTimeout(()=>{
          setFooterHint('The trial is complete. The Council deliberates...');
          setFooterActions('<button class="btn primary" id="finish-btn">Receive Verdict →</button>');
          document.getElementById('finish-btn').onclick = showFinalScreen;
        }, 800);
      }
    });
    respDiv.appendChild(respPanel);
  }, 700);
}

// ============================================================
// FINAL VERDICT
// ============================================================
function determineVerdict(){
  const h = STATE.honor;
  const hp = STATE.hp;

  if(hp <= 0){
    return {
      key:'fallen',
      title:'FALLEN IN BATTLE',
      cssClass:'verdict failed',
      emblem:'💀',
      text:'"You did not return from the ridge, rider. Your dragon mourned, then took to the skies alone. The Council records your name in the Wall of the Lost. May your courage be remembered — and your mistakes studied."',
      sign:'— Caeden Aurelis, Adjudicator'
    };
  }
  if(h >= 75 && STATE.phase4ReadingCorrect && (STATE.speakingChoice === 'honorable' || STATE.speakingChoice === 'defiant')){
    return {
      key:'exemplar',
      title:'EXEMPLAR OF THE FOURTH WING',
      cssClass:'verdict',
      emblem:'🏆',
      text:'"You held your wing. You answered with honor. You understood the Council\'s balance. Few first-year riders earn the title of Exemplar — fewer still deserve it. Rise, rider. Your name is recorded in gold."',
      sign:'— Caeden Aurelis, Adjudicator'
    };
  }
  if(h >= 55){
    return {
      key:'commended',
      title:'COMMENDED RIDER',
      cssClass:'verdict',
      emblem:'⚔',
      text:'"You acquitted yourself well. The mistakes were honest, the courage real. The Council finds no fault worth pursuing today — but remember, rider: war does not grade on a curve. Train harder."',
      sign:'— Caeden Aurelis, Adjudicator'
    };
  }
  if(h >= 30){
    return {
      key:'reprimanded',
      title:'REPRIMANDED',
      cssClass:'verdict disappointed',
      emblem:'⚠',
      text:'"You survived. That is the lowest bar a rider can clear, and you barely cleared it. The Council expects improvement. The next trial will not be so forgiving."',
      sign:'— Caeden Aurelis, Adjudicator'
    };
  }
  return {
    key:'dishonored',
    title:'DISHONORED',
    cssClass:'verdict failed',
    emblem:'⚫',
    text:'"You returned alive. That is all the Council can say in your favor. Your conduct today shamed the Wing. You will repeat the trial — or you will turn in your saddle."',
    sign:'— Caeden Aurelis, Adjudicator'
  };
}

function showFinalScreen(){
  clearInterval(STATE.timerInterval);
  stopAudio();

  const verdict = determineVerdict();
  const elapsed = Math.floor((Date.now() - STATE.startTime) / 1000);
  const m = String(Math.floor(elapsed/60)).padStart(2,'0');
  const s = String(elapsed%60).padStart(2,'0');

  const dragon = DRAGONS.find(d=>d.id===STATE.dragon);
  const signet = SIGNETS.find(s=>s.id===STATE.signet);

  // Bond status
  const bondStatus = STATE.romanceFlag
    ? '<span style="color:#ff8fb1">❤ Crimson Tie — A bond unspoken</span>'
    : '<span style="color:#9ec0ff">⚖ Adjudicator — Respect, nothing more</span>';

  clearContent();
  setFooterHint('');
  setFooterActions('<button class="btn primary" id="end-btn">⚔ End of Trial ⚔</button>');

  const wrap = document.createElement('div');
  wrap.id = 'final-screen';
  wrap.className = 'active';
  wrap.innerHTML = `
    <div class="final-emblem">${verdict.emblem}</div>
    <h1 class="scene-title">VERDICT OF THE COUNCIL</h1>
    <div class="divider"><span class="ornament">✦</span></div>

    <div class="final-stats">
      <div class="lbl">Verdict</div>
      <div class="val ${verdict.cssClass}">${verdict.title}</div>

      <div class="lbl">Dragon</div>
      <div class="val">${dragon ? dragon.name : '—'}</div>

      <div class="lbl">Signet</div>
      <div class="val">${signet ? signet.name : '—'} ${STATE.signetUsed ? '<span style="color:var(--gold)">(channelled)</span>' : '<span style="color:var(--gold-dark)">(unused)</span>'}</div>

      <div class="lbl">Honor Earned</div>
      <div class="val honor">🏅 ${STATE.honor}</div>

      <div class="lbl">HP Remaining</div>
      <div class="val">❤️ ${STATE.hp}</div>

      <div class="lbl">Quick-fire</div>
      <div class="val">${STATE.qfCorrect} / ${STATE.qfTotal} correct</div>

      <div class="lbl">Time</div>
      <div class="val">⏱ ${m}:${s}</div>

      <div class="lbl">Speaking</div>
      <div class="val">${STATE.speakingChoice ? STATE.speakingChoice.toUpperCase() : '—'}</div>

      <div class="lbl">Reading Final</div>
      <div class="val">${STATE.phase4ReadingCorrect ? '<span style="color:#a8e0a8">✓ Correct</span>' : '<span style="color:#ffb8b8">✗ Incorrect</span>'}</div>

      <div class="lbl">Bond</div>
      <div class="val bond-romance">${bondStatus}</div>
    </div>

    <div class="final-verdict-text">
      ${verdict.text}
      <div class="final-verdict-sign">${verdict.sign}</div>
    </div>
  `;
  document.getElementById('content').appendChild(wrap);

  document.getElementById('end-btn').onclick = ()=>{
    // End of quest — no transition to next scene
    const msg = STATE.romanceFlag
      ? '⚔ The trial is complete. ⚔\n\nYou have earned the right to call him Caeden.\nThe Recognition Ceremony awaits — but that is a story for another sky.\n\nThank you for flying, rider.'
      : '⚔ The trial is complete. ⚔\n\nThe Adjudicator has spoken. You have earned your place — or lost it.\nThe sky remembers every choice.\n\nThank you for flying, rider.';
    alert(msg);
  };
}

// ============================================================
// BOOT
// ============================================================
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('hp-val').textContent = STATE.hp;
  document.getElementById('honor-val').textContent = STATE.honor;
  document.getElementById('timer-val').textContent = '00:00';
  setBackground('dawn');
  runIntro();
});

</script>
</body>
</html>
