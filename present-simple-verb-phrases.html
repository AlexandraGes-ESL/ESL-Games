function renderTheory(){$('label').textContent='Look and notice';$('title').textContent='Every morning';$('intro').textContent='Read the sentences. Look at the verb.';$('body').innerHTML='<div class="pattern">I drink tea.<br>She drink<span class="accent">s</span> coffee.</div><div class="tile"><p class="pattern">I <b>don’t</b> drink tea.<br>She <b>doesn’t</b> drink tea.</p></div>';$('hint').innerHTML='С he, she, it в утверждении — <b>-s</b>. После don’t / doesn’t — глагол без -s.';$('feedback').className='feedback';$('feedback').textContent='';$('hintBox').open=false;$('controls').innerHTML='';$('next').disabled=false}
function renderYour(){$('label').textContent='Make it yours';$('title').textContent='Your turn';$('intro').textContent='Write two true sentences about you. They are not scored.';$('body').innerHTML='<p class="pattern">I <input class="field" placeholder="I …" aria-label="Positive sentence"></p><p class="pattern">I don’t <input class="field" placeholder="verb" aria-label="Negative sentence"></p>';$('hint').textContent='После I — глагол без -s. После don’t — глагол без -s.';$('feedback').textContent='';$('controls').innerHTML='';$('next').disabled=false}
function renderResult(){const first=TASKS.map((_,i)=>st.first[i]===true);const score=first.filter(Boolean).length;const missed=TASKS.map((_,i)=>i).filter(i=>st.first[i]!==true);const pct=Math.round(score/TASKS.length*100);$('label').textContent=st.mode==='repeat'?'Repeat':'Result';$('title').textContent='Your result';$('intro').textContent='First-try score counts only from the main lesson.';$('body').innerHTML='<p class="score">'+score+' / '+TASKS.length+' · '+pct+'%</p>'+(missed.length?'<h3>To review</h3><ul class="miss">'+missed.map(i=>'<li>'+TASKS[i].full+'</li>').join('')+'</ul>':'<p>Excellent! Every task was correct on the first try.</p>');$('hint').textContent='';$('hintBox').hidden=true;$('feedback').textContent='';$('controls').innerHTML=(missed.length?'<button class="btn" id="repeat" type="button">Повторить ошибки</button>':'')+'<button class="btn" id="restart" type="button">Начать заново</button>';$('next').disabled=true;if($('repeat'))$('repeat').onclick=()=>{st.mode='repeat';st.queue=missed;st.pos=0;build();render();save()};$('restart').onclick=()=>{if(!confirm('Start again and clear your progress?'))return;st={pos:0,mode:'main',first:{},done:{},queue:[]};build();render();save()}}
function render(){const s=screens[st.pos];$('hintBox').hidden=false;const art=s.k==='task'&&TASKS[s.i].r===3||s.k==='your'?AFTERNOON:MORNING;$('art').src=art;$('art').alt=s.k==='task'?'Lesson picture':'Lesson picture';$('bar').style.width=(st.pos/(screens.length-1)*100)+'%';$('counter').textContent=(st.pos+1)+' / '+screens.length;$('back').disabled=st.pos===0;$('next').textContent=st.pos===screens.length-1?'Finish':'Дальше →';$('next').hidden=s.k==='result';$('back').hidden=s.k==='result';if(s.k==='theory')renderTheory();else if(s.k==='task')renderTask(s.i);else if(s.k==='your')renderYour();else renderResult();if(s.k!=='task'){$('next').disabled=false}}
$('next').onclick=()=>{if(st.pos<screens.length-1){st.pos++;save();render()}};$('back').onclick=()=>{if(st.pos>0){st.pos--;save();render()}};
build();render();
</script></body></html>
